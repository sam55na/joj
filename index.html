<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🃏 بطاقات الحظ - بريميوم</title>
    <script src="https://telegram.org/js/telegram-web-app.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            position: relative;
        }

        /* ===== خلفية سينمائية ===== */
        .cinematic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(88, 0, 255, 0.08), transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 215, 0, 0.05), transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(255, 0, 100, 0.03), transparent 50%),
                #0a0a0a;
            overflow: hidden;
        }

        /* جسيمات متحركة */
        .particles-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.4), transparent);
            animation: particleFloat linear infinite;
            pointer-events: none;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1); opacity: 0; }
        }

        /* وامضات ضوئية */
        .light-flash {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 50% 50%, rgba(255,215,0,0.03), transparent 70%);
            animation: flashMove 12s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes flashMove {
            0%, 100% { transform: translateX(-30%) rotate(0deg) scale(1); opacity: 0.5; }
            50% { transform: translateX(30%) rotate(5deg) scale(1.2); opacity: 1; }
        }

        /* خطوط ضوئية متقاطعة */
        .cross-lines {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.03;
        }
        .cross-lines::before,
        .cross-lines::after {
            content: '';
            position: absolute;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
        }
        .cross-lines::before {
            width: 100%;
            height: 1px;
            top: 50%;
            animation: lineMove 8s ease-in-out infinite;
        }
        .cross-lines::after {
            width: 1px;
            height: 100%;
            left: 50%;
            animation: lineMove 8s ease-in-out infinite reverse;
        }
        @keyframes lineMove {
            0%, 100% { transform: scaleX(0.3); opacity: 0.3; }
            50% { transform: scaleX(1); opacity: 1; }
        }

        /* ===== النص العلوي ===== */
        .banner-text {
            text-align: center;
            padding: 14px 28px;
            margin: 10px auto 12px;
            width: 100%;
            max-width: 520px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 24px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            font-size: 22px;
            font-weight: 900;
            color: #FFD700;
            letter-spacing: 2px;
            backdrop-filter: blur(30px);
            position: relative;
            z-index: 1;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.1);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            font-family: 'Orbitron', sans-serif;
        }
        .banner-text .gold-text {
            background: linear-gradient(135deg, #FFD700, #FF8C00, #FFD700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 3s ease-in-out infinite;
        }
        @keyframes goldShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== شاشة التحميل ===== */
        .loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #0a0a0a;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .loading-screen.active { display: flex; }
        .loading-screen .loader-ring {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid rgba(255, 215, 0, 0.03);
            border-top: 3px solid #FFD700;
            animation: spinRing 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            position: relative;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.05);
        }
        .loading-screen .loader-ring::before {
            content: '🃏';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 44px;
            animation: pulseIcon 1.5s ease-in-out infinite;
        }
        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseIcon {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }
        .loading-screen .loader-text {
            color: #666;
            font-size: 12px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .loading-screen .progress-bar {
            width: 220px;
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
            overflow: hidden;
        }
        .loading-screen .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* ===== حاوية البطاقات ===== */
        .cards-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 10px;
            z-index: 1;
            display: none;
            perspective: 1800px;
        }
        .cards-container.show {
            display: block;
            animation: containerIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes containerIn {
            0% { opacity: 0; transform: translateY(50px) scale(0.9) rotateX(10deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            justify-content: center;
        }

        /* ===== البطاقة الاحترافية ===== */
        .card {
            aspect-ratio: 3/4;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            border-radius: 18px;
            min-height: 160px;
            filter: drop-shadow(0 15px 40px rgba(0, 0, 0, 0.6));
        }
        .card:not(.disabled):not(.flipped):hover {
            transform: translateY(-12px) scale(1.04) rotateX(6deg) rotateZ(-2deg);
            filter: drop-shadow(0 25px 60px rgba(255, 215, 0, 0.15));
        }
        .card:not(.disabled):not(.flipped):active {
            transform: scale(0.95);
            transition-duration: 0.1s;
        }
        .card.flipped {
            transform: rotateY(180deg) scale(1.02);
        }
        .card.disabled {
            cursor: default;
            filter: drop-shadow(0 5px 20px rgba(0, 0, 0, 0.3));
        }

        .card .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.03);
        }

        /* ===== الوجه الخلفي (المقفل) - تصميم فاخر ===== */
        .card .card-back {
            background: linear-gradient(145deg, #0f0f1a, #1a1a2e);
            transform: rotateY(0deg);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.04);
        }
        .card .card-back .back-design {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card .card-back .back-design .hex-pattern {
            position: absolute;
            width: 90%;
            height: 90%;
            background: repeating-conic-gradient(
                from 0deg at 50% 50%,
                transparent 0deg,
                rgba(255, 215, 0, 0.02) 5deg,
                transparent 10deg,
                rgba(255, 215, 0, 0.01) 15deg,
                transparent 20deg
            );
            border-radius: 12px;
        }
        .card .card-back .back-design .icon-big {
            font-size: 44px;
            opacity: 0.12;
            animation: cardPulse 3s ease-in-out infinite;
            z-index: 1;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.05));
        }
        @keyframes cardPulse {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.12; }
            50% { transform: scale(1.05) rotate(3deg); opacity: 0.2; }
        }
        .card .card-back .back-design .card-number {
            position: absolute;
            bottom: 14px;
            font-size: 11px;
            color: rgba(255, 215, 0, 0.06);
            font-weight: 900;
            letter-spacing: 4px;
            z-index: 1;
        }
        .card .card-back .glow-ring {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border-radius: 14px;
            border: 1px solid rgba(255, 215, 0, 0.02);
            box-shadow: inset 0 0 40px rgba(255, 215, 0, 0.01);
            pointer-events: none;
        }
        .card .card-back .corner-glow {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.03), transparent);
            pointer-events: none;
        }
        .card .card-back .corner-glow.tl { top: -10px; left: -10px; }
        .card .card-back .corner-glow.br { bottom: -10px; right: -10px; }

        /* ===== الوجه الأمامي (المكشوف) ===== */
        .card .card-front {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #FFD700, #FF8C00);
            box-shadow: inset 0 0 80px rgba(255, 215, 0, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.15);
        }
        .card .card-front .prize-icon {
            font-size: 46px;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 30px rgba(0, 0, 0, 0.15));
            animation: prizeFloat 2.5s ease-in-out infinite;
        }
        @keyframes prizeFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.05); }
        }
        .card .card-front .prize-name {
            font-size: 13px;
            font-weight: 900;
            color: #0a0a0a;
            text-align: center;
            line-height: 1.3;
            text-shadow: 0 2px 12px rgba(255, 255, 255, 0.1);
            font-family: 'Orbitron', sans-serif;
        }
        .card .card-front .prize-desc {
            font-size: 9px;
            color: rgba(0, 0, 0, 0.4);
            text-align: center;
            margin-top: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card .card-front .shine-overlay {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.15), transparent 60%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .card.flipped .card-front .shine-overlay {
            opacity: 1;
            animation: shineSweep 3s ease-in-out infinite;
        }
        @keyframes shineSweep {
            0%, 100% { transform: translateX(-30%) rotate(0deg); }
            50% { transform: translateX(30%) rotate(5deg); }
        }

        /* ===== البطاقة الفائزة - تأثير سينمائي ===== */
        .card.winner {
            animation: winnerCinematic 1.2s ease-in-out infinite !important;
            filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.3)) !important;
            z-index: 20;
        }
        @keyframes winnerCinematic {
            0%, 100% { 
                transform: rotateY(180deg) scale(1); 
                filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.2));
            }
            50% { 
                transform: rotateY(180deg) scale(1.06) translateY(-8px); 
                filter: drop-shadow(0 0 80px rgba(255, 215, 0, 0.5));
            }
        }
        .card.winner .card-front {
            animation: winnerGlow 1.5s ease-in-out infinite;
        }
        @keyframes winnerGlow {
            0%, 100% { box-shadow: inset 0 0 80px rgba(255, 215, 0, 0.15), 0 0 60px rgba(255, 215, 0, 0.1); }
            50% { box-shadow: inset 0 0 120px rgba(255, 215, 0, 0.3), 0 0 100px rgba(255, 215, 0, 0.2); }
        }

        /* ===== البطاقات الخاسرة - تأثير درامي ===== */
        .card.loser {
            animation: loserDramatic 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
        }
        @keyframes loserDramatic {
            0% { 
                opacity: 1; 
                transform: rotateY(0deg) scale(1) translateY(0) rotateZ(0deg);
                filter: blur(0px);
            }
            30% { 
                transform: rotateY(0deg) scale(1.02) translateY(-10px) rotateZ(2deg);
                filter: blur(0px);
            }
            100% { 
                opacity: 0; 
                transform: rotateY(0deg) scale(0.5) translateY(60px) rotateZ(10deg);
                filter: blur(8px);
            }
        }

        /* ===== جزيئات متلألئة على البطاقة الفائزة ===== */
        .sparkle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            border-radius: 18px;
        }
        .sparkle {
            position: absolute;
            border-radius: 50%;
            background: #FFD700;
            animation: sparkleAnim var(--duration) ease-in infinite;
        }
        @keyframes sparkleAnim {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1) rotate(180deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        /* ===== أزرار ===== */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            width: 100%;
            max-width: 380px;
            z-index: 1;
            position: relative;
            padding: 0 10px;
        }
        .btn {
            padding: 18px 28px;
            border: none;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            position: relative;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.08), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .btn:hover:not(:disabled)::before {
            opacity: 1;
        }
        .btn-play {
            background: linear-gradient(135deg, #B8860B, #FFD700);
            color: #0a0a0a;
            box-shadow: 0 4px 40px rgba(255, 215, 0, 0.1);
            font-size: 20px;
        }
        .btn-play:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 60px rgba(255, 215, 0, 0.2);
        }
        .btn-play:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-play .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 2px solid rgba(10, 10, 10, 0.1);
            border-top: 2px solid #0a0a0a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
        .btn-play.loading .spinner {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== نتيجة اللعبة ===== */
        .result-box {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 215, 0, 0.04);
            border-radius: 22px;
            padding: 22px 20px;
            margin-top: 15px;
            text-align: center;
            display: none;
            width: 100%;
            max-width: 380px;
            z-index: 1;
            position: relative;
            animation: resultIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes resultIn {
            0% { transform: scale(0.8) rotate(-5deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .result-box.show { display: block; }
        .result-box.winner {
            border-color: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.04);
        }
        .result-box .result-icon {
            font-size: 56px;
            margin-bottom: 8px;
            animation: prizeFloat 2s ease-in-out infinite;
        }
        .result-box .result-title {
            color: #FFD700;
            font-size: 22px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .result-box .result-desc {
            color: #888;
            font-size: 14px;
            margin-top: 6px;
            font-weight: 400;
        }
        .result-box .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            border-radius: 22px;
        }
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            animation: confettiFall var(--duration) ease-in forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(200px) rotate(720deg) scale(1); opacity: 0; }
        }

        /* ===== إعدادات الصوت ===== */
        .sound-settings {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 12px;
            padding: 10px 24px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            width: 100%;
            max-width: 380px;
            z-index: 1;
            position: relative;
        }
        .sound-settings label {
            color: #666;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: color 0.3s;
            font-weight: 700;
        }
        .sound-settings label:hover {
            color: #FFD700;
        }
        .sound-settings input[type="checkbox"] {
            accent-color: #FFD700;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* ===== لوحة الإدارة ===== */
        .admin-panel {
            display: none;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 215, 0, 0.04);
            border-radius: 22px;
            padding: 18px;
            margin-top: 14px;
            width: 100%;
            max-width: 420px;
            z-index: 1;
            position: relative;
        }
        .admin-panel.show { display: block; animation: containerIn 0.4s ease; }
        .admin-panel .panel-title {
            color: #FFD700;
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .admin-panel .panel-title .badge {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            color: #0a0a0a;
            font-size: 8px;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 900;
        }
        .admin-panel .prize-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .admin-panel .prize-item .prize-icon-small { font-size: 22px; width: 34px; text-align: center; }
        .admin-panel .prize-item .prize-info { flex: 1; min-width: 90px; }
        .admin-panel .prize-item .prize-info .name-input {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            width: 100%;
            transition: border-color 0.3s;
            font-family: 'Orbitron', sans-serif;
        }
        .admin-panel .prize-item .prize-info .name-input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .admin-panel .prize-item .prize-colors {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .admin-panel .prize-item .prize-colors input[type="color"] {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            padding: 2px;
            background: transparent;
            cursor: pointer;
        }
        .admin-panel .prize-item .btn-delete {
            background: rgba(255, 0, 0, 0.05);
            border: none;
            color: #FF4444;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;

<body>

    <!-- ===== خلفية سينمائية ===== -->
    <div class="cinematic-bg">
        <div class="particles-container" id="particles"></div>
    </div>
    <div class="light-flash"></div>
    <div class="cross-lines"></div>

    <!-- ===== إشعار ===== -->
    <div class="notification" id="notification">🎉 مبروك!</div>

    <!-- ===== النص العلوي ===== -->
    <div class="banner-text" id="bannerText">
        <span class="gold-text">🃏 IChancy · بطاقات الحظ</span>
    </div>

    <!-- ===== شاشة تحميل ===== -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loader-ring"></div>
        <div class="loader-text">جاري التحميل</div>

            <div class="fill" id="loaderProgress"></div>
        </div>
    </div>

    <!-- ===== 6 بطاقات ===== -->
    <div class="cards-container" id="cardsContainer">
        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- ===== أزرار ===== -->
    <div class="actions">

        <div class="result-desc" id="resultDesc"></div>
    </div>

    <!-- ===== إعدادات الصوت ===== -->
    <div class="sound-settings">
        <label>
            🔊
            <input type="checkbox" id="soundToggle" checked> مؤثرات
        </label>
        <label>
            🎵
            <input type="checkbox" id="musicToggle" checked> موسيقى
        </label>
    </div>

    <!-- ===== لوحة الإدارة ===== -->
    <div class="admin-panel" id="adminPanel">
        <div class="panel-title">
            ⚙️ الإدارة <span class="badge">ADMIN</span>
        </div>
        <div id="prizesList"></div>
        <div class="add-prize-form">
            <input type="text" id="newPrizeName" placeholder="الاسم">
            <input type="text" id="newPrizeIcon" placeholder="🎁" style="max-width:44px;">
            <input type="text" id="newPrizeDesc" placeholder="الوصف" style="flex:1.5;">
            <input type="color" id="newPrizeColor" value="#FFD700" style="max-width:34px;padding:2px;">
            <input type="color" id="newPrizeCardColor" value="#1a1a2e" style="max-width:34px;padding:2px;">
            <button class="btn-add" id="addPrizeBtn">➕</button>
        </div>
        <div class="panel-actions">
            <button class="btn-action" id="refreshPrizesBtn">🔄 تحديث</button>
            <button class="btn-action danger" id="resetPrizesBtn">🗑️ إعادة تعيين</button>
        </div>
    </div>

    <!-- ===== خطأ ===== -->
    <div class="error-msg" id="errorMsg">
        <span id="errorText"></span>
    </div>

    <script>
        // ================================================================
        //                      الإعدادات
        // ================================================================
        const API_BASE = 'https://joj-d0kl.onrender.com';
        const ADMIN_ID = 7011476249;
        let USER_ID = null;
        let prizesCache = [];
        let isPlaying = false;
        let selectedCardIndex = -1;
        let gameResult = null;
        let soundEnabled = true;
        let musicEnabled = true;

        // ================================================================
        //                      نظام الصوت الاحترافي
        // ================================================================
        class ProSound {
            constructor() {
                this.ctx = null;
                this.bgInterval = null;
                this.ready = false;
            }

            init() {
                if (this.ready) return;
                try {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    this.ready = true;
                } catch (e) { console.warn('Audio not supported'); }
            }

            playFlip() {
                if (!soundEnabled || !this.ready) return;
                try {
                    const ctx = this.ctx;
                    const now = ctx.currentTime;
                    
                    // صوت تقليب عالي الجودة
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.06);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
                    osc.type = 'square';
                    gain.gain.setValueAtTime(0.035, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                    
                    // تأثير رنين
                    setTimeout(() => {
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.frequency.setValueAtTime(800, now + 0.08);
                        osc2.frequency.exponentialRampToValueAtTime(500, now + 0.16);
                        osc2.type = 'sine';
                        gain2.gain.setValueAtTime(0.02, now + 0.08);
                        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                        osc2.start(now + 0.08);
                        osc2.stop(now + 0.16);
                    }, 60);
                } catch (e) { console.warn('Sound error:', e); }
            }

            playWin() {
                if (!soundEnabled || !this.ready) return;
                try {
                    const ctx = this.ctx;
                    const now = ctx.currentTime;
                    
                    // لحن انتصاري ملحمي
                    const melody = [
                        [523, 0.05, 0.05],
                        [659, 0.05, 0.05],
                        [784, 0.05, 0.05],
                        [1047, 0.08, 0.06],
                        [784, 0.05, 0.05],
                        [988, 0.05, 0.05],
                        [1175, 0.08, 0.06],
                        [1319, 0.1, 0.07],
                        [1568, 0.12, 0.08],
                        [1760, 0.15, 0.09],
                        [1976, 0.2, 0.1]
                    ];
                    melody.forEach(([freq, dur, vol], i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, now + i * 0.06);
                        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                        gain.gain.setValueAtTime(vol || 0.04, now + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + dur);
                        osc.start(now + i * 0.06);
                        osc.stop(now + i * 0.06 + dur);
                    });
                    
                    // كورد ختامي
                    setTimeout(() => {
                        [523, 659, 784].forEach((freq, i) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.frequency.setValueAtTime(freq, now + 1.2 + i * 0.04);
                            osc.type = 'sine';
                            gain.gain.setValueAtTime(0.04, now + 1.2 + i * 0.04);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.6 + i * 0.04);
                            osc.start(now + 1.2 + i * 0.04);
                            osc.stop(now + 1.6 + i * 0.04);
                        });
                    }, 800);
                } catch (e) { console.warn('Sound error:', e); }
            }

            playLose() {
                if (!soundEnabled || !this.ready) return;
                try {
                    const ctx = this.ctx;
                    const now = ctx.currentTime;
                    
                    // صوت خسارة درامي
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.5);
                    osc.type = 'sawtooth';
                    gain.gain.setValueAtTime(0.045, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    
                    // تأثير إضافي
                    setTimeout(() => {
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.frequency.setValueAtTime(400, now + 0.15);
                        osc2.frequency.exponentialRampToValueAtTime(50, now + 0.45);
                        osc2.type = 'square';
                        gain2.gain.setValueAtTime(0.025, now + 0.15);
                        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                        osc2.start(now + 0.15);
                        osc2.stop(now + 0.45);
                    }, 120);
                } catch (e) { console.warn('Sound error:', e); }
            }

            playBgMusic() {
                if (!musicEnabled || !this.ready) return;
                if (this.bgInterval) return;
                try {
                    const ctx = this.ctx;
                    const playNote = (freq, time, dur, vol, type = 'sine') => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, time);
                        osc.type = type;
                        gain.gain.setValueAtTime(vol || 0.012, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
                        osc.start(time);
                        osc.stop(time + dur);
                    };
                    
                    // موسيقى خلفية ملحمية
                    const pattern = [
                        [262, 0.3, 0.01],
                        [330, 0.3, 0.01],
                        [392, 0.3, 0.01],
                        [523, 0.4, 0.015],
                        [330, 0.3, 0.01],
                        [392, 0.3, 0.01],
                        [523, 0.3, 0.01],
                        [659, 0.4, 0.015],
                        [392, 0.3, 0.01],
                        [523, 0.3, 0.01],
                        [659, 0.3, 0.01],
                        [784, 0.4, 0.015]
                    ];
                    pattern.forEach(([freq, dur, vol], i) => {
                        const time = ctx.currentTime + i * 0.35;
                        playNote(freq, time, dur, vol, i % 2 === 0 ? 'sine' : 'triangle');
                    });
                    
                    this.bgInterval = setInterval(() => {
                        if (!musicEnabled || !this.ready) {
                            this.stopBgMusic();
                            return;
                        }
                        const t = ctx.currentTime;
                        const notes = [131, 165, 196, 262, 196, 165];
                        notes.forEach((freq, i) => {
                            playNote(freq, t + i * 0.2, 0.15, 0.007, 'square');
                        });
                    }, 1400);
                } catch (e) { console.warn('Music error:', e); }
            }

            stopBgMusic() {
                if (this.bgInterval) {
                    clearInterval(this.bgInterval);
                    this.bgInterval = null;
                }
            }

            stopAll() {
                this.stopBgMusic();
                if (this.ctx) {
                    try { this.ctx.close(); this.ctx = new(window.AudioContext || window.webkitAudioContext)(); } 
                    catch (e) {}
                }
            }
        }

        const sound = new ProSound();

        // ================================================================
        //                      جسيمات الخلفية
        // ================================================================
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = 2 + Math.random() * 8;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (15 + Math.random() * 30) + 's';
                p.style.animationDelay = (Math.random() * 20) + 's';
                const colors = ['rgba(255,215,0,0.3)', 'rgba(255,100,0,0.2)', 'rgba(200,0,255,0.15)'];
                p.style.background = `radial-gradient(circle, ${colors[i % colors.length]}, transparent)`;
                container.appendChild(p);
            }
        }

        // ================================================================
        //                      جلب USER_ID
        // ================================================================
        function getUserId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('user_id') || params.get('userId') || params.get('id');
            if (id && !isNaN(id)) {
                USER_ID = parseInt(id);
                localStorage.setItem('flip_user_id', USER_ID);
                return USER_ID;
            }
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const user = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (user && user.id) {
                        USER_ID = user.id;
                        localStorage.setItem('flip_user_id', USER_ID);
                        return USER_ID;
                    }
                }
            } catch (e) {}
            id = localStorage.getItem('flip_user_id');
            if (id) { USER_ID = parseInt(id); return USER_ID; }
            return null;
        }

        // ================================================================
        //                      إنشاء البطاقات
        // ================================================================
        function createCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 6; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                
                const randomPrize = prizesCache.length > 0 ? 
                    prizesCache[Math.floor(Math.random() * prizesCache.length)] : 
                    { icon: '🎁', name: 'جائزة', description: '', card_color: '#1a1a2e', card_back_color: '#16213e' };
                
                card.innerHTML = `
                    <div class="card-face card-back">
                        <div class="back-design">
                            <div class="hex-pattern"></div>
                            <div class="icon-big">🃏</div>
                            <div class="card-number">#${String(i + 1).padStart(2, '0')}</div>
                        </div>
                        <div class="glow-ring"></div>
                        <div class="corner-glow tl"></div>
                        <div class="corner-glow br"></div>
                    </div>
                    <div class="card-face card-front" style="background: linear-gradient(145deg, ${randomPrize.card_color || '#1a1a2e'}, ${randomPrize.card_back_color || '#16213e'});">
                        <div class="prize-icon">${randomPrize.icon || '🎁'}</div>
                        <div class="prize-name">${randomPrize.name || 'جائزة'}</div>
                        <div class="prize-desc">${randomPrize.description || ''}</div>
                        <div class="shine-overlay"></div>
                        <div class="sparkle-container"></div>
                    </div>
                `;
                
                card.addEventListener('click', () => handleCardClick(i));
                grid.appendChild(card);
            }
        }

        // ================================================================
        //                      اختيار البطاقة - البطاقة المختارة فقط
        // ================================================================
        async function handleCardClick(index) {
            if (isPlaying) return;
            if (document.getElementById('playBtn').disabled) return;
            if (selectedCardIndex !== -1) return;
            
            // حفظ البطاقة المختارة
            selectedCardIndex = index;
            isPlaying = true;
            
            const btn = document.getElementById('playBtn');
            btn.disabled = true;
            btn.classList.add('loading');
            document.getElementById('playBtnText').textContent = 'جاري اللعب...';
            
            sound.init();
            sound.playBgMusic();
            
            try {
                const response = await fetch(`${API_BASE}/api/flip/play`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: USER_ID })
                });
                
                const data = await response.json();
                btn.classList.remove('loading');
                
                if (data.success) {
                    const prize = data.game.prize;
                    const winningIndex = data.game.card_index;
                    
                    // 🔥 مهم: البطاقة التي اختارها المستخدم هي التي ستنقلب
                    // نستخدم selectedCardIndex (البطاقة المختارة) وليس winningIndex
                    gameResult = { 
                        prize, 
                        isWin: !prize.name.includes('حظ سعيد'),
                        selectedIndex: selectedCardIndex,
                        winningIndex: winningIndex
                    };
                    
                    // كشف البطاقات - البطاقة المختارة هي التي تظهر الجائزة
                    await revealCards(selectedCardIndex, prize);
                    
                    // عرض النتيجة
                    showResult(prize, gameResult.isWin);
                    
                    if (gameResult.isWin) {
                        sound.playWin();
                        showNotification(`🎉 مبروك! ${prize.description || prize.name}!`);
                        createConfetti();
                    } else {
                        sound.playLose();
                    }
                } else {
                    showError(data.error || 'حدث خطأ');
                    if (data.remaining_hours !== undefined) {
                        const btn2 = document.getElementById('playBtn');
                        btn2.disabled = true;
                        document.getElementById('playBtnText').textContent = `⏳ ${data.remaining_hours}h ${data.remaining_minutes}m`;
                        sound.stopAll();
                    }
                    selectedCardIndex = -1;
                    isPlaying = false;
                }
            } catch (e) {
                btn.classList.remove('loading');
                showError('خطأ في الاتصال: ' + e.message);
                sound.stopAll();
                selectedCardIndex = -1;
                isPlaying = false;
            }
            
            if (!document.getElementById('playBtn').disabled && !isPlaying) {
                document.getElementById('playBtnText').textContent = '🎯 اختر بطاقة';
            }
        }

        // ================================================================
        //                      كشف البطاقات
        // ================================================================
        async function revealCards(selectedIndex, prize) {
            const cards = document.querySelectorAll('.card');
            
            // 1. تحديث البطاقة المختارة بالجائزة الفائزة
            const selectedCard = cards[selectedIndex];
            if (selectedCard) {
                const front = selectedCard.querySelector('.card-front');
                front.style.background = `linear-gradient(145deg, ${prize.color || '#FFD700'}, ${prize.card_color || '#1a1a2e'})`;
                front.querySelector('.prize-icon').textContent = prize.icon || '🎁';
                front.querySelector('.prize-name').textContent = prize.name || 'جائزة';
                front.querySelector('.prize-desc').textContent = prize.description || '';
                
                // إضافة جزيئات متلألئة على البطاقة الفائزة
                const sparkles = selectedCard.querySelector('.sparkle-container');
                for (let i = 0; i < 20; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.left = Math.random() * 100 + '%';
                    sparkle.style.top = Math.random() * 100 + '%';
                    sparkle.style.setProperty('--duration', (0.8 + Math.random() * 1.2) + 's');
                    sparkle.style.animationDelay = Math.random() * 1.5 + 's';
                    sparkle.style.width = (2 + Math.random() * 5) + 'px';
                    sparkle.style.height = sparkle.style.width;
                    sparkle.style.background = ['#FFD700', '#FF6B00', '#FF00FF', '#00BFFF', '#00FF88'][Math.floor(Math.random() * 5)];
                    sparkles.appendChild(sparkle);
                }
            }
            
            // 2. كشف البطاقة المختارة أولاً (مع تأثير درامي)
            await new Promise(resolve => {
                setTimeout(() => {
                    if (selectedCard) {
                        selectedCard.classList.add('flipped');
                        selectedCard.classList.add('winner');
                        sound.playFlip();
                    }
                    resolve();
                }, 400);
            });
            
            // 3. كشف البطاقات الأخرى مع تأخير درامي
            const otherCards = Array.from(cards).filter((_, i) => i !== selectedIndex);
            for (let i = 0; i < otherCards.length; i++) {
                const card = otherCards[i];
                const delay = 300 + (i * 150);
                
                await new Promise(resolve => {
                    setTimeout(() => {
                        // جائزة عشوائية للبطاقات الأخرى
                        const randomPrize = prizesCache.length > 0 ? 
                            prizesCache[Math.floor(Math.random() * prizesCache.length)] : 
                            { icon: '🎁', name: 'جائزة', card_color: '#1a1a2e', card_back_color: '#16213e' };
                        
                        const front = card.querySelector('.card-front');
                        front.style.background = `linear-gradient(145deg, ${randomPrize.card_color || '#1a1a2e'}, ${randomPrize.card_back_color || '#16213e'})`;
                        front.querySelector('.prize-icon').textContent = randomPrize.icon || '🎁';
                        front.querySelector('.prize-name').textContent = randomPrize.name || 'جائزة';
                        front.querySelector('.prize-desc').textContent = randomPrize.description || '';
                        
                        card.classList.add('flipped');
                        card.classList.add('disabled');
                        card.classList.add('loser');
                        sound.playFlip();
                        resolve();
                    }, delay);
                });
            }
            
            // 4. انتظار انتهاء التأثيرات
            await new Promise(resolve => setTimeout(resolve, 500));
        }

        // ================================================================
        //                      كونفيتي احتفالي
        // ================================================================
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            container.innerHTML = '';
            const colors = ['#FFD700', '#FF6B00', '#FF0000', '#00FF88', '#00BFFF', '#FF00FF', '#FF69B4', '#7CFC00', '#FF4500'];
            
            for (let i = 0; i < 80; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                const size = 4 + Math.random() * 10;
                piece.style.width = size + 'px';
                piece.style.height = size + 'px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = Math.random() * 100 + '%';
                piece.style.top = Math.random() * 30 + '%';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.setProperty('--duration', (1.5 + Math.random() * 1.5) + 's');
                piece.style.animationDelay = Math.random() * 0.8 + 's';
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(piece);
            }
            
            setTimeout(() => { container.innerHTML = ''; }, 3500);
        }

        // ================================================================
        //                      عرض النتيجة
        // ================================================================
        function showResult(prize, isWin) {
            const box = document.getElementById('resultBox');
            document.getElementById('resultIcon').textContent = prize.icon || '🎁';
            document.getElementById('resultTitle').textContent = prize.name || 'جائزة!';
            document.getElementById('resultDesc').textContent = prize.description || '';
            
            box.classList.add('show');
            if (isWin) {
                box.classList.add('winner');
            } else {
                box.classList.remove('winner');
            }
            
            loadUserStatus();
        }

        // ================================================================
        //                      تحميل البيانات
        // ================================================================
        async function loadPrizes() {
            try {
                const res = await fetch(`${API_BASE}/api/prizes`);
                const data = await res.json();
                if (data.success && data.prizes) {
                    prizesCache = data.prizes;
                    return data.prizes;
                }
                return [];
            } catch (e) { console.error('Error loading prizes:', e); return []; }
        }

        async function loadSettings() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/settings?admin_id=${ADMIN_ID}`);
                const data = await res.json();
                if (data.success) {
                    if (data.settings.banner_text) {
                        document.getElementById('bannerText').innerHTML = `<span class="gold-text">${data.settings.banner_text}</span>`;
                    }
                    return data.settings;
                }
                return {};
            } catch (e) { console.error('Error loading settings:', e); return {}; }
        }

        async function loadUserStatus() {
            if (!USER_ID) return;
            try {
                const res = await fetch(`${API_BASE}/api/flip/history/${USER_ID}`);
                const data = await res.json();
                if (data.success) {
                    const btn = document.getElementById('playBtn');
                    const canPlay = data.play_status?.can_play !== false &&
                        (!data.deposit_requirement?.required || data.deposit_requirement?.is_met);
                    
                    if (canPlay && prizesCache.length > 0 && selectedCardIndex === -1) {
                        btn.disabled = false;
                        document.getElementById('playBtnText').textContent = '🎯 اختر بطاقة';
                    } else if (selectedCardIndex !== -1) {
                        btn.disabled = true;
                        document.getElementById('playBtnText').textContent = '✅ تم الاختيار';
                    } else if (!data.play_status?.can_play) {
                        btn.disabled = true;
                        const h = data.play_status?.remaining_hours || 0;
                        const m = data.play_status?.remaining_minutes || 0;
                        document.getElementById('playBtnText').textContent = `⏳ ${h}h ${m}m`;
                        sound.stopAll();
                    } else {
                        btn.disabled = true;
                        document.getElementById('playBtnText').textContent = '⏳ جاري التحميل...';
                    }
                }
            } catch (e) { console.error('Error loading user status:', e); }
        }

        // ================================================================
        //                      لوحة الإدارة
        // ================================================================
        async function renderAdminPanel() {
            const panel = document.getElementById('adminPanel');
            const list = document.getElementById('prizesList');
            
            if (USER_ID !== ADMIN_ID) { panel.classList.remove('show'); return; }
            panel.classList.add('show');
            
            try {
                const res = await fetch(`${API_BASE}/api/admin/prizes?admin_id=${ADMIN_ID}`);
                const data = await res.json();
                
                if (!data.success || !data.prizes || data.prizes.length === 0) {
                    list.innerHTML = `<div style="color:#555;text-align:center;padding:20px;font-weight:700;">📭 لا توجد جوائز</div>`;
                    return;
                }
                
                list.innerHTML = data.prizes.map(p => `
                    <div class="prize-item" data-id="${p.id}">
                        <div class="prize-icon-small">${p.icon || '🎁'}</div>
                        <div class="prize-info">
                            <input type="text" class="name-input" value="${p.name}" placeholder="الاسم">
                        </div>
                        <div class="prize-colors">
                            <input type="color" class="color-input" value="${p.color || '#FFD700'}" data-field="color" data-id="${p.id}">
                            <input type="color" class="color-input" value="${p.card_color || '#1a1a2e'}" data-field="card_color" data-id="${p.id}">
                            <input type="color" class="color-input" value="${p.card_back_color || '#16213e'}" data-field="card_back_color" data-id="${p.id}">
                        </div>
                        <button class="btn-delete" data-id="${p.id}">✕</button>
                    </div>
                `).join('');
                
                list.querySelectorAll('.name-input').forEach(input => {
                    input.addEventListener('change', async function() {
                        const id = parseInt(this.closest('.prize-item').dataset.id);
                        const value = this.value.trim();
                        if (!value) { showError('⚠️ الاسم مطلوب'); return; }
                        const success = await updatePrize(id, { name: value });
                        if (success) { await refreshAll(); showNotification('✅ تم التحديث'); }
                    });
                });
                
                list.querySelectorAll('.color-input').forEach(input => {
                    input.addEventListener('change', async function() {
                        const id = parseInt(this.dataset.id);
                        const field = this.dataset.field;
                        const success = await updatePrize(id, { [field]: this.value });
                        if (success) { await refreshAll(); showNotification('✅ تم تحديث اللون'); }
                    });
                });
                
                list.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = parseInt(this.dataset.id);
                        if (confirm('⚠️ هل أنت متأكد من الحذف؟')) {
                            const success = await deletePrize(id);
                            if (success) { await refreshAll(); showNotification('✅ تم الحذف'); }
                        }
                    });
                });
            } catch (e) { console.error('Error rendering admin:', e); }
        }

        async function updatePrize(id, data) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/prizes/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID, ...data })
                });
                const result = await res.json();
                return result.success === true;
            } catch (e) { console.error('Error updating prize:', e); return false; }
        }

        async function deletePrize(id) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/prizes/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID })
                });
                const data = await res.json();
                return data.success === true;
            } catch (e) { console.error('Error deleting prize:', e); return false; }
        }

        async function addPrize(name, icon, description, color, card_color) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/prizes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        admin_id: ADMIN_ID,
                        name, icon: icon || '🎁', description: description || '',
                        color: color || '#FFD700',
                        card_color: card_color || '#1a1a2e',
                        card_back_color: '#16213e'
                    })
                });
                const data = await res.json();
                return data.success === true;
            } catch (e) { console.error('Error adding prize:', e); return false; }
        }

        async function resetPrizes() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/seed-prizes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID })
                });
                const data = await res.json();
                return data.success;
            } catch (e) { console.error('Error resetting prizes:', e); return false; }
        }

        // ================================================================
        //                      دوال مساعدة
        // ================================================================
        function showNotification(msg) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            document.getElementById('errorText').textContent = '❌ ' + msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function updateLoader(progress) {
            document.getElementById('loaderProgress').style.width = Math.min(progress, 100) + '%';
        }

        function showLoading(show) {
            const screen = document.getElementById('loadingScreen');
            if (show) {
                screen.classList.add('active');
                document.getElementById('cardsContainer').classList.remove('show');
            } else {
                screen.classList.remove('active');
                document.getElementById('cardsContainer').classList.add('show');
            }
        }

        async function refreshAll() {
            await loadSettings();
            await loadPrizes();
            if (prizesCache.length > 0) {
                createCards();
                document.getElementById('cardsContainer').classList.add('show');
            }
            await loadUserStatus();
            await renderAdminPanel();
        }

        // ================================================================
        //                      أحداث الإدارة
        // ================================================================
        document.getElementById('addPrizeBtn').addEventListener('click', async function() {
            const name = document.getElementById('newPrizeName').value.trim();
            const icon = document.getElementById('newPrizeIcon').value.trim() || '🎁';
            const desc = document.getElementById('newPrizeDesc').value.trim() || '';
            const color = document.getElementById('newPrizeColor').value || '#FFD700';
            const cardColor = document.getElementById('newPrizeCardColor').value || '#1a1a2e';
            
            if (!name) { showError('⚠️ الرجاء إدخال اسم الجائزة'); return; }
            
            this.disabled = true;
            this.textContent = '⏳';
            const success = await addPrize(name, icon, desc, color, cardColor);
            if (success) {
                document.getElementById('newPrizeName').value = '';
                document.getElementById('newPrizeIcon').value = '';
                document.getElementById('newPrizeDesc').value = '';
                await refreshAll();
                showNotification(`✅ تم إضافة "${name}"`);
            } else {
                showError('❌ فشل إضافة الجائزة');
            }
            this.disabled = false;
            this.textContent = '➕';
        });

        document.getElementById('refreshPrizesBtn').addEventListener('click', async () => {
            await refreshAll();
            showNotification('🔄 تم التحديث');
        });

        document.getElementById('resetPrizesBtn').addEventListener('click', async () => {
            if (confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع الجوائز؟')) {
                const success = await resetPrizes();
                if (success) { await refreshAll(); showNotification('✅ تم إعادة التعيين'); } 
                else { showError('❌ فشل إعادة التعيين'); }
            }
        });

        document.getElementById('soundToggle').addEventListener('change', function() {
            soundEnabled = this.checked;
            if (!soundEnabled) sound.stopAll();
            else { sound.init(); sound.playBgMusic(); }
        });

        document.getElementById('musicToggle').addEventListener('change', function() {
            musicEnabled = this.checked;
            if (!musicEnabled) sound.stopBgMusic();
            else { sound.init(); sound.playBgMusic(); }
        });

        // ================================================================
        //                      التهيئة
        // ================================================================
        async function init() {
            createParticles();
            
            USER_ID = getUserId();
            if (!USER_ID) {
                document.getElementById('errorContainer').classList.add('show');
                return;
            }
            
            showLoading(true);
            
            try {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 15;
                    if (progress > 85) progress = 85;
                    updateLoader(progress);
                }, 150);
                
                await loadSettings();
                updateLoader(30);
                await new Promise(r => setTimeout(r, 200));
                
                await loadPrizes();
                updateLoader(50);
                await new Promise(r => setTimeout(r, 200));
                
                if (prizesCache.length > 0) {
                    createCards();
                    document.getElementById('cardsContainer').classList.add('show');
                }
                updateLoader(70);
                await new Promise(r => setTimeout(r, 200));
                
                await loadUserStatus();
                updateLoader(85);
                await new Promise(r => setTimeout(r, 200));
                
                await renderAdminPanel();
                updateLoader(95);
                await new Promise(r => setTimeout(r, 200));
                
                clearInterval(interval);
                updateLoader(100);
                await new Promise(r => setTimeout(r, 400));
                
                sound.init();
                sound.playBgMusic();
                
            } catch (e) {
                console.error('Init error:', e);
                showError('⚠️ فشل تحميل البيانات: ' + e.message);
            }
            
            showLoading(false);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
