<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎡 عجلة الحظ</title>
    
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* ============================================================
                   الأساسيات
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* خلفية ثابتة */
        .bg-image-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.12;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-image-fixed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: slowZoom 30s ease-in-out infinite alternate;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: linear-gradient(145deg, rgba(18, 18, 18, 0.92), rgba(10, 10, 10, 0.95));
            border-radius: 28px;
            padding: 16px;
            max-width: 500px;
            width: 100%;
            margin: 10px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ============================================================
                   النص العلوي
                   ============================================================ */
        .banner-text {
            text-align: center;
            padding: 10px 16px;
            margin-bottom: 10px;
            background: rgba(255, 215, 0, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            font-size: 18px;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 1px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* ============================================================
                   العجلة
                   ============================================================ */
        .wheel-container {
            display: none;
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            aspect-ratio: 1/1;
        }

        .wheel-container.show {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        .wheel-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .wheel-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.04), inset 0 0 60px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.06);
            transition: filter 0.5s ease;
        }

        .wheel-wrapper canvas.spinning {
            filter: brightness(1.2) drop-shadow(0 0 50px rgba(255, 215, 0, 0.15));
        }

        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 36px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
            animation: pointerBounce 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pointerBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ============================================================
                   لا توجد جوائز
                   ============================================================ */
        .no-prizes {
            display: none;
            text-align: center;
            padding: 30px 20px;
            color: #555;
            font-size: 14px;
        }

        /* ============================================================
                   الأزرار
                   ============================================================ */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
            width: 100%;
            max-width: 350px;
        }

        .btn {
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
        }

        .btn-spin {
            background: linear-gradient(135deg, #B8860B, #FFD700);
            color: #0a0a0a;
            box-shadow: 0 4px 30px rgba(255, 215, 0, 0.1);
            font-size: 19px;
        }

        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(255, 215, 0, 0.2);
        }

        .btn-spin:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .btn-spin .spinner-small {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(10, 10, 10, 0.1);
            border-top: 2px solid #0a0a0a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        .btn-spin.loading .spinner-small {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============================================================
                   شرط الإيداع
                   ============================================================ */
        .deposit-notice {
            background: rgba(255, 215, 0, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 10px;
            padding: 10px 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
            width: 100%;
            max-width: 350px;
        }

        .deposit-notice.show {
            display: block;
        }

        .deposit-notice .notice-text {
            color: #FF8C00;
            font-size: 13px;
        }

        .deposit-notice .notice-text .amount {
            color: #FFD700;
            font-weight: 700;
        }

        .deposit-notice .notice-status {
            font-size: 12px;
            margin-top: 4px;
            color: #666;
        }

        .deposit-notice .notice-status .met {
            color: #00FF88;
        }

        .deposit-notice .notice-status .not-met {
            color: #FF4444;
        }

        /* ============================================================
                   النتيجة
                   ============================================================ */
        .result-box {
            background: rgba(255, 215, 0, 0.02);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 14px;
            padding: 16px;
            margin-top: 12px;
            text-align: center;
            display: none;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 350px;
        }

        .result-box.show {
            display: block;
            animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes resultPop {
            0% { transform: scale(0.8) rotate(-3deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .result-box.winner {
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
            animation: winGlow 1.5s ease-in-out infinite alternate;
        }

        @keyframes winGlow {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.05); }
            100% { box-shadow: 0 0 80px rgba(255, 215, 0, 0.15); }
        }

        .result-box .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .result-box .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            animation: confettiFall 2s ease-in forwards;
        }

        @keyframes confettiFall {
            0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(1); }
            100% { opacity: 0; transform: translateY(200px) rotate(720deg) scale(0); }
        }

        .result-box .prize-icon {
            font-size: 48px;
            display: inline-block;
        }

        .result-box .prize-icon.big-win {
            font-size: 64px;
            animation: bigWinPulse 0.8s ease-in-out infinite alternate;
        }

        @keyframes bigWinPulse {
            0% { transform: scale(1) rotate(-5deg); }
            100% { transform: scale(1.15) rotate(5deg); }
        }

        .result-box .prize-name {
            font-size: 22px;
            font-weight: 700;
            color: #FFD700;
            margin-top: 6px;
        }

        .result-box .prize-name.win-text {
            background: linear-gradient(135deg, #FFD700, #FF6B00, #FFD700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 1.5s ease-in-out infinite;
            font-size: 26px;
        }

        @keyframes goldShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .result-box .prize-desc {
            color: #777;
            font-size: 14px;
            margin-top: 4px;
        }

        /* ============================================================
                   رسائل الخطأ
                   ============================================================ */
        .error-msg {
            background: rgba(255, 0, 0, 0.04);
            border: 1px solid rgba(255, 0, 0, 0.06);
            border-radius: 10px;
            padding: 10px;
            color: #FF6B6B;
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            width: 100%;
            max-width: 350px;
        }

        .error-msg.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* ============================================================
                   شاشة اللودينغ - FULLSCREEN
                   ============================================================ */
        .loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #0a0a0a;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        .loading-screen.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .loading-screen .loading-image {
            width: 60vw;
            max-width: 300px;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.05);
            animation: loadingPulse 2s ease-in-out infinite;
            margin-bottom: 30px;
        }

        @keyframes loadingPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.8; }
        }

        .loading-screen .progress-container {
            width: 50%;
            max-width: 250px;
            position: relative;
        }

        .loading-screen .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            overflow: hidden;
        }

        .loading-screen .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .loading-screen .progress-text {
            color: #888;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        /* ============================================================
                   إعدادات الصوت
                   ============================================================ */
        .sound-settings {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 10px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sound-settings label {
            color: #666;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .sound-settings input[type="checkbox"] {
            accent-color: #FFD700;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .sound-settings .sound-indicator {
            color: #FFD700;
            font-size: 12px;
        }

        /* ============================================================
                   لوحة الإدارة
                   ============================================================ */
        .admin-panel {
            display: none;
            background: rgba(255, 215, 0, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 16px;
            padding: 14px;
            margin-top: 14px;
            width: 100%;
            max-width: 420px;
        }

        .admin-panel.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .admin-panel .panel-title {
            color: #FFD700;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-panel .panel-title .badge {
            background: #FFD700;
            color: #0a0a0a;
            font-size: 9px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        .admin-panel .prize-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .admin-panel .prize-item .prize-icon-small {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }

        .admin-panel .prize-item .prize-info {
            flex: 1;
            min-width: 100px;
        }

        .admin-panel .prize-item .prize-info .name-input {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 6px;
            width: 100%;
            transition: border-color 0.3s ease;
        }

        .admin-panel .prize-item .prize-info .name-input:focus {
            outline: none;
            border-color: #FFD700;
        }

        .admin-panel .prize-item .prize-info .desc-input {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            color: #666;
            font-size: 10px;
            padding: 2px 6px;
            width: 100%;
            margin-top: 2px;
            transition: border-color 0.3s ease;
        }

        .admin-panel .prize-item .prize-info .desc-input:focus {
            outline: none;
            border-color: rgba(255, 215, 0, 0.3);
        }

        .admin-panel .prize-item .prize-prob {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .admin-panel .prize-item .prize-prob .prob-input {
            width: 45px;
            padding: 3px 4px;
            border-radius: 4px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #FFD700;
            font-size: 11px;
            text-align: center;
        }

        .admin-panel .prize-item .prize-prob .prob-input:focus {
            outline: none;
            border-color: #FFD700;
        }

        .admin-panel .prize-item .prize-prob .prob-label {
            color: #555;
            font-size: 9px;
        }

        .admin-panel .prize-item .prize-prob .btn-save-prob {
            padding: 2px 6px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 4px;
            color: #FFD700;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-panel .prize-item .prize-prob .btn-save-prob:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .admin-panel .prize-item .prize-colors {
            display: flex;
            gap: 3px;
        }

        .admin-panel .prize-item .prize-colors input[type="color"] {
            width: 26px;
            height: 26px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 2px;
            background: transparent;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .admin-panel .prize-item .prize-colors input[type="color"]:hover {
            border-color: #FFD700;
        }

        .admin-panel .prize-item .prize-colors input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .admin-panel .prize-item .prize-colors input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 2px;
        }

        .admin-panel .prize-item .btn-delete {
            background: rgba(255, 0, 0, 0.08);
            border: none;
            color: #FF4444;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        .admin-panel .prize-item .btn-delete:hover {
            background: rgba(255, 0, 0, 0.2);
            transform: scale(1.05);
        }

        .admin-panel .add-prize-form {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .admin-panel .add-prize-form input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 11px;
            min-width: 50px;
        }

        .admin-panel .add-prize-form input:focus {
            outline: none;
            border-color: #FFD700;
        }

        .admin-panel .add-prize-form input::placeholder {
            color: #555;
        }

        .admin-panel .add-prize-form .btn-add {
            padding: 6px 14px;
            background: linear-gradient(135deg, #B8860B, #FFD700);
            border: none;
            border-radius: 6px;
            color: #0a0a0a;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-panel .add-prize-form .btn-add:hover {
            transform: scale(1.05);
        }

        .admin-panel .add-prize-form .btn-add:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .admin-panel .panel-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .admin-panel .panel-actions .btn-action {
            padding: 5px 12px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            color: #FFD700;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-panel .panel-actions .btn-action:hover {
            background: rgba(255, 215, 0, 0.05);
            border-color: #FFD700;
        }

        .admin-panel .panel-actions .btn-action.danger {
            color: #FF4444;
            border-color: rgba(255, 0, 0, 0.1);
        }

        .admin-panel .panel-actions .btn-action.danger:hover {
            background: rgba(255, 0, 0, 0.05);
            border-color: #FF4444;
        }

        .admin-panel .settings-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .admin-panel .settings-section .setting-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .admin-panel .settings-section .setting-row label {
            color: #888;
            font-size: 11px;
            min-width: 80px;
        }

        .admin-panel .settings-section .setting-row input,
        .admin-panel .settings-section .setting-row textarea {
            flex: 1;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 11px;
            min-width: 60px;
        }

        .admin-panel .settings-section .setting-row input:focus,
        .admin-panel .settings-section .setting-row textarea:focus {
            outline: none;
            border-color: #FFD700;
        }

        .admin-panel .settings-section .setting-row textarea {
            min-height: 40px;
            resize: vertical;
        }

        .admin-panel .settings-section .setting-row .btn-save {
            padding: 4px 14px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 4px;
            color: #FFD700;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .admin-panel .settings-section .setting-row .btn-save:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .admin-panel .settings-section .setting-row .btn-save.saved {
            background: rgba(0, 255, 100, 0.1);
            border-color: rgba(0, 255, 100, 0.2);
            color: #00FF88;
        }

        .admin-panel .settings-section .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .admin-panel .settings-section .toggle-row label {
            color: #888;
            font-size: 11px;
            min-width: 80px;
        }

        .admin-panel .settings-section .toggle-row input[type="checkbox"] {
            accent-color: #FFD700;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .admin-panel .settings-section .toggle-row .btn-save {
            padding: 4px 14px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 4px;
            color: #FFD700;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-panel .settings-section .toggle-row .btn-save:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .admin-panel .settings-section .toggle-row .btn-save.saved {
            background: rgba(0, 255, 100, 0.1);
            border-color: rgba(0, 255, 100, 0.2);
            color: #00FF88;
        }

        /* ============================================================
                   رسالة الخطأ الأولية
                   ============================================================ */
        .error-container {
            display: none;
            text-align: center;
            padding: 30px 20px;
        }

        .error-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .error-container .error-icon {
            font-size: 40px;
            margin-bottom: 10px;

<script>
// ================================================================
//                      الإعدادات الأساسية
// ================================================================
const API_BASE = 'https://joj-d0kl.onrender.com';
const ADMIN_ID = 7011476249;
let USER_ID = null;
let isSpinning = false;
let prizesCache = [];
let currentRotation = 0;

// ================================================================
//                      نظام الصوت
// ================================================================
class SoundManager {
    constructor() {
        this.initialized = false;
        this.audioContext = null;
        this.bgInterval = null;
        this.isPlaying = false;
    }

    init() {
        if (this.initialized) return;
        try {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            this.initialized = true;
        } catch(e) {
            console.warn('Web Audio not supported');
        }
    }

    stopAll() {
        if (this.audioContext) {
            try {
                this.audioContext.close();
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {}
        }
        this.stopBackgroundMusic();
        this.isPlaying = false;
    }

    playWinSound() {
        if (!soundEnabled || !this.initialized) return;
        
        try {
            const ctx = this.audioContext;
            const now = ctx.currentTime;
            
            const melody = [
                [523, 0.1], [587, 0.1], [659, 0.1], [784, 0.15],
                [659, 0.1], [880, 0.1], [988, 0.1], [1175, 0.2],
                [1047, 0.1], [1175, 0.1], [1319, 0.1], [1568, 0.25],
                [1319, 0.1], [1175, 0.1], [1047, 0.1], [880, 0.3]
            ];
            
            melody.forEach(([freq, dur], i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.frequency.setValueAtTime(freq, now + i * 0.08);
                osc.type = i % 3 === 0 ? 'sine' : 'triangle';
                
                gain.gain.setValueAtTime(0.1, now + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + dur);
                
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + dur);
            });
            
            setTimeout(() => {
                const chords = [523, 659, 784, 1047];
                chords.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(freq, now + 1.3 + i * 0.05);
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.05, now + 1.3 + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8 + i * 0.05);
                    osc.start(now + 1.3 + i * 0.05);
                    osc.stop(now + 1.8 + i * 0.05);
                });
            }, 800);
            
            setTimeout(() => {
                this.isPlaying = false;
            }, 3000);
            
        } catch(e) {
            console.warn('Sound error:', e);
            this.isPlaying = false;
        }
    }

    playLoseSound() {
        if (!soundEnabled || !this.initialized) return;
        
        try {
            const ctx = this.audioContext;
            const now = ctx.currentTime;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.5);
            osc.type = 'sawtooth';
            
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            
            osc.start(now);
            osc.stop(now + 0.5);
            
            setTimeout(() => {
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.frequency.setValueAtTime(300, now + 0.3);
                osc2.frequency.exponentialRampToValueAtTime(100, now + 0.6);
                osc2.type = 'square';
                gain2.gain.setValueAtTime(0.04, now + 0.3);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc2.start(now + 0.3);
                osc2.stop(now + 0.6);
            }, 200);
            
            setTimeout(() => {
                this.isPlaying = false;
            }, 1000);
            
        } catch(e) {
            console.warn('Sound error:', e);
            this.isPlaying = false;
        }
    }

    playBackgroundMusic() {
        if (!musicEnabled || !this.initialized) return;
        if (this.bgInterval) return;
        
        try {
            const ctx = this.audioContext;
            const now = ctx.currentTime;
            
            const playNote = (freq, time, dur, vol, type = 'sine') => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(freq, time);
                osc.type = type;
                gain.gain.setValueAtTime(vol || 0.025, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
                osc.start(time);
                osc.stop(time + dur);
            };
            
            const pattern = [
                [262, 0.25, 0.02], [330, 0.25, 0.02], [392, 0.25, 0.02], [523, 0.35, 0.025],
                [330, 0.25, 0.02], [392, 0.25, 0.02], [523, 0.25, 0.02], [659, 0.35, 0.025],
                [392, 0.25, 0.02], [523, 0.25, 0.02], [659, 0.25, 0.02], [784, 0.35, 0.025]
            ];
            
            pattern.forEach(([freq, dur, vol], i) => {
                const time = now + i * 0.3;
                playNote(freq, time, dur, vol, i % 2 === 0 ? 'sine' : 'triangle');
            });
            
            this.bgInterval = setInterval(() => {
                if (!musicEnabled || !this.initialized) {
                    this.stopBackgroundMusic();
                    return;
                }
                const t = ctx.currentTime;
                const bassNotes = [131, 165, 196, 262, 196, 165];
                bassNotes.forEach((freq, i) => {
                    playNote(freq, t + i * 0.25, 0.2, 0.015, 'square');
                });
            }, 1500);
            
        } catch(e) {
            console.warn('Music error:', e);
        }
    }

    stopBackgroundMusic() {
        if (this.bgInterval) {
            clearInterval(this.bgInterval);
            this.bgInterval = null;
        }
    }
}

function getUserId() {
    const params = new URLSearchParams(window.location.search);
    let id = params.get('user_id') || params.get('userId') || params.get('id');
    if (id && !isNaN(id)) {
        USER_ID = parseInt(id);
        localStorage.setItem('wheel_user_id', USER_ID);
        return USER_ID;
    }
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            const user = window.Telegram.WebApp.initDataUnsafe?.user;
            if (user && user.id) {
                USER_ID = user.id;
                localStorage.setItem('wheel_user_id', USER_ID);
                return USER_ID;
            }
        }
    } catch(e) {}
    id = localStorage.getItem('wheel_user_id');
    if (id) {
        USER_ID = parseInt(id);
        return USER_ID;
    }
    return null;
}

// ================================================================
//                      رسم العجلة
// ================================================================
function drawWheel(prizes, highlightIndex = -1, rotation = 0) {
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const cx = w/2, cy = h/2;
    const r = Math.min(w, h)/2 - 10;
    const noPrizes = document.getElementById('noPrizes');
    const container = document.getElementById('wheelContainer');
    
    if (!prizes || prizes.length === 0) {
        noPrizes.style.display = 'block';
        container.classList.remove('show');
        return;
    }
    
    noPrizes.style.display = 'none';
    container.classList.add('show');
    ctx.clearRect(0, 0, w, h);
    
    const total = prizes.length;
    const step = (2 * Math.PI) / total;
    
    prizes.forEach((p, i) => {
        const start = i * step + rotation - Math.PI/2;
        const end = start + step;
        const isHighlight = (i === highlightIndex);
        
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, end);
        ctx.closePath();
        
        const color1 = p.color || '#1a1a2e';
        const color2 = p.color2 || '#16213e';
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        
        if (isHighlight) {
            grad.addColorStop(0, '#FFD700');
            grad.addColorStop(0.5, '#FF8C00');
            grad.addColorStop(1, '#B8860B');
        } else {
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
        }
        ctx.fillStyle = grad;
        ctx.fill();
        
        if (isHighlight) {
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 40;
        } else {
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }
        
        ctx.strokeStyle = isHighlight ? '#FFD700' : 'rgba(255,215,0,0.06)';
        ctx.lineWidth = isHighlight ? 2.5 : 0.5;
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        const mid = start + step/2;
        const tr = r * 0.65;
        const x = cx + Math.cos(mid) * tr;
        const y = cy + Math.sin(mid) * tr;
        
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(mid + (mid > Math.PI/2 ? Math.PI : 0));
        
        // تكبير الجوائز 4 أضعاف
        ctx.fillStyle = isHighlight ? '#0a0a0a' : '#fff';
        ctx.font = isHighlight ? 'bold 32px sans-serif' : '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur = 8;
        ctx.fillText(p.icon || '🎁', 0, -8);
        
        ctx.font = isHighlight ? 'bold 14px sans-serif' : '12px sans-serif';
        const name = p.name.length > 12 ? p.name.substring(0, 12) + '…' : p.name;
        ctx.fillText(name, 0, 22);
        
        ctx.shadowBlur = 0;
        ctx.restore();
    });
    
    // ===== مركز العجلة =====
    const centerR = r * 0.18;
    const centerIcon = settingsCache.center_icon || '⭐';
    
    const grad = ctx.createRadialGradient(cx-4, cy-4, 0, cx, cy, centerR);
    grad.addColorStop(0, '#FFD700');
    grad.addColorStop(0.3, '#FFA500');
    grad.addColorStop(0.7, '#FF8C00');
    grad.addColorStop(1, '#B8860B');
    
    ctx.beginPath();
    ctx.arc(cx, cy, centerR, 0, 2 * Math.PI);
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
    ctx.shadowBlur = 40;
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.beginPath();
    ctx.arc(cx, cy, centerR + 5, 0, 2 * Math.PI);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    ctx.fillStyle = '#0a0a0a';
    ctx.font = '32px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 8;
    ctx.fillText(centerIcon, cx, cy + 1);
    ctx.shadowBlur = 0;
}
