<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 منصة الألعاب - الخادم الوسيط</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .login-screen { display: block; }
        .login-screen.hidden { display: none; }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo i {
            font-size: 60px;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo h1 {
            color: #fff;
            font-size: 28px;
            margin-top: 10px;
        }

        .logo .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            margin-top: 5px;
        }

        .logo .badge {
            display: inline-block;
            background: rgba(245, 87, 108, 0.2);
            color: #f5576c;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 8px;
            border: 1px solid rgba(245, 87, 108, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group label i {
            margin-left: 8px;
            color: #f5576c;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            direction: ltr;
        }

        .form-group input:focus {
            border-color: #f5576c;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(245, 87, 108, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-login i {
            margin-left: 10px;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #f5576c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: rgba(255, 255, 255, 0.5);
            margin-top: 12px;
        }

        /* ===== لوحة التحكم ===== */
        .dashboard {
            display: none;
        }

        .dashboard.show {
            display: block;
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
        }

        .user-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
        }

        .user-info h2 {
            color: #fff;
            font-size: 20px;
        }

        .user-info .player-id {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-family: monospace;
        }

        .user-balance {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 10px 18px;
            border-radius: 15px;
            text-align: center;
        }

        .user-balance .amount {
            color: #ffd700;
            font-size: 24px;
            font-weight: 700;
        }

        .user-balance .label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            display: block;
        }

        .section-title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            font-weight: 600;
            margin: 25px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #f5576c;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px 15px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }

        .game-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: #f5576c;
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.15);
        }

        .game-card .game-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .game-card .game-name {
            font-size: 13px;
            font-weight: 600;
            display: block;
        }

        .game-card .game-id {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            font-family: monospace;
            display: block;
            margin-top: 4px;
        }

        .btn-logout {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-logout:hover {
            background: rgba(255, 0, 0, 0.1);
            border-color: rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 8px;
        }

        .status-dot.online {
            background: #4caf50;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .status-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container { padding: 25px 20px; }
            .games-grid { grid-template-columns: 1fr 1fr; }
            .user-balance .amount { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== شاشة تسجيل الدخول ===== -->
        <div class="login-screen" id="loginScreen">
            <div class="logo">
                <i class="fas fa-gamepad"></i>
                <h1>🎮 منصة الألعاب</h1>
                <p class="subtitle">تسجيل دخول آلي عبر الخادم الوسيط</p>
                <span class="badge"><i class="fas fa-shield-alt"></i> اتصال مشفر</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-arrow-left"></i> دخول
                </button>
            </form>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">فشل تسجيل الدخول</span>
            </div>

            <div class="loading" id="loginLoading">
                <div class="spinner"></div>
                <p>جاري تسجيل الدخول وجلب البيانات...</p>
                <p style="font-size: 12px; color: rgba(255,255,255,0.2); margin-top: 5px;">قد يستغرق هذا 5-10 ثواني</p>
            </div>
        </div>

        <!-- ===== لوحة التحكم ===== -->
        <div class="dashboard" id="dashboard">
            <div class="status-bar">
                <span class="status-text">
                    <span class="status-dot online"></span>
                    متصل بالخادم
                </span>
                <span class="status-text" id="sessionTime">جلسة نشطة</span>
            </div>

            <div class="user-header">
                <div class="user-avatar" id="userAvatar">م</div>
                <div class="user-info">
                    <h2 id="userName">مستخدم</h2>
                    <span class="player-id" id="userPlayerId">#---</span>
                </div>
                <div class="user-balance">
                    <span class="amount" id="userBalance">0.00</span>
                    <span class="label">💰 الرصيد</span>
                </div>
            </div>

            <div class="section-title">
                <i class="fas fa-rocket"></i> ألعابي المتاحة
                <span style="font-size: 12px; color: rgba(255,255,255,0.2); margin-right: auto;" id="gameCount">0 لعبة</span>
            </div>

            <div class="games-grid" id="gamesGrid">
                <!-- سيتم إضافتها بواسطة JavaScript -->
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-logout" id="refreshBtn" style="flex:1; margin-top:0;">
                    <i class="fas fa-sync"></i> تحديث
                </button>
                <button class="btn-logout" id="logoutBtn" style="flex:1; margin-top:0;">
                    <i class="fas fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  🎯  التكامل مع الخادم الوسيط
        // ================================================================

        const API_URL = 'https://joj-d0kl.onrender.com';

        // عناصر DOM
        const loginScreen = document.getElementById('loginScreen');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const loginLoading = document.getElementById('loginLoading');

        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userPlayerId = document.getElementById('userPlayerId');
        const userBalance = document.getElementById('userBalance');
        const gamesGrid = document.getElementById('gamesGrid');
        const gameCount = document.getElementById('gameCount');
        const logoutBtn = document.getElementById('logoutBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const sessionTime = document.getElementById('sessionTime');

        let currentSessionId = null;
        let sessionTimer = null;

        // ================================================================
        //  📋  دوال مساعدة
        // ================================================================

        function showError(msg) {
            errorText.textContent = msg || 'حدث خطأ، حاول مرة أخرى';
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        function setLoading(state) {
            if (state) {
                loginLoading.classList.add('show');
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري...';
            } else {
                loginLoading.classList.remove('show');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-arrow-left"></i> دخول';
            }
        }

        function getInitial(name) {
            return name ? name.charAt(0).toUpperCase() : 'م';
        }

        // ================================================================
        //  🎨  عرض لوحة التحكم
        // ================================================================

        function showDashboard(userData) {
            userAvatar.textContent = getInitial(userData.name);
            userName.textContent = userData.name || 'مستخدم';
            userPlayerId.textContent = `#${userData.playerId || '---'}`;
            userBalance.textContent = (userData.balance || 0).toFixed(2);

            // عرض الألعاب
            gamesGrid.innerHTML = '';
            const games = userData.games || [];

            if (games.length === 0) {
                gamesGrid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align:center; color: rgba(255,255,255,0.3); padding: 30px;">
                            <i class="fas fa-gamepad" style="font-size: 40px; display:block; margin-bottom:10px;"></i>
                            لا توجد ألعاب متاحة حالياً
                        </div>
                    `;
                gameCount.textContent = '0 لعبة';
            } else {
                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                            <span class="game-icon">${game.icon || '🎮'}</span>
                            <span class="game-name">${game.name || 'لعبة'}</span>
                            <span class="game-id">ID: ${game.id || '---'}</span>
                        `;
                    card.addEventListener('click', () => {
                        const gameUrl = game.url || 
                            `https://pg.ichancy200.com/launcher/launch?gameId=${game.id}`;
                        window.open(gameUrl, '_blank', 'width=900,height=650,menubar=no,toolbar=no');
                    });
                    gamesGrid.appendChild(card);
                });
                gameCount.textContent = `${games.length} لعبة`;
            }

            // تبديل الشاشات
            loginScreen.classList.add('hidden');
            dashboard.classList.add('show');
            setLoading(false);

            // تحديث وقت الجلسة
            updateSessionTime();
            if (sessionTimer) clearInterval(sessionTimer);
            sessionTimer = setInterval(updateSessionTime, 60000);
        }

        function updateSessionTime() {
            if (currentSessionId) {
                const now = new Date();
                sessionTime.textContent = `🕐 ${now.toLocaleTimeString('ar-EG')}`;
            }
        }

        // ================================================================
        //  🔐  تسجيل الدخول عبر الخادم
        // ================================================================

        async function performLogin(username, password) {
            const response = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'فشل تسجيل الدخول');
            }

            const data = await response.json();
            if (!data.success) {
                throw new Error(data.error || 'فشل تسجيل الدخول');
            }

            return data;
        }

        // ================================================================
        //  📤  تسجيل الخروج
        // ================================================================

        async function logout() {
            if (currentSessionId) {
                try {
                    await fetch(`${API_URL}/logout/${currentSessionId}`, {
                        method: 'POST'
                    });
                } catch (e) {
                    console.error('خطأ في تسجيل الخروج:', e);
                }
            }

            currentSessionId = null;
            if (sessionTimer) {
                clearInterval(sessionTimer);
                sessionTimer = null;
            }

            dashboard.classList.remove('show');
            loginScreen.classList.remove('hidden');
            loginForm.reset();
            hideError();
            setLoading(false);
        }

        // ================================================================
        //  🔄  تحديث البيانات
        // ================================================================

        async function refreshData() {
            if (!currentSessionId) return;

            try {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري...';

                const response = await fetch(`${API_URL}/refresh/${currentSessionId}`);
                if (!response.ok) throw new Error('فشل التحديث');

                const data = await response.json();
                if (data.success && data.user) {
                    // تحديث الرصيد فقط
                    userBalance.textContent = (data.user.balance || 0).toFixed(2);
                }
            } catch (e) {
                console.error('خطأ في التحديث:', e);
                showError('فشل تحديث البيانات');
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = '<i class="fas fa-sync"></i> تحديث';
            }
        }

        // ================================================================
        //  🎯  معالج النموذج
        // ================================================================

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                showError('الرجاء إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            setLoading(true);

            try {
                const data = await performLogin(username, password);
                currentSessionId = data.sessionId;
                showDashboard(data.user);
            } catch (err) {
                setLoading(false);
                showError(err.message || 'فشل تسجيل الدخول');
            }
        });

        // ================================================================
        //  🚪  أزرار التحكم
        // ================================================================

        logoutBtn.addEventListener('click', logout);
        refreshBtn.addEventListener('click', refreshData);

        // ================================================================
        //  ⌨️  اختصار Enter
        // ================================================================

        document.querySelectorAll('.form-group input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });
        });

        // ================================================================
        //  📝  تعليمات التشغيل
        // ================================================================

        console.log('🎮 منصة الألعاب - النسخة المتقدمة');
        console.log('📌 تأكد من تشغيل الخادم أولاً:');
        console.log('   npm install express puppeteer cors');
        console.log('   node server.js');
        console.log('   ثم افتح http://localhost:3000');
    </script>

</body>
</html>
