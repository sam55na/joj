<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🃏 بطاقات الحظ</title>
    <script src="https://telegram.org/js/telegram-web-app.js">
    </script>
    <style>
        /* ===== إعادة ضبط ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow-x: hidden;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* خلفية ثابتة متحركة */
        .bg-image-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.12;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-image-fixed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: slowZoom 30s ease-in-out infinite alternate;
        }
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== النص العلوي ===== */
        .banner-text {
            text-align: center;
            padding: 10px 12px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 520px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            font-size: 20px;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 0.5px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 1;
        }

        /* ===== شاشة اللودينغ ===== */
        .loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #0a0a0a;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .loading-screen.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        .loading-screen .loading-image {
            width: 70vw;
            max-width: 280px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 215, 0, 0.08);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.04);
            animation: loadingPulse 2s ease-in-out infinite;
            margin-bottom: 28px;
        }
        @keyframes loadingPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.85; }
        }
        .loading-screen .progress-container {
            width: 60%;
            max-width: 220px;
            position: relative;
        }
        .loading-screen .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            overflow: hidden;
        }
        .loading-screen .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .loading-screen .progress-text {
            color: #888;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* ===== حاوية البطاقات ===== */
        .cards-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px;
            z-index: 1;
            display: none;
            min-height: 300px;
        }
        .cards-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            justify-content: center;
            perspective: 1200px;
        }

        /* ===== البطاقة ===== */
        .card {
            aspect-ratio: 3/4;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            min-height: 140px;
        }
        .card:hover:not(.flipped):not(.disabled) {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 12px 40px rgba(255, 215, 0, 0.15);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.disabled {
            cursor: not-allowed;
            opacity: 0.3;
            filter: grayscale(0.8);
            transform: scale(0.9);
        }

        .card .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
        }

        /* وجه البطاقة الأمامي (الخلفي) */
        .card .card-back {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid rgba(255, 215, 0, 0.12);
            box-shadow: inset 0 0 50px rgba(255, 215, 0, 0.03);
            transform: rotateY(0deg);
            position: relative;
        }
        .card .card-back::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 2px solid rgba(255, 215, 0, 0.06);
            border-radius: 10px;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 6px,
                rgba(255, 215, 0, 0.02) 6px,
                rgba(255, 215, 0, 0.02) 8px
            );
        }
        .card .card-back .back-pattern {
            font-size: 28px;
            opacity: 0.2;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
            animation: shimmer 3s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes shimmer {
            0%, 100% { opacity: 0.15; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.25; transform: scale(1.05) rotate(5deg); }
        }
        .card .card-back .card-number {
            position: absolute;
            bottom: 6px;
            font-size: 9px;
            color: rgba(255, 215, 0, 0.15);
            font-weight: 700;
            letter-spacing: 2px;
            z-index: 1;
        }

        /* وجه البطاقة الخلفي (الأمامي) */
        .card .card-front {
            background: linear-gradient(145deg, #FFD700, #FF8C00);
            border: 2px solid rgba(255, 215, 0, 0.3);
            transform: rotateY(180deg);
            box-shadow: inset 0 0 60px rgba(255, 215, 0, 0.1);
        }
        .card .card-front .prize-icon {
            font-size: 32px;
            margin-bottom: 4px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }
        .card .card-front .prize-name {
            font-size: 10px;
            font-weight: 700;
            color: #0a0a0a;
            text-align: center;
            line-height: 1.2;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.2);
        }
        .card .card-front .prize-desc {
            font-size: 7px;
            color: rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-top: 2px;
        }

        /* تأثيرات الضوء على البطاقات */
        .card .card-shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.08), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            border-radius: 14px;
        }
        .card:hover .card-shine {
            opacity: 1;
        }

        /* ===== تأثيرات خاصة للبطاقات ===== */
        .card.winner {
            animation: winnerPulse 1s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), 0 0 80px rgba(255, 215, 0, 0.1);
            z-index: 10;
        }
        @keyframes winnerPulse {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.06); }
        }

        .card.loser {
            animation: loserFade 0.8s ease forwards;
        }
        @keyframes loserFade {
            0% { opacity: 1; transform: rotateY(0deg) scale(1); }
            100% { opacity: 0.05; transform: rotateY(0deg) scale(0.7); filter: blur(3px); }
        }

        /* ===== الأزرار ===== */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .btn {
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
        }
        .btn-play {
            background: linear-gradient(135deg, #B8860B, #FFD700);
            color: #0a0a0a;
            box-shadow: 0 4px 30px rgba(255, 215, 0, 0.1);
            font-size: 19px;
        }
        .btn-play:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(255, 215, 0, 0.2);
        }
        .btn-play:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .btn-play .spinner-small {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(10, 10, 10, 0.15);
            border-top: 2px solid #0a0a0a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        .btn-play.loading .spinner-small {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== شرط الإيداع ===== */
        .deposit-notice {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .deposit-notice.show { display: block; }
        .deposit-notice .notice-text { color: #FF8C00; font-size: 14px; }
        .deposit-notice .notice-text .amount { color: #FFD700; font-weight: 700; }

        /* ===== النتيجة ===== */
        .result-box {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 18px;
            padding: 18px 14px;
            margin-top: 14px;
            text-align: center;
            display: none;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
        }
        .result-box.show {
            display: block;
            animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes resultPop {
            0% { transform: scale(0.85) rotate(-2deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .result-box.winner {
            border-color: rgba(255, 215, 0, 0.25);
            background: rgba(255, 215, 0, 0.08);
            animation: winGlow 1.5s ease-in-out infinite alternate;
        }
        @keyframes winGlow {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.04); }
            100% { box-shadow: 0 0 80px rgba(255, 215, 0, 0.12); }
        }
        .result-box .result-icon { font-size: 48px; margin-bottom: 6px; }
        .result-box .result-title { color: #FFD700; font-size: 20px; font-weight: 700; }
        .result-box .result-desc { color: #aaa; font-size: 14px; margin-top: 4px; }

        /* ===== إعدادات الصوت ===== */
        .sound-settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            padding: 6px 16px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .sound-settings label {
            color: #666;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .sound-settings input[type="checkbox"] {
            accent-color: #FFD700;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* ===== لوحة الإدارة ===== */
        .admin-panel {
            display: none;
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.07);
            border-radius: 20px;
            padding: 16px;
            margin-top: 14px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .admin-panel.show { display: block; animation: fadeIn 0.4s ease; }
        .admin-panel .panel-title {
            color: #FFD700;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-panel .panel-title .badge {
            background: #FFD700;
            color: #0a0a0a;
            font-size: 9px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 700;
        }
        .admin-panel .prize-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .admin-panel .prize-item .prize-icon-small { font-size: 22px; width: 34px; text-align: center; }
        .admin-panel .prize-item .prize-info { flex: 1; min-width: 90px; }
        .admin-panel .prize-item .prize-info .name-input {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 6px;
            width: 100%;
        }
        .admin-panel .prize-item .prize-info .name-input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .admin-panel .prize-item .prize-colors {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        .admin-panel .prize-item .prize-colors input[type="color"] {
            width: 26px;
            height: 26px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 2px;
            background: transparent;
            cursor: pointer;
        }
        .admin-panel .prize-item .btn-delete {
            background: rgba(255, 0, 0, 0.08);
            border: none;
            color: #FF4444;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .admin-panel .add-prize-form {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .admin-panel .add-prize-form input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 11px;
            min-width: 50px;
        }
        .admin-panel .add-prize-form input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .admin-panel .add-prize-form .btn-add {
            padding: 6px 16px;
            background: linear-gradient(135deg, #B8860B, #FFD700);
            border: none;
            border-radius: 6px;
            color: #0a0a0a;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-panel .add-prize-form .btn-add:hover { transform: scale(1.05); }
        .admin-panel .panel-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .admin-panel .panel-actions .btn-action {
            padding: 5px 14px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            color: #FFD700;
            font-size: 10px;
            cursor: pointer;
        }
        .admin-panel .panel-actions .btn-action.danger {
            color: #FF4444;
            border-color: rgba(255, 0, 0, 0.1);
        }

        /* ===== إشعار منبثق ===== */
        .notification-bar {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            color: #0a0a0a;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            z-index: 1000;
            box-shadow: 0 10px 60px rgba(255, 215, 0, 0.25);
            animation: notifSlideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90%;
            text-align: center;
        }
        .notification-bar.show { display: block; }
        @keyframes notifSlideDown {
            0% { transform: translateX(-50%) translateY(-100px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        /* ===== خطأ ===== */
        .error-msg {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 0, 0, 0.06);
            border-radius: 12px;
            padding: 10px;
            color: #FF6B6B;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
        }
        .error-msg.show { display: block; }

        /* ===== تجاوب ===== */
        @media (max-width: 480px) {
            .cards-grid { gap: 8px; }
            .card { min-height: 110px; }
            .card .card-front .prize-icon { font-size: 26px; }
            .card .card-front .prize-name { font-size: 9px; }
            .card .card-back .back-pattern { font-size: 22px; }
            .banner-text { font-size: 17px; padding: 8px 10px; }
            .btn { font-size: 16px; padding: 14px 16px; }
        }

        @media (max-width: 380px) {
            .cards-grid { gap: 6px; }
            .card { min-height: 90px; }
            .card .card-front .prize-icon { font-size: 20px; }
            .card .card-front .prize-name { font-size: 8px; }
        }

        @media (min-width: 600px) {
            .cards-grid { gap: 16px; }
            .card { min-height: 180px; }
            .card .card-front .prize-icon { font-size: 40px; }
            .card .card-front .prize-name { font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- ===== خلفية ===== -->
    <div class="bg-image-fixed">
        <img id="bgImage" src="https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=1920&q=80" alt="Background">
    </div>

    <!-- ===== إشعار ===== -->
    <div class="notification-bar" id="notificationBar">
        🎉 مبروك! <span id="notifPrizeName">جائزة</span>
    </div>

    <!-- ===== النص العلوي ===== -->
    <div class="banner-text" id="bannerText">🃏 IChancy · بطاقات الحظ</div>

    <!-- ===== شاشة لودينغ ===== -->
    <div class="loading-screen" id="loadingScreen">
        <img class="loading-image" id="loadingImage" src="https://media.giphy.com/media/3o7bu8sRnYpTOG1p8k/giphy.gif" alt="Loading">
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="loaderProgressBar"></div>
            </div>
            <div class="progress-text" id="loaderStatusText">0%</div>
        </div>
    </div>

    <!-- ===== 6 بطاقات ===== -->
    <div class="cards-container" id="cardsContainer">
        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- ===== أزرار ===== -->
    <div class="actions">
        <button class="btn btn-play" id="playBtn" disabled>
            <span class="spinner-small"></span>
            <span id="playBtnText">🃏 اختر بطاقة</span>
        </button>
    </div>

    <!-- ===== شرط الإيداع ===== -->
    <div class="deposit-notice" id="depositNotice">
        <div class="notice-text">
            💰 مطلوب إيداع <span class="amount" id="depositMinAmount">0</span> SYP
            خلال <span id="depositCheckHours">24</span> ساعة
        </div>
    </div>

    <!-- ===== النتيجة ===== -->
    <div class="result-box" id="resultBox">
        <div class="result-icon" id="resultIcon">🎁</div>
        <div class="result-title" id="resultTitle">جائزة!</div>
        <div class="result-desc" id="resultDesc"></div>
    </div>

    <!-- ===== إعدادات الصوت ===== -->
    <div class="sound-settings">
        <label>
            <span>🔊</span>
            <input type="checkbox" id="soundToggle" checked> مؤثرات
        </label>
        <label>
            <span>🎵</span>
            <input type="checkbox" id="musicToggle" checked> موسيقى
        </label>
    </div>

    <!-- ===== لوحة الإدارة ===== -->
    <div class="admin-panel" id="adminPanel">
        <div class="panel-title">
            ⚙️ لوحة الإدارة
            <span class="badge">ADMIN</span>
        </div>
        <div id="prizesList"></div>

        <div class="add-prize-form">
            <input type="text" id="newPrizeName" placeholder="الاسم">
            <input type="text" id="newPrizeIcon" placeholder="🎁" style="max-width:44px;">
            <input type="text" id="newPrizeDesc" placeholder="الوصف" style="flex:1.5;">
            <input type="color" id="newPrizeColor" value="#FFD700" style="max-width:34px;padding:2px;">
            <input type="color" id="newPrizeCardColor" value="#1a1a2e" style="max-width:34px;padding:2px;">
            <button class="btn-add" id="addPrizeBtn">➕</button>
        </div>

        <div class="panel-actions">
            <button class="btn-action" id="refreshPrizesBtn">🔄 تحديث</button>
            <button class="btn-action danger" id="resetPrizesBtn">🗑️ إعادة تعيين</button>
        </div>
    </div>

    <!-- ===== خطأ ===== -->
    <div class="error-msg" id="errorMsg">
        <span id="errorText"></span>
    </div>

    <script>
        // ================================================================
        //                      الإعدادات الأساسية
        // ================================================================
        const API_BASE = 'https://joj-d0kl.onrender.com';
        const ADMIN_ID = 7011476249;
        let USER_ID = null;
        let isPlaying = false;
        let prizesCache = [];
        let settingsCache = {};
        let flipDuration = 600;
        let totalCards = 6;
        let selectedCardIndex = -1;
        let soundEnabled = true;
        let musicEnabled = true;
        let gameResult = null;

        // ================================================================
        //                      نظام الصوت
        // ================================================================
        class SoundManager {
            constructor() {
                this.initialized = false;
                this.audioContext = null;
                this.bgInterval = null;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.warn('Web Audio not supported');
                }
            }

            stopAll() {
                if (this.audioContext) {
                    try {
                        this.audioContext.close();
                        this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {}
                }
                this.stopBackgroundMusic();
            }

            playFlipSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.12);
                    osc.type = 'sawtooth';
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } catch (e) {
                    console.warn('Sound error:', e);
                }
            }

            playWinSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    const melody = [
                        [523, 0.06],
                        [659, 0.06],
                        [784, 0.06],
                        [1047, 0.1],
                        [784, 0.06],
                        [988, 0.06],
                        [1175, 0.1],
                        [1319, 0.12]
                    ];
                    melody.forEach(([freq, dur], i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, now + i * 0.06);
                        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                        gain.gain.setValueAtTime(0.05, now + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + dur);
                        osc.start(now + i * 0.06);
                        osc.stop(now + i * 0.06 + dur);
                    });
                } catch (e) {
                    console.warn('Sound error:', e);
                }
            }

            playLoseSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
                    osc.type = 'sawtooth';
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } catch (e) {
                    console.warn('Sound error:', e);
                }
            }

            playBackgroundMusic() {
                if (!musicEnabled || !this.initialized) return;
                if (this.bgInterval) return;
                try {
                    const ctx = this.audioContext;
                    const playNote = (freq, time, dur, vol, type = 'sine') => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, time);
                        osc.type = type;
                        gain.gain.setValueAtTime(vol || 0.015, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
                        osc.start(time);
                        osc.stop(time + dur);
                    };
                    const pattern = [
                        [262, 0.25, 0.012],
                        [330, 0.25, 0.012],
                        [392, 0.25, 0.012],
                        [523, 0.3, 0.015]
                    ];
                    pattern.forEach(([freq, dur, vol], i) => {
                        const time = ctx.currentTime + i * 0.3;
                        playNote(freq, time, dur, vol, i % 2 === 0 ? 'sine' : 'triangle');
                    });
                    this.bgInterval = setInterval(() => {
                        if (!musicEnabled || !this.initialized) {
                            this.stopBackgroundMusic();
                            return;
                        }
                        const t = ctx.currentTime;
                        const notes = [131, 165, 196, 262];
                        notes.forEach((freq, i) => {
                            playNote(freq, t + i * 0.15, 0.12, 0.008, 'square');
                        });
                    }, 1200);
                } catch (e) {
                    console.warn('Music error:', e);
                }
            }

            stopBackgroundMusic() {
                if (this.bgInterval) {
                    clearInterval(this.bgInterval);
                    this.bgInterval = null;
                }
            }
        }

        const soundManager = new SoundManager();

        // ================================================================
        //                      جلب USER_ID
        // ================================================================
        function getUserId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('user_id') || params.get('userId') || params.get('id');
            if (id && !isNaN(id)) {
                USER_ID = parseInt(id);
                localStorage.setItem('flip_user_id', USER_ID);
                return USER_ID;
            }
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const user = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (user && user.id) {
                        USER_ID = user.id;
                        localStorage.setItem('flip_user_id', USER_ID);
                        return USER_ID;
                    }
                }
            } catch (e) {}
            id = localStorage.getItem('flip_user_id');
            if (id) {
                USER_ID = parseInt(id);
                return USER_ID;
            }
            return null;
        }

        // ================================================================
        //                      إنشاء 6 بطاقات
        // ================================================================
        function createCards(count = 6) {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < count; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                
                // اختيار جائزة عشوائية للخلفية
                const randomPrize = prizesCache.length > 0 ? 
                    prizesCache[Math.floor(Math.random() * prizesCache.length)] : 
                    { icon: '🎁', name: 'جائزة', description: '', card_color: '#1a1a2e', card_back_color: '#16213e' };
                
                card.innerHTML = `
                    <div class="card-face card-back">
                        <div class="back-pattern">🃏</div>
                        <div class="card-number">#${String(i + 1).padStart(2, '0')}</div>
                        <div class="card-shine"></div>
                    </div>
                    <div class="card-face card-front" style="background: linear-gradient(145deg, ${randomPrize.card_color || '#1a1a2e'}, ${randomPrize.card_back_color || '#16213e'});">
                        <div class="prize-icon">${randomPrize.icon || '🎁'}</div>
                        <div class="prize-name">${randomPrize.name || 'جائزة'}</div>
                        <div class="prize-desc">${randomPrize.description || ''}</div>
                        <div class="card-shine"></div>
                    </div>
                `;
                
                card.addEventListener('click', () => handleCardClick(i));
                grid.appendChild(card);
            }
        }

        // ================================================================
        //                      التعامل مع اختيار البطاقة
        // ================================================================
        async function handleCardClick(index) {
            if (isPlaying) return;
            if (document.getElementById('playBtn').disabled) return;
            if (selectedCardIndex !== -1) return;
            
            selectedCardIndex = index;
            isPlaying = true;
            
            const playBtn = document.getElementById('playBtn');
            playBtn.disabled = true;
            playBtn.classList.add('loading');
            document.getElementById('playBtnText').textContent = 'جاري اللعب...';
            
            soundManager.init();
            soundManager.playBackgroundMusic();
            
            try {
                const response = await fetch(`${API_BASE}/api/flip/play`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: USER_ID })
                });
                
                const data = await response.json();
                playBtn.classList.remove('loading');
                
                if (data.success) {
                    const prize = data.game.prize;
                    const winningIndex = data.game.card_index;
                    
                    // حفظ النتيجة
                    gameResult = { prize, isWin: !prize.name.includes('حظ سعيد') };
                    
                    // كشف البطاقات
                    await revealCards(winningIndex, prize);
                    
                    // عرض النتيجة
                    showResult(prize, gameResult.isWin);
                    
                    if (gameResult.isWin) {
                        soundManager.playWinSound();
                        showNotification(`🎉 مبروك! ${prize.description || prize.name}!`);
                    } else {
                        soundManager.playLoseSound();
                    }
                    
                } else {
                    showError(data.error || 'حدث خطأ');
                    if (data.remaining_hours !== undefined) {
                        const btn = document.getElementById('playBtn');
                        btn.disabled = true;
                        document.getElementById('playBtnText').textContent = `⏳ ${data.remaining_hours}h ${data.remaining_minutes}m`;
                        soundManager.stopAll();
                    }
                    selectedCardIndex = -1;
                    isPlaying = false;
                }
                
            } catch (e) {
                playBtn.classList.remove('loading');
                showError('خطأ في الاتصال: ' + e.message);
                soundManager.stopAll();
                selectedCardIndex = -1;
                isPlaying = false;
            }
            
            if (!document.getElementById('playBtn').disabled && !isPlaying) {
                document.getElementById('playBtnText').textContent = '🃏 اختر بطاقة';
            }
        }

        // ================================================================
        //                      كشف البطاقات
        // ================================================================
        async function revealCards(winningIndex, prize) {
            const cards = document.querySelectorAll('.card');
            const total = cards.length;
            
            // 1. تحديث البطاقة الفائزة
            const winnerCard = cards[winningIndex];
            if (winnerCard) {
                const front = winnerCard.querySelector('.card-front');
                front.style.background = `linear-gradient(145deg, ${prize.color || '#FFD700'}, ${prize.card_color || '#1a1a2e'})`;
                front.querySelector('.prize-icon').textContent = prize.icon || '🎁';
                front.querySelector('.prize-name').textContent = prize.name || 'جائزة';
                front.querySelector('.prize-desc').textContent = prize.description || '';
            }
            
            // 2. كشف البطاقة الفائزة أولاً مع تأخير
            await new Promise(resolve => {
                setTimeout(() => {
                    if (winnerCard) {
                        winnerCard.classList.add('flipped');
                        winnerCard.classList.add('winner');
                        soundManager.playFlipSound();
                    }
                    resolve();
                }, 300);
            });
            
            // 3. كشف البطاقات الأخرى مع تأخير متدرج
            const otherCards = Array.from(cards).filter((_, i) => i !== winningIndex);
            for (let i = 0; i < otherCards.length; i++) {
                const card = otherCards[i];
                const delay = 200 + (i * 100);
                
                await new Promise(resolve => {
                    setTimeout(() => {
                        // تحديث محتوى البطاقة بجائزة عشوائية
                        const randomPrize = prizesCache.length > 0 ? 
                            prizesCache[Math.floor(Math.random() * prizesCache.length)] : 
                            { icon: '🎁', name: 'جائزة', description: '', card_color: '#1a1a2e', card_back_color: '#16213e' };
                        
                        const front = card.querySelector('.card-front');
                        front.style.background = `linear-gradient(145deg, ${randomPrize.card_color || '#1a1a2e'}, ${randomPrize.card_back_color || '#16213e'})`;
                        front.querySelector('.prize-icon').textContent = randomPrize.icon || '🎁';
                        front.querySelector('.prize-name').textContent = randomPrize.name || 'جائزة';
                        front.querySelector('.prize-desc').textContent = randomPrize.description || '';
                        
                        card.classList.add('flipped');
                        card.classList.add('disabled');
                        card.classList.add('loser');
                        
                        soundManager.playFlipSound();
                        resolve();
                    }, delay);
                });
            }
            
            // 4. انتظار انتهاء جميع التأثيرات
            await new Promise(resolve => setTimeout(resolve, 400));
        }

        // ================================================================
        //                      عرض النتيجة
        // ================================================================
        function showResult(prize, isWin) {
            const resultBox = document.getElementById('resultBox');
            document.getElementById('resultIcon').textContent = prize.icon || '🎁';
            document.getElementById('resultTitle').textContent = prize.name || 'جائزة!';
            document.getElementById('resultDesc').textContent = prize.description || '';
            
            resultBox.classList.add('show');
            if (isWin) {
                resultBox.classList.add('winner');
            } else {
                resultBox.classList.remove('winner');
            }
            
            loadUserStatus();
        }

        // ================================================================
        //                      تحميل البيانات
        // ================================================================
        async function loadPrizes() {
            try {
                const res = await fetch(`${API_BASE}/api/prizes`);
                const data = await res.json();
                if (data.success && data.prizes && data.prizes.length > 0) {
                    prizesCache = data.prizes;
                    return data.prizes;
                }
                return [];
            } catch (e) {
                console.error('Error loading prizes:', e);
                return [];
            }
        }

        async function loadSettings() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/settings?admin_id=${ADMIN_ID}`);
                const data = await res.json();
                if (data.success) {
                    settingsCache = data.settings;
                    
                    if (settingsCache.banner_text) {
                        document.getElementById('bannerText').textContent = settingsCache.banner_text;
                    }
                    if (settingsCache.bg_image_url) {
                        document.getElementById('bgImage').src = settingsCache.bg_image_url;
                    }
                    if (settingsCache.loading_image_url) {
                        document.getElementById('loadingImage').src = settingsCache.loading_image_url;
                    }
                    
                    totalCards = parseInt(settingsCache.cards_count) || 6;
                    flipDuration = parseInt(settingsCache.flip_duration) || 600;
                    
                    return data.settings;
                }
                return {};
            } catch (e) {
                console.error('Error loading settings:', e);
                return {};
            }
        }

        async function loadUserStatus() {
            if (!USER_ID) return;
            try {
                const res = await fetch(`${API_BASE}/api/flip/history/${USER_ID}`);
                const data = await res.json();
                if (data.success) {
                    const depositNotice = document.getElementById('depositNotice');
                    
                    if (data.deposit_requirement?.required) {
                        const minAmount = data.deposit_requirement.min_amount || 0;
                        const checkHours = data.deposit_requirement.check_hours || 24;
                        document.getElementById('depositMinAmount').textContent = minAmount;
                        document.getElementById('depositCheckHours').textContent = checkHours;
                        depositNotice.classList.add('show');
                    } else {
                        depositNotice.classList.remove('show');
                    }
                    
                    const playBtn = document.getElementById('playBtn');
                    const canPlay = data.play_status?.can_play !== false &&
                        (!data.deposit_requirement?.required || data.deposit_requirement?.is_met);
                    
                    if (canPlay && prizesCache.length > 0 && selectedCardIndex === -1) {
                        playBtn.disabled = false;
                        document.getElementById('playBtnText').textContent = '🃏 اختر بطاقة';
                    } else if (selectedCardIndex !== -1) {
                        playBtn.disabled = true;
                        document.getElementById('playBtnText').textContent = '✅ تم الاختيار';
                    } else if (!data.play_status?.can_play) {
                        playBtn.disabled = true;
                        const h = data.play_status?.remaining_hours || 0;
                        const m = data.play_status?.remaining_minutes || 0;
                        document.getElementById('playBtnText').textContent = `⏳ ${h}h ${m}m`;
                        soundManager.stopAll();
                    } else if (data.deposit_requirement?.required && !data.deposit_requirement?.is_met) {
                        playBtn.disabled = true;
                        document.getElementById('playBtnText').textContent = '💰 إيداع مطلوب';
                        soundManager.stopAll();
                    } else {
                        playBtn.disabled = true;
                        document.getElementById('playBtnText').textContent = '⏳ جاري التحميل...';
                    }
                }
            } catch (e) {
                console.error('Error loading user status:', e);
            }
        }

        // ================================================================
        //                      لوحة الإدارة
        // ================================================================
        async function renderAdminPanel() {
            const panel = document.getElementById('adminPanel');
            const list = document.getElementById('prizesList');
            
            if (USER_ID !== ADMIN_ID) {
                panel.classList.remove('show');
                return;
            }
            
            panel.classList.add('show');
            
            try {
                const res = await fetch(`${API_BASE}/api/admin/prizes?admin_id=${ADMIN_ID}`);
                const data = await res.json();
                
                if (!data.success || !data.prizes || data.prizes.length === 0) {
                    list.innerHTML = `
                        <div style="color:#555;font-size:13px;text-align:center;padding:20px;">
                            <div style="font-size:30px;margin-bottom:10px;">📭</div>
                            لا توجد جوائز
                        </div>
                    `;
                    return;
                }
                
                list.innerHTML = data.prizes.map(p => `
                    <div class="prize-item" data-id="${p.id}">
                        <div class="prize-icon-small">${p.icon || '🎁'}</div>
                        <div class="prize-info">
                            <input type="text" class="name-input" value="${p.name}" placeholder="الاسم">
                        </div>
                        <div class="prize-colors">
                            <input type="color" class="color-input" value="${p.color || '#FFD700'}" data-field="color" data-id="${p.id}">
                            <input type="color" class="color-input" value="${p.card_color || '#1a1a2e'}" data-field="card_color" data-id="${p.id}">
                            <input type="color" class="color-input" value="${p.card_back_color || '#16213e'}" data-field="card_back_color" data-id="${p.id}">
                        </div>
                        <button class="btn-delete" data-id="${p.id}">✕</button>
                    </div>
                `).join('');
                
                list.querySelectorAll('.name-input').forEach(input => {
                    input.addEventListener('change', async function() {
                        const id = parseInt(this.closest('.prize-item').dataset.id);
                        const value = this.value.trim();
                        if (!value) { showError('⚠️ الاسم مطلوب'); return; }
                        const success = await updatePrize(id, { name: value });
                        if (success) { await refreshAll(); showNotification('✅ تم التحديث'); }
                    });
                });
                
                list.querySelectorAll('.color-input').forEach(input => {
                    input.addEventListener('change', async function() {
                        const id = parseInt(this.dataset.id);
                        const field = this.dataset.field;
                        const value = this.value;
                        const updateData = {};
                        updateData[field] = value;
                        const success = await updatePrize(id, updateData);
                        if (success) { await refreshAll(); showNotification('✅ تم تحديث اللون'); }
                    });
                });
                
                list.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = parseInt(this.dataset.id);
                        if (confirm('⚠️ هل أنت متأكد من الحذف؟')) {
                            const success = await deletePrize(id);
                            if (success) { await refreshAll(); showNotification('✅ تم الحذف'); }
                        }
                    });
                });
                
            } catch (e) {
                console.error('Error rendering admin panel:', e);
            }
        }

        async function updatePrize(prizeId, data) {
            try {
                const response = await fetch(`${API_BASE}/api/admin/prizes/${prizeId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID, ...data })
                });
                const result = await response.json();
                return result.success === true;
            } catch (e) {
                console.error('Error updating prize:', e);
                return false;
            }
        }

        async function deletePrize(prizeId) {
            try {
                const response = await fetch(`${API_BASE}/api/admin/prizes/${prizeId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID })
                });
                const data = await response.json();
                return data.success === true;
            } catch (e) {
                console.error('Error deleting prize:', e);
                return false;
            }
        }

        async function addPrize(name, icon, description, color, card_color, card_back_color) {
            try {
                const response = await fetch(`${API_BASE}/api/admin/prizes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        admin_id: ADMIN_ID,
                        name: name,
                        icon: icon || '🎁',
                        description: description || '',
                        color: color || '#FFD700',
                        card_color: card_color || '#1a1a2e',
                        card_back_color: card_back_color || '#16213e'
                    })
                });
                const data = await response.json();
                return data.success === true;
            } catch (e) {
                console.error('Error adding prize:', e);
                return false;
            }
        }

        async function resetPrizes() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/seed-prizes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID })
                });
                const data = await res.json();
                return data.success;
            } catch (e) {
                console.error('Error resetting prizes:', e);
                return false;
            }
        }

        // ================================================================
        //                      تحديث الكل
        // ================================================================
        async function refreshAll() {
            await loadSettings();
            const prizes = await loadPrizes();
            if (prizes.length > 0) {
                createCards(6);
                document.getElementById('cardsContainer').classList.add('show');
            }
            await loadUserStatus();
            await renderAdminPanel();
        }

        // ================================================================
        //                      دوال مساعدة
        // ================================================================
        function showNotification(message) {
            const bar = document.getElementById('notificationBar');
            document.getElementById('notifPrizeName').textContent = message;
            bar.classList.add('show');
            setTimeout(() => { bar.classList.remove('show'); }, 4000);
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            document.getElementById('errorText').textContent = '❌ ' + msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function updateLoading(progress) {
            document.getElementById('loaderProgressBar').style.width = progress + '%';
            document.getElementById('loaderStatusText').textContent = progress + '%';
        }

        function showLoading(show) {
            const screen = document.getElementById('loadingScreen');
            if (show) {
                screen.classList.add('active');
                document.getElementById('cardsContainer').classList.remove('show');
            } else {
                screen.classList.remove('active');
                document.getElementById('cardsContainer').classList.add('show');
            }
        }

        // ================================================================
        //                      أحداث الإدارة
        // ================================================================
        document.getElementById('addPrizeBtn').addEventListener('click', async function() {
            const name = document.getElementById('newPrizeName').value.trim();
            const icon = document.getElementById('newPrizeIcon').value.trim() || '🎁';
            const desc = document.getElementById('newPrizeDesc').value.trim() || '';
            const color = document.getElementById('newPrizeColor').value || '#FFD700';
            const cardColor = document.getElementById('newPrizeCardColor').value || '#1a1a2e';
            
            if (!name) {
                showError('⚠️ الرجاء إدخال اسم الجائزة');
                return;
            }
            
            this.disabled = true;
            this.textContent = '⏳';
            
            const success = await addPrize(name, icon, desc, color, cardColor, '#16213e');
            if (success) {
                document.getElementById('newPrizeName').value = '';
                document.getElementById('newPrizeIcon').value = '';
                document.getElementById('newPrizeDesc').value = '';
                await refreshAll();
                showNotification(`✅ تم إضافة "${name}"`);
            } else {
                showError('❌ فشل إضافة الجائزة');
            }
            this.disabled = false;
            this.textContent = '➕';
        });

        document.getElementById('refreshPrizesBtn').addEventListener('click', async function() {
            await refreshAll();
            showNotification('🔄 تم التحديث');
        });

        document.getElementById('resetPrizesBtn').addEventListener('click', async function() {
            if (confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع الجوائز؟')) {
                const success = await resetPrizes();
                if (success) {
                    await refreshAll();
                    showNotification('✅ تم إعادة التعيين');
                } else {
                    showError('❌ فشل إعادة التعيين');
                }
            }
        });

        document.getElementById('soundToggle').addEventListener('change', function() {
            soundEnabled = this.checked;
            if (!soundEnabled) soundManager.stopAll();
            else { soundManager.init(); soundManager.playBackgroundMusic(); }
        });

        document.getElementById('musicToggle').addEventListener('change', function() {
            musicEnabled = this.checked;
            if (!musicEnabled) soundManager.stopBackgroundMusic();
            else { soundManager.init(); soundManager.playBackgroundMusic(); }
        });

        // ================================================================
        //                      التهيئة
        // ================================================================
        async function init() {
            USER_ID = getUserId();
            
            if (!USER_ID) {
                document.getElementById('errorContainer').classList.add('show');
                return;
            }
            
            showLoading(true);
            updateLoading(0);
            
            try {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 15;
                    if (progress > 85) progress = 85;
                    updateLoading(Math.round(progress));
                }, 150);
                
                await loadSettings();
                updateLoading(30);
                await new Promise(r => setTimeout(r, 300));
                
                const prizes = await loadPrizes();
                updateLoading(50);
                await new Promise(r => setTimeout(r, 300));
                
                if (prizes.length > 0) {
                    createCards(6);
                    document.getElementById('cardsContainer').classList.add('show');
                }
                updateLoading(70);
                await new Promise(r => setTimeout(r, 300));
                
                await loadUserStatus();
                updateLoading(85);
                await new Promise(r => setTimeout(r, 300));
                
                await renderAdminPanel();
                updateLoading(95);
                await new Promise(r => setTimeout(r, 300));
                
                clearInterval(interval);
                updateLoading(100);
                await new Promise(r => setTimeout(r, 500));
                
                soundManager.init();
                soundManager.playBackgroundMusic();
                
            } catch (e) {
                console.error('Init error:', e);
                showError('⚠️ فشل تحميل البيانات: ' + e.message);
            }
            
            showLoading(false);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
