<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🃏 بطاقات الحظ - الاحترافية</title>
    <script src="https://telegram.org/js/telegram-web-app.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            position: relative;
        }

        /* خلفية ثلاثية الأبعاد */
        .bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a0a 70%);
            overflow: hidden;
        }
        .bg-3d .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.3), transparent);
            animation: floatParticle 15s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes floatParticle {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { transform: translate(30px, -50px) scale(1.5); opacity: 0.8; }
        }

        /* تأثير الضوء المتحرك */
        .light-sweep {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(255,215,0,0.03), transparent 60%);
            animation: sweepLight 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes sweepLight {
            0%, 100% { transform: translateX(-30%) rotate(0deg); }
            50% { transform: translateX(30%) rotate(10deg); }
        }

        /* ===== النص العلوي ===== */
        .banner-text {
            text-align: center;
            padding: 12px 24px;
            margin: 10px auto 15px;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.08);
            font-size: 22px;
            font-weight: 800;
            color: #FFD700;
            letter-spacing: 1px;
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 1;
            text-shadow: 0 0 40px rgba(255,215,0,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .banner-text .glow {
            animation: textGlow 2s ease-in-out infinite;
        }
        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(255,215,0,0.1); }
            50% { text-shadow: 0 0 40px rgba(255,215,0,0.3), 0 0 80px rgba(255,215,0,0.1); }
        }

        /* ===== شاشة اللودينغ ===== */
        .loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #0a0a0a;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .loading-screen.active { display: flex; }
        .loading-screen .loader-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid rgba(255,215,0,0.05);
            border-top: 3px solid #FFD700;
            animation: spinRing 1s linear infinite;
            position: relative;
        }
        .loading-screen .loader-ring::before {
            content: '🃏';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
        }
        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-screen .loader-text {
            color: #666;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .loading-screen .progress-bar {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            overflow: hidden;
        }
        .loading-screen .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* ===== حاوية البطاقات ===== */
        .cards-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 15px;
            z-index: 1;
            display: none;
            perspective: 1500px;
        }
        .cards-container.show {
            display: block;
            animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            justify-content: center;
        }

        /* ===== البطاقة 3D ===== */
        .card {
            aspect-ratio: 3/4;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            border-radius: 16px;
            min-height: 150px;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
        }
        .card:not(.disabled):not(.flipped):hover {
            transform: translateY(-10px) scale(1.02) rotateX(5deg);
            filter: drop-shadow(0 20px 50px rgba(255,215,0,0.15));
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card.disabled {
            cursor: default;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .card .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,215,0,0.05);
        }

        /* الوجه الخلفي (المقفل) */
        .card .card-back {
            background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
            transform: rotateY(0deg);
            box-shadow: inset 0 0 80px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,215,0,0.06);
        }
        .card .card-back .back-design {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card .card-back .back-design .pattern {
            position: absolute;
            width: 80%;
            height: 80%;
            border: 2px solid rgba(255,215,0,0.03);
            border-radius: 12px;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,215,0,0.02) 10px,
                rgba(255,215,0,0.02) 11px
            );
        }
        .card .card-back .back-design .icon-big {
            font-size: 40px;
            opacity: 0.15;
            animation: pulseIcon 3s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(1.1); opacity: 0.25; }
        }
        .card .card-back .back-design .card-number {
            position: absolute;
            bottom: 12px;
            font-size: 11px;
            color: rgba(255,215,0,0.08);
            font-weight: 700;
            letter-spacing: 3px;
            z-index: 1;
        }
        .card .card-back .glow-ring {
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border-radius: 12px;
            border: 1px solid rgba(255,215,0,0.03);
            box-shadow: inset 0 0 30px rgba(255,215,0,0.02);
        }

        /* الوجه الأمامي (المكشوف) */
        .card .card-front {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #FFD700, #FF8C00);
            box-shadow: inset 0 0 60px rgba(255,215,0,0.1);
            border: 2px solid rgba(255,215,0,0.2);
        }
        .card .card-front .prize-icon {
            font-size: 42px;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.2));
            animation: iconFloat 2s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .card .card-front .prize-name {
            font-size: 12px;
            font-weight: 800;
            color: #0a0a0a;
            text-align: center;
            line-height: 1.3;
            text-shadow: 0 1px 8px rgba(255,255,255,0.1);
        }
        .card .card-front .prize-desc {
            font-size: 9px;
            color: rgba(0,0,0,0.5);
            text-align: center;
            margin-top: 3px;
            font-weight: 500;
        }
        .card .card-front .shine-effect {
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.2), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .card.flipped .card-front .shine-effect {
            opacity: 1;
        }

        /* ===== البطاقة الفائزة ===== */
        .card.winner {
            animation: winnerGlow 1.5s ease-in-out infinite !important;
            filter: drop-shadow(0 0 40px rgba(255,215,0,0.3)) !important;
            z-index: 10;
        }
        @keyframes winnerGlow {
            0%, 100% { transform: rotateY(180deg) scale(1); filter: drop-shadow(0 0 30px rgba(255,215,0,0.2)); }
            50% { transform: rotateY(180deg) scale(1.05); filter: drop-shadow(0 0 60px rgba(255,215,0,0.4)); }
        }

        /* ===== البطاقات الخاسرة ===== */
        .card.loser {
            animation: loserFade 0.6s ease forwards;
        }
        @keyframes loserFade {
            0% { opacity: 1; transform: rotateY(0deg) scale(1) translateY(0); }
            100% { opacity: 0; transform: rotateY(0deg) scale(0.7) translateY(30px); filter: blur(5px); }
        }

        /* ===== التأثيرات الخاصة ===== */
        .card .sparkle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            border-radius: 16px;
        }
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            animation: sparkleAnim 1.5s ease-in infinite;
        }
        @keyframes sparkleAnim {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1) rotate(180deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        /* ===== الأزرار ===== */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            width: 100%;
            max-width: 380px;
            z-index: 1;
            position: relative;
            padding: 0 10px;
        }
        .btn {
            padding: 18px 24px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .btn:hover:not(:disabled)::after {
            opacity: 1;
        }
        .btn-play {
            background: linear-gradient(135deg, #B8860B, #FFD700);
            color: #0a0a0a;
            box-shadow: 0 4px 30px rgba(255,215,0,0.15);
            font-size: 20px;
            letter-spacing: 1px;
        }
        .btn-play:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 50px rgba(255,215,0,0.25);
        }
        .btn-play:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-play .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 2px solid rgba(10,10,10,0.1);
            border-top: 2px solid #0a0a0a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
        .btn-play.loading .spinner {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== نتيجة اللعبة ===== */
        .result-box {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,215,0,0.05);
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
            text-align: center;
            display: none;
            width: 100%;
            max-width: 380px;
            z-index: 1;
            position: relative;
            animation: resultPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes resultPop {
            0% { transform: scale(0.8) rotate(-3deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .result-box.show { display: block; }
        .result-box.winner {
            border-color: rgba(255,215,0,0.2);
            box-shadow: 0 0 60px rgba(255,215,0,0.05);
        }
        .result-box .result-icon {
            font-size: 52px;
            margin-bottom: 8px;
            animation: iconFloat 2s ease-in-out infinite;
        }
        .result-box .result-title {
            color: #FFD700;
            font-size: 22px;
            font-weight: 800;
        }
        .result-box .result-desc {
            color: #888;
            font-size: 14px;
            margin-top: 6px;
        }

        /* ===== إعدادات الصوت ===== */
        .sound-settings {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
            padding: 8px 20px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.03);
            width: 100%;
            max-width: 380px;
            z-index: 1;
            position: relative;
        }
        .sound-settings label {
            color: #666;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .sound-settings label:hover {
            color: #FFD700;
        }
        .sound-settings input[type="checkbox"] {
            accent-color: #FFD700;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* ===== لوحة الإدارة ===== */
        .admin-panel {
            display: none;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,215,0,0.05);
            border-radius: 20px;
            padding: 16px;
            margin-top: 14px;
            width: 100%;
            max-width: 420px;
            z-index: 1;
            position: relative;
        }
        .admin-panel.show { display: block; animation: fadeInUp 0.4s ease; }
        .admin-panel .panel-title {
            color: #FFD700;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-panel .panel-title .badge {
            background: #FFD700;
            color: #0a0a0a;
            font-size: 9px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 700;
        }
        .admin-panel .prize-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .admin-panel .prize-item .prize-icon-small { font-size: 22px; width: 34px; text-align: center; }
        .admin-panel .prize-item .prize-info { flex: 1; min-width: 90px; }
        .admin-panel .prize-item .prize-info .name-input {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            width: 100%;
            transition: border-color 0.3s;
        }
        .admin-panel .prize-item .prize-info .name-input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .admin-panel .prize-item .prize-colors {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .admin-panel .prize-item .prize-colors input[type="color"] {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 2px;
            background: transparent;
            cursor: pointer;
        }
        .admin-panel .prize-item .btn-delete {
            background: rgba(255,0,0,0.05);
            border: none;
            color: #FF4444;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .admin-panel .prize-item .btn-delete:hover {
            background: rgba(255,0,0,0.15);
        }
        .admin-panel .add-prize-form {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .admin-panel .add-prize-form input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,215,0,0.05);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 11px;
            min-width: 50px;
        }
        .admin-panel .add-prize-form input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .admin-panel .add-prize-form .btn-add {
            padding: 6px 18px;
            background: linear-gradient(135deg, #B8860B, #FFD700);
            border: none;
            border-radius: 8px;
            color: #0a0a0a;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-panel .add-prize-form .btn-add:hover { transform: scale(1.05); }
        .admin-panel .panel-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .admin-panel .panel-actions .btn-action {
            padding: 5px 14px;
            border: 1px solid rgba(255,215,0,0.05);
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            color: #FFD700;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-panel .panel-actions .btn-action:hover {
            background: rgba(255,215,0,0.05);
            border-color: #FFD700;
        }
        .admin-panel .panel-actions .btn-action.danger {
            color: #FF4444;
            border-color: rgba(255,0,0,0.05);
        }
        .admin-panel .panel-actions .btn-action.danger:hover {
            background: rgba(255,0,0,0.05);
            border-color: #FF4444;
        }

        /* ===== إشعار منبثق ===== */
        .notification {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            color: #0a0a0a;
            padding: 16px 32px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            z-index: 1000;
            box-shadow: 0 10px 60px rgba(255,215,0,0.2);
            animation: notifSlide 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: none;
            max-width: 90%;
            text-align: center;
        }
        .notification.show { display: block; }
        @keyframes notifSlide {
            0% { transform: translateX(-50%) translateY(-80px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        /* ===== خطأ ===== */
        .error-msg {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,0,0,0.05);
            border-radius: 14px;
            padding: 12px 16px;
            color: #FF6B6B;
            text-align: center;
            font-size: 14px;
            margin-top: 12px;
            display: none;
            width: 100%;
            max-width: 380px;
            z-index: 1;
            position: relative;
        }
        .error-msg.show { display: block; animation: fadeInUp 0.3s ease; }

        /* ===== تجاوب ===== */
        @media (max-width: 480px) {
            .cards-grid { gap: 10px; }
            .card { min-height: 120px; }
            .card .card-front .prize-icon { font-size: 32px; }
            .card .card-front .prize-name { font-size: 10px; }
            .card .card-back .back-design .icon-big { font-size: 30px; }
            .banner-text { font-size: 18px; padding: 10px 16px; }
            .btn { font-size: 16px; padding: 15px 20px; }
        }

        @media (max-width: 380px) {
            .cards-grid { gap: 8px; }
            .card { min-height: 100px; }
            .card .card-front .prize-icon { font-size: 26px; }
            .card .card-front .prize-name { font-size: 9px; }
        }

        @media (min-width: 600px) {
            .cards-grid { gap: 20px; }
            .card { min-height: 200px; }
            .card .card-front .prize-icon { font-size: 50px; }
            .card .card-front .prize-name { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- خلفية ثلاثية الأبعاد -->
    <div class="bg-3d" id="bg3d"></div>
    <div class="light-sweep"></div>

    <!-- إشعار -->

    <div class="sound-settings">

    <!-- لوحة الإدارة -->
    <div class="admin-panel" id="adminPanel">
        <div class="panel-title">
            ⚙️ الإدارة <span class="badge">ADMIN</span>
        </div>

        <div class="add-prize-form">
            <input type="text" id="newPrizeName" placeholder="الاسم">
            <input type="text" id="newPrizeIcon" placeholder="🎁" style="max-width:44px;">
            <input type="text" id="newPrizeDesc" placeholder="الوصف" style="flex:1.5;">
            <input type="color" id="newPrizeColor" value="#FFD700" style="max-width:34px;padding:2px;">
            <input type="color" id="newPrizeCardColor" value="#1a1a2e" style="max-width:34px;padding:2px;">

            <button class="btn-action" id="refreshPrizesBtn">🔄 تحديث</button>

        </div>

        <span id="errorText"></span>

    <script>
        // ================================================================
        //                      الإعدادات
        // ================================================================
        const API_BASE = 'https://joj-d0kl.onrender.com';
        const ADMIN_ID = 7011476249;
        let USER_ID = null;
        let prizesCache = [];
        let isPlaying = false;
        let selectedCardIndex = -1;
        let gameResult = null;
        let soundEnabled = true;
        let musicEnabled = true;

        // ================================================================
        //                      نظام الصوت المتقدم
        // ================================================================
        class ProSoundManager {
            constructor() {
                this.ctx = null;
                this.bgInterval = null;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) { console.warn('Audio not supported'); }
            }

            playFlip() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.ctx;
                    const now = ctx.currentTime;
                    // صوت تقليب عالي الجودة
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(900, now);
                    osc.frequency.exponentialRampToValueAtTime(500, now + 0.08);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
                    osc.type = 'square';
                    gain.gain.setValueAtTime(0.03, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    
                    // تأثير إضافي
                    setTimeout(() => {
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.frequency.setValueAtTime(600, now + 0.1);
                        osc2.frequency.exponentialRampToValueAtTime(400, now + 0.2);
                        osc2.type = 'sine';
                        gain2.gain.setValueAtTime(0.02, now + 0.1);
                        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc2.start(now + 0.1);
                        osc2.stop(now + 0.2);
                    }, 50);
                } catch (e) { console.warn('Sound error:', e); }
            }

            playWin() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.ctx;
                    const now = ctx.currentTime;
                    const melody = [
                        [523, 0.06, 0.05],
                        [659, 0.06, 0.05],
                        [784, 0.06, 0.05],
                        [1047, 0.1, 0.06],
                        [784, 0.06, 0.05],
                        [988, 0.06, 0.05],
                        [1175, 0.1, 0.06],
                        [1319, 0.15, 0.07],
                        [1568, 0.2, 0.08]
                    ];
                    melody.forEach(([freq, dur, vol], i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, now + i * 0.06);
                        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                        gain.gain.setValueAtTime(vol || 0.04, now + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + dur);
                        osc.start(now + i * 0.06);
                        osc.stop(now + i * 0.06 + dur);
                    });
                } catch (e) { console.warn('Sound error:', e); }
            }

            playLose() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.ctx;
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                    osc.type = 'sawtooth';
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    
                    setTimeout(() => {
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.frequency.setValueAtTime(300, now + 0.2);
                        osc2.frequency.exponentialRampToValueAtTime(80, now + 0.5);
                        osc2.type = 'square';
                        gain2.gain.setValueAtTime(0.02, now + 0.2);
                        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                        osc2.start(now + 0.2);
                        osc2.stop(now + 0.5);
                    }, 100);
                } catch (e) { console.warn('Sound error:', e); }
            }

            playBgMusic() {
                if (!musicEnabled || !this.initialized) return;
                if (this.bgInterval) return;
                try {
                    const ctx = this.ctx;
                    const playNote = (freq, time, dur, vol, type = 'sine') => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, time);
                        osc.type = type;
                        gain.gain.setValueAtTime(vol || 0.015, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
                        osc.start(time);
                        osc.stop(time + dur);
                    };
                    
                    const pattern = [
                        [262, 0.25, 0.01],
                        [330, 0.25, 0.01],
                        [392, 0.25, 0.01],
                        [523, 0.3, 0.015],
                        [330, 0.25, 0.01],
                        [392, 0.25, 0.01],
                        [523, 0.25, 0.01],
                        [659, 0.3, 0.015]
                    ];
                    pattern.forEach(([freq, dur, vol], i) => {
                        const time = ctx.currentTime + i * 0.3;
                        playNote(freq, time, dur, vol, i % 2 === 0 ? 'sine' : 'triangle');
                    });
                    
                    this.bgInterval = setInterval(() => {
                        if (!musicEnabled || !this.initialized) {
                            this.stopBgMusic();
                            return;
                        }
                        const t = ctx.currentTime;
                        const notes = [131, 165, 196, 262, 196, 165];
                        notes.forEach((freq, i) => {
                            playNote(freq, t + i * 0.15, 0.12, 0.008, 'square');
                        });
                    }, 1200);
                } catch (e) { console.warn('Music error:', e); }
            }

            stopBgMusic() {
                if (this.bgInterval) {
                    clearInterval(this.bgInterval);
                    this.bgInterval = null;
                }
            }

            stopAll() {
                this.stopBgMusic();
                if (this.ctx) {
                    try { this.ctx.close(); this.ctx = new(window.AudioContext || window.webkitAudioContext)(); } 
                    catch (e) {}
                }
            }
        }

        const sound = new ProSoundManager();

        // ================================================================
        //                      الخلفية ثلاثية الأبعاد
        // ================================================================
        function createBgParticles() {
            const container = document.getElementById('bg3d');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = 2 + Math.random() * 6;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 20) + 's';
                container.appendChild(p);
            }
        }

        // ================================================================
        //                      جلب USER_ID
        // ================================================================
        function getUserId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('user_id') || params.get('userId') || params.get('id');
            if (id && !isNaN(id)) {
                USER_ID = parseInt(id);
                localStorage.setItem('flip_user_id', USER_ID);
                return USER_ID;
            }
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const user = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (user && user.id) {
                        USER_ID = user.id;
                        localStorage.setItem('flip_user_id', USER_ID);
                        return USER_ID;
                    }
                }
            } catch (e) {}
            id = localStorage.getItem('flip_user_id');
            if (id) { USER_ID = parseInt(id); return USER_ID; }
            return null;
        }

        // ================================================================
        //                      إنشاء البطاقات
        // ================================================================
        function createCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 6; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                
                const randomPrize = prizesCache.length > 0 ? 
                    prizesCache[Math.floor(Math.random() * prizesCache.length)] : 
                    { icon: '🎁', name: 'جائزة', description: '', card_color: '#1a1a2e', card_back_color: '#16213e' };
                
                card.innerHTML = `
                    <div class="card-face card-back">
                        <div class="back-design">
                            <div class="pattern"></div>
                            <div class="icon-big">🃏</div>
                            <div class="card-number">#${String(i + 1).padStart(2, '0')}</div>
                        </div>
                        <div class="glow-ring"></div>
                    </div>
                    <div class="card-face card-front" style="background: linear-gradient(145deg, ${randomPrize.card_color || '#1a1a2e'}, ${randomPrize.card_back_color || '#16213e'});">
                        <div class="prize-icon">${randomPrize.icon || '🎁'}</div>
                        <div class="prize-name">${randomPrize.name || 'جائزة'}</div>
                        <div class="prize-desc">${randomPrize.description || ''}</div>
                        <div class="shine-effect"></div>
                        <div class="sparkle-container"></div>
                    </div>
                `;
                
                card.addEventListener('click', () => handleCardClick(i));
                grid.appendChild(card);
            }
        }

        // ================================================================
        //                      اختيار البطاقة
        // ================================================================
        async function handleCardClick(index) {
            if (isPlaying) return;
            if (document.getElementById('playBtn').disabled) return;
            if (selectedCardIndex !== -1) return;
            
            selectedCardIndex = index;
            isPlaying = true;
            
            const btn = document.getElementById('playBtn');
            btn.disabled = true;
            btn.classList.add('loading');
            document.getElementById('playBtnText').textContent = 'جاري اللعب...';
            
            sound.init();
            sound.playBgMusic();
            
            try {
                const response = await fetch(`${API_BASE}/api/flip/play`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: USER_ID })
                });
                
                const data = await response.json();
                btn.classList.remove('loading');
                
                if (data.success) {
                    const prize = data.game.prize;
                    const winningIndex = data.game.card_index;
                    gameResult = { prize, isWin: !prize.name.includes('حظ سعيد') };
                    
                    await revealCards(winningIndex, prize);
                    showResult(prize, gameResult.isWin);
                    
                    if (gameResult.isWin) {
                        sound.playWin();
                        showNotification(`🎉 مبروك! ${prize.description || prize.name}!`);
                    } else {
                        sound.playLose();
                    }
                } else {
                    showError(data.error || 'حدث خطأ');
                    if (data.remaining_hours !== undefined) {
                        const btn2 = document.getElementById('playBtn');
                        btn2.disabled = true;
                        document.getElementById('playBtnText').textContent = `⏳ ${data.remaining_hours}h ${data.remaining_minutes}m`;
                        sound.stopAll();
                    }
                    selectedCardIndex = -1;
                    isPlaying = false;
                }
            } catch (e) {
                btn.classList.remove('loading');
                showError('خطأ في الاتصال: ' + e.message);
                sound.stopAll();
                selectedCardIndex = -1;
                isPlaying = false;
            }
            
            if (!document.getElementById('playBtn').disabled && !isPlaying) {
                document.getElementById('playBtnText').textContent = '🎯 اختر بطاقة';
            }
        }

        // ================================================================
        //                      كشف البطاقات
        // ================================================================
        async function revealCards(winningIndex, prize) {
            const cards = document.querySelectorAll('.card');
            
            // 1. تحديث البطاقة الفائزة
            const winnerCard = cards[winningIndex];
            if (winnerCard) {
                const front = winnerCard.querySelector('.card-front');
                front.style.background = `linear-gradient(145deg, ${prize.color || '#FFD700'}, ${prize.card_color || '#1a1a2e'})`;
                front.querySelector('.prize-icon').textContent = prize.icon || '🎁';
                front.querySelector('.prize-name').textContent = prize.name || 'جائزة';
                front.querySelector('.prize-desc').textContent = prize.description || '';
                
                // إضافة تأثيرات متلألئة
                const sparkles = winnerCard.querySelector('.sparkle-container');
                for (let i = 0; i < 12; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.left = Math.random() * 100 + '%';
                    sparkle.style.top = Math.random() * 100 + '%';
                    sparkle.style.animationDelay = Math.random() * 1 + 's';
                    sparkle.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
                    sparkle.style.width = (2 + Math.random() * 4) + 'px';
                    sparkle.style.height = sparkle.style.width;
                    sparkles.appendChild(sparkle);
                }
            }
            
            // 2. كشف البطاقة الفائزة أولاً
            await new Promise(resolve => {
                setTimeout(() => {
                    if (winnerCard) {
                        winnerCard.classList.add('flipped');
                        winnerCard.classList.add('winner');
                        sound.playFlip();
                    }
                    resolve();
                }, 400);
            });
            
            // 3. كشف البطاقات الأخرى مع تأخير متدرج
            const otherCards = Array.from(cards).filter((_, i) => i !== winningIndex);
            for (let i = 0; i < otherCards.length; i++) {
                const card = otherCards[i];
                const delay = 250 + (i * 120);
                
                await new Promise(resolve => {
                    setTimeout(() => {
                        const randomPrize = prizesCache.length > 0 ? 
                            prizesCache[Math.floor(Math.random() * prizesCache.length)] : 
                            { icon: '🎁', name: 'جائزة', card_color: '#1a1a2e', card_back_color: '#16213e' };
                        
                        const front = card.querySelector('.card-front');
                        front.style.background = `linear-gradient(145deg, ${randomPrize.card_color || '#1a1a2e'}, ${randomPrize.card_back_color || '#16213e'})`;
                        front.querySelector('.prize-icon').textContent = randomPrize.icon || '🎁';
                        front.querySelector('.prize-name').textContent = randomPrize.name || 'جائزة';
                        front.querySelector('.prize-desc').textContent = randomPrize.description || '';
                        
                        card.classList.add('flipped');
                        card.classList.add('disabled');
                        card.classList.add('loser');
                        sound.playFlip();
                        resolve();
                    }, delay);
                });
            }
            
            // 4. انتظار انتهاء التأثيرات
            await new Promise(resolve => setTimeout(resolve, 600));
        }

        // ================================================================
        //                      عرض النتيجة
        // ================================================================
        function showResult(prize, isWin) {
            const box = document.getElementById('resultBox');
            document.getElementById('resultIcon').textContent = prize.icon || '🎁';
            document.getElementById('resultTitle').textContent = prize.name || 'جائزة!';
            document.getElementById('resultDesc').textContent = prize.description || '';
            
            box.classList.add('show');
            if (isWin) {
                box.classList.add('winner');
            } else {
                box.classList.remove('winner');
            }
            
            loadUserStatus();
        }

        // ================================================================
        //                      تحميل البيانات
        // ================================================================
        async function loadPrizes() {
            try {
                const res = await fetch(`${API_BASE}/api/prizes`);
                const data = await res.json();
                if (data.success && data.prizes) {
                    prizesCache = data.prizes;
                    return data.prizes;
                }
                return [];
            } catch (e) { console.error('Error loading prizes:', e); return []; }
        }

        async function loadSettings() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/settings?admin_id=${ADMIN_ID}`);
                const data = await res.json();
                if (data.success) {
                    if (data.settings.banner_text) {
                        document.getElementById('bannerText').innerHTML = `<span class="glow">${data.settings.banner_text}</span>`;
                    }
                    return data.settings;
                }
                return {};
            } catch (e) { console.error('Error loading settings:', e); return {}; }
        }

        async function loadUserStatus() {
            if (!USER_ID) return;
            try {
                const res = await fetch(`${API_BASE}/api/flip/history/${USER_ID}`);
                const data = await res.json();
                if (data.success) {
                    const btn = document.getElementById('playBtn');
                    const canPlay = data.play_status?.can_play !== false &&
                        (!data.deposit_requirement?.required || data.deposit_requirement?.is_met);
                    
                    if (canPlay && prizesCache.length > 0 && selectedCardIndex === -1) {
                        btn.disabled = false;
                        document.getElementById('playBtnText').textContent = '🎯 اختر بطاقة';
                    } else if (selectedCardIndex !== -1) {
                        btn.disabled = true;
                        document.getElementById('playBtnText').textContent = '✅ تم الاختيار';
                    } else if (!data.play_status?.can_play) {
                        btn.disabled = true;
                        const h = data.play_status?.remaining_hours || 0;
                        const m = data.play_status?.remaining_minutes || 0;
                        document.getElementById('playBtnText').textContent = `⏳ ${h}h ${m}m`;
                        sound.stopAll();
                    } else {
                        btn.disabled = true;
                        document.getElementById('playBtnText').textContent = '⏳ جاري التحميل...';
                    }
                }
            } catch (e) { console.error('Error loading user status:', e); }
        }

        // ================================================================
        //                      لوحة الإدارة
        // ================================================================
        async function renderAdminPanel() {
            const panel = document.getElementById('adminPanel');
            const list = document.getElementById('prizesList');
            
            if (USER_ID !== ADMIN_ID) { panel.classList.remove('show'); return; }
            panel.classList.add('show');
            
            try {
                const res = await fetch(`${API_BASE}/api/admin/prizes?admin_id=${ADMIN_ID}`);
                const data = await res.json();
                
                if (!data.success || !data.prizes || data.prizes.length === 0) {
                    list.innerHTML = `<div style="color:#555;text-align:center;padding:20px;">📭 لا توجد جوائز</div>`;
                    return;
                }
                
                list.innerHTML = data.prizes.map(p => `
                    <div class="prize-item" data-id="${p.id}">
                        <div class="prize-icon-small">${p.icon || '🎁'}</div>
                        <div class="prize-info">
                            <input type="text" class="name-input" value="${p.name}" placeholder="الاسم">
                        </div>
                        <div class="prize-colors">
                            <input type="color" class="color-input" value="${p.color || '#FFD700'}" data-field="color" data-id="${p.id}">
                            <input type="color" class="color-input" value="${p.card_color || '#1a1a2e'}" data-field="card_color" data-id="${p.id}">
                            <input type="color" class="color-input" value="${p.card_back_color || '#16213e'}" data-field="card_back_color" data-id="${p.id}">
                        </div>
                        <button class="btn-delete" data-id="${p.id}">✕</button>
                    </div>
                `).join('');
                
                list.querySelectorAll('.name-input').forEach(input => {
                    input.addEventListener('change', async function() {
                        const id = parseInt(this.closest('.prize-item').dataset.id);
                        const value = this.value.trim();
                        if (!value) { showError('⚠️ الاسم مطلوب'); return; }
                        const success = await updatePrize(id, { name: value });
                        if (success) { await refreshAll(); showNotification('✅ تم التحديث'); }
                    });
                });
                
                list.querySelectorAll('.color-input').forEach(input => {
                    input.addEventListener('change', async function() {
                        const id = parseInt(this.dataset.id);
                        const field = this.dataset.field;
                        const success = await updatePrize(id, { [field]: this.value });
                        if (success) { await refreshAll(); showNotification('✅ تم تحديث اللون'); }
                    });
                });
                
                list.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = parseInt(this.dataset.id);
                        if (confirm('⚠️ هل أنت متأكد من الحذف؟')) {
                            const success = await deletePrize(id);
                            if (success) { await refreshAll(); showNotification('✅ تم الحذف'); }
                        }
                    });
                });
            } catch (e) { console.error('Error rendering admin:', e); }
        }

        async function updatePrize(id, data) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/prizes/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID, ...data })
                });
                const result = await res.json();
                return result.success === true;
            } catch (e) { console.error('Error updating prize:', e); return false; }
        }

        async function deletePrize(id) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/prizes/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID })
                });
                const data = await res.json();
                return data.success === true;
            } catch (e) { console.error('Error deleting prize:', e); return false; }
        }

        async function addPrize(name, icon, description, color, card_color) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/prizes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        admin_id: ADMIN_ID,
                        name, icon: icon || '🎁', description: description || '',
                        color: color || '#FFD700',
                        card_color: card_color || '#1a1a2e',
                        card_back_color: '#16213e'
                    })
                });
                const data = await res.json();
                return data.success === true;
            } catch (e) { console.error('Error adding prize:', e); return false; }
        }

        async function resetPrizes() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/seed-prizes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID })
                });
                const data = await res.json();
                return data.success;
            } catch (e) { console.error('Error resetting prizes:', e); return false; }
        }

        // ================================================================
        //                      دوال مساعدة
        // ================================================================
        function showNotification(msg) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            document.getElementById('errorText').textContent = '❌ ' + msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function updateLoader(progress) {
            document.getElementById('loaderProgress').style.width = Math.min(progress, 100) + '%';
        }

        function showLoading(show) {
            const screen = document.getElementById('loadingScreen');
            if (show) {
                screen.classList.add('active');
                document.getElementById('cardsContainer').classList.remove('show');
            } else {
                screen.classList.remove('active');
                document.getElementById('cardsContainer').classList.add('show');
            }
        }

        async function refreshAll() {
            await loadSettings();
            await loadPrizes();
            if (prizesCache.length > 0) {
                createCards();
                document.getElementById('cardsContainer').classList.add('show');
            }
            await loadUserStatus();
            await renderAdminPanel();
        }

        // ================================================================
        //                      أحداث الإدارة
        // ================================================================
        document.getElementById('addPrizeBtn').addEventListener('click', async function() {
            const name = document.getElementById('newPrizeName').value.trim();
            const icon = document.getElementById('newPrizeIcon').value.trim() || '🎁';
            const desc = document.getElementById('newPrizeDesc').value.trim() || '';
            const color = document.getElementById('newPrizeColor').value || '#FFD700';
            const cardColor = document.getElementById('newPrizeCardColor').value || '#1a1a2e';
            
            if (!name) { showError('⚠️ الرجاء إدخال اسم الجائزة'); return; }
            
            this.disabled = true;
            this.textContent = '⏳';
            const success = await addPrize(name, icon, desc, color, cardColor);
            if (success) {
                document.getElementById('newPrizeName').value = '';
                document.getElementById('newPrizeIcon').value = '';
                document.getElementById('newPrizeDesc').value = '';
                await refreshAll();
                showNotification(`✅ تم إضافة "${name}"`);
            } else {
                showError('❌ فشل إضافة الجائزة');
            }
            this.disabled = false;
            this.textContent = '➕';
        });

        document.getElementById('refreshPrizesBtn').addEventListener('click', async () => {
            await refreshAll();
            showNotification('🔄 تم التحديث');
        });

        document.getElementById('resetPrizesBtn').addEventListener('click', async () => {
            if (confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع الجوائز؟')) {
                const success = await resetPrizes();
                if (success) { await refreshAll(); showNotification('✅ تم إعادة التعيين'); } 
                else { showError('❌ فشل إعادة التعيين'); }
            }
        });

        document.getElementById('soundToggle').addEventListener('change', function() {
            soundEnabled = this.checked;
            if (!soundEnabled) sound.stopAll();
            else { sound.init(); sound.playBgMusic(); }
        });

        document.getElementById('musicToggle').addEventListener('change', function() {
            musicEnabled = this.checked;
            if (!musicEnabled) sound.stopBgMusic();
            else { sound.init(); sound.playBgMusic(); }
        });

        // ================================================================
        //                      التهيئة
        // ================================================================
        async function init() {
            createBgParticles();
            
            USER_ID = getUserId();
            if (!USER_ID) {
                document.getElementById('errorContainer').classList.add('show');
                return;
            }
            
            showLoading(true);
            
            try {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 15;
                    if (progress > 85) progress = 85;
                    updateLoader(progress);
                }, 150);
                
                await loadSettings();
                updateLoader(30);
                await new Promise(r => setTimeout(r, 200));
                
                await loadPrizes();
                updateLoader(50);
                await new Promise(r => setTimeout(r, 200));
                
                if (prizesCache.length > 0) {
                    createCards();
                    document.getElementById('cardsContainer').classList.add('show');
                }
                updateLoader(70);
                await new Promise(r => setTimeout(r, 200));
                
                await loadUserStatus();
                updateLoader(85);
                await new Promise(r => setTimeout(r, 200));
                
                await renderAdminPanel();
                updateLoader(95);
                await new Promise(r => setTimeout(r, 200));
                
                clearInterval(interval);
                updateLoader(100);
                await new Promise(r => setTimeout(r, 400));
                
                sound.init();
                sound.playBgMusic();
                
            } catch (e) {
                console.error('Init error:', e);
                showError('⚠️ فشل تحميل البيانات: ' + e.message);
            }
            
            showLoading(false);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
