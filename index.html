<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FOOTBALL LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

    <div id="initialSplashLoader" class="fixed inset-0 bg-gray-950 z-[9999] flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-t-green-500 border-r-transparent border-b-gray-800 border-l-transparent mb-4"></div>
        <p id="loaderStatusText" class="text-gray-400 text-sm animate-pulse">جاري ربط واستيقاظ السيرفر المباشر على ريندر...</p>
    </div>

    <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-green-500 tracking-wider">AI FOOTBALL SYSTEM</h1>
            <span id="serverStatusBadge" class="text-xs bg-gray-800 px-3 py-1.5 rounded-full text-amber-400 font-mono">جاري الفحص...</span>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-5xl">
        
        <div class="text-center mb-10">
            <button onclick="fetchTodayMatches()" class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-500 hover:to-green-600 px-8 py-4 rounded-2xl font-bold text-lg shadow-xl transition-all transform hover:-translate-y-1">
                <i class="fa-solid fa-sync-alt ml-2 animate-spin"></i> جلب وعرض جدول مباريات اليوم الكاملة (13 يونيو 2026)
            </button>
        </div>

        <section id="outputArea" class="space-y-6">
            <div class="text-center py-16 text-gray-600 border-2 border-dashed border-gray-800 rounded-3xl">
                <p class="text-base">الواجهة خالية تماماً من البيانات الافتراضية، اضغط الزر بالأعلى لسحب البيانات الحية مباشرة.</p>
            </div>
        </section>

    </main>

    <script>
        const BASE_URL = "https://joj-d0kl.onrender.com";
        
        async function checkSystemHealth() {
            try {
                const response = await fetch(`${BASE_URL}/api/health`);
                const data = await response.json();
                if (data.status === "healthy" || data.status === "missing_key") {
                    document.getElementById('initialSplashLoader').style.display = 'none';
                    document.getElementById('serverStatusBadge').innerText = "متصل بالخادم";
                    document.getElementById('serverStatusBadge').className = "text-green-400 font-bold text-xs bg-gray-800 px-3 py-1.5 rounded-full";
                }
            } catch (err) {
                setTimeout(checkSystemHealth, 3000);
            }
        }
        window.addEventListener('DOMContentLoaded', checkSystemHealth);

        // 1. طلب مباريات اليوم من السيرفر
        async function fetchTodayMatches() {
            showLoading();
            try {
                const response = await fetch(`${BASE_URL}/api/football`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "today_matches" })
                });
                const result = await response.json();
                
                if (result.type === "parsed") {
                    renderMatchesList(result.data.matches);
                } else {
                    renderRaw(result);
                }
            } catch (err) {
                renderError(err.message);
            }
        }

        // بناء قائمة مباريات اليوم الحقيقية بدون أي عنصر وهمي ثابت
        function renderMatchesList(matches) {
            const container = document.getElementById('outputArea');
            if(!matches || matches.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-10">لم يتم رصد أي مباريات حقيقية مجدولة اليوم في الملاعب العالمية.</div>`;
                return;
            }

            let html = `<div class="grid grid-cols-1 gap-4">`;
            matches.forEach(match => {
                let statusColor = match.status === 'ارية' || match.status.includes('جارية') ? 'text-red-500 animate-pulse' : 'text-gray-400';
                html += `
                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="text-right">
                            <span class="text-xs bg-gray-950 px-2 py-1 rounded text-green-400 block w-max mb-1">🏆 ${match.tournament}</span>
                            <span class="text-xs ${statusColor}">الحالة: ${match.status} | ⏰ التوقيت: ${match.time}</span>
                        </div>
                        
                        <div class="flex items-center gap-4 font-bold text-lg my-2 md:my-0">
                            <span>${match.homeTeam}</span>
                            <span class="bg-gray-950 px-3 py-1.5 rounded-xl text-yellow-400 font-mono">${match.score.home} - ${match.score.away}</span>
                            <span>${match.awayTeam}</span>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="fetchMatchStats('${match.homeTeam}', '${match.awayTeam}', '${match.status}', '${match.tournament}')" class="bg-blue-600 hover:bg-blue-500 text-xs font-bold px-4 py-2.5 rounded-xl transition-colors">
                                <i class="fa-solid fa-chart-bar ml-1"></i> الإحصائيات والأحداث
                            </button>
                            <button onclick="fetchComparison('${match.homeTeam}', '${match.awayTeam}')" class="bg-purple-600 hover:bg-purple-500 text-xs font-bold px-4 py-2.5 rounded-xl transition-colors">
                                <i class="fa-solid fa-shuffle ml-1"></i> مقارنة الفريقين
                            </button>
                        </div>
                    </div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // 2. طلب أحداث وإحصائيات المباراة الحية أو السابقة ديناميكياً
        async function fetchMatchStats(home, away, status, tournament) {
            showLoading();
            try {
                const response = await fetch(`${BASE_URL}/api/football`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "match_stats", homeTeam: home, awayTeam: away, matchStatus: status, tournament: tournament })
                });
                const result = await response.json();
                
                if (result.type === "parsed") {
                    let d = result.data;
                    let eventsHtml = d.events.map(e => `<li class="bg-gray-950 p-2.5 rounded-lg border-r-4 border-blue-500 text-xs text-gray-300">${e}</li>`).join('');
                    document.getElementById('outputArea').innerHTML = `
                        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-2xl mx-auto shadow-2xl">
                            <button onclick="fetchTodayMatches()" class="text-xs text-gray-400 hover:text-white mb-4 block"><i class="fa-solid fa-arrow-right ml-1"></i> العودة لجدول المباريات</button>
                            <h3 class="text-lg font-black text-blue-400 mb-2 text-center">${home} ضد ${away}</h3>
                            <p class="text-center text-xs text-gray-500 mb-6">تقرير حالة الملعب: <span class="text-yellow-400 font-bold">${d.status}</span></p>
                            
                            <div class="space-y-3 mb-6">
                                <div class="text-xs text-gray-400 flex justify-between"><span>الاستحواذ:</span> <span>${d.possession.home}% - ${d.possession.away}%</span></div>
                                <div class="w-full bg-gray-950 h-2 rounded-full overflow-hidden flex">
                                    <div class="bg-blue-500" style="width: ${d.possession.home}%"></div>
                                    <div class="bg-gray-700" style="width: ${d.possession.away}%"></div>
                                </div>
                                <div class="text-xs text-gray-400 flex justify-between pt-2"><span>التسديدات:</span> <span>${d.shots.home} - ${d.shots.away}</span></div>
                            </div>

                            <h4 class="text-sm font-bold text-gray-200 border-b border-gray-800 pb-2 mb-3"><i class="fa-solid fa-bolt ml-1 text-yellow-500"></i> شريط الأحداث والسيناريو الفعلي:</h4>
                            <ul class="space-y-2">${eventsHtml || '<p class="text-xs text-gray-500">لا توجد أحداث مسجلة حالياً لهذه الحالة.</p>'}</ul>
                        </div>`;
                } else {
                    renderRaw(result);
                }
            } catch (err) {
                renderError(err.message);
            }
        }

        // 3. طلب مقارنة حقيقية بين الفريقين
        async function fetchComparison(home, away) {
            showLoading();
            try {
                const response = await fetch(`${BASE_URL}/api/football`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "compare_teams", homeTeam: home, awayTeam: away })
                });
                const result = await response.json();
                
                if (result.type === "parsed") {
                    let d = result.data;
                    document.getElementById('outputArea').innerHTML = `
                        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-2xl mx-auto shadow-2xl">
                            <button onclick="fetchTodayMatches()" class="text-xs text-gray-400 hover:text-white mb-4 block"><i class="fa-solid fa-arrow-right ml-1"></i> العودة لجدول المباريات</button>
                            <h3 class="text-lg font-black text-purple-400 mb-6 text-center"><i class="fa-solid fa-balance-scale ml-2"></i>تحليل مواجهة: ${d.teamA} vs ${d.teamB}</h3>
                            
                            <div class="space-y-4 mb-6">
                                <div class="bg-gray-950 p-4 rounded-xl border border-gray-800">
                                    <h4 class="text-xs font-bold text-green-400 mb-1">📈 وضع وجاهزية ${d.teamA}:</h4>
                                    <p class="text-xs text-gray-300 leading-relaxed">${d.analysisA}</p>
                                </div>
                                <div class="bg-gray-950 p-4 rounded-xl border border-gray-800">
                                    <h4 class="text-xs font-bold text-blue-400 mb-1">📈 وضع وجاهزية ${d.teamB}:</h4>
                                    <p class="text-xs text-gray-300 leading-relaxed">${d.analysisB}</p>
                                </div>
                            </div>

                            <div class="bg-purple-950/30 border border-purple-900/40 p-4 rounded-xl text-center">
                                <h4 class="text-xs font-bold text-purple-300 mb-1">⚔️ تاريخ المواجهات والمؤشرات الحقيقية:</h4>
                                <p class="text-xs text-gray-300 leading-relaxed">${d.headToHead}</p>
                            </div>
                        </div>`;
                } else {
                    renderRaw(result);
                }
            } catch (err) {
                renderError(err.message);
            }
        }

        function showLoading() {
            document.getElementById('outputArea').innerHTML = `
                <div class="flex flex-col items-center justify-center py-16">
                    <div class="animate-spin rounded-full h-8 w-8 border-2 border-t-transparent border-green-500 mb-2"></div>
                    <p class="text-xs text-gray-500 animate-pulse">جاري سحب ومعالجة البيانات الواقعية من خادم الذكاء الاصطناعي الحالي...</p>
                </div>`;
        }

        function renderRaw(result) {
            document.getElementById('outputArea').innerHTML = `
                <div class="bg-amber-950/20 border border-amber-500/30 rounded-2xl p-5 max-w-2xl mx-auto">
                    <p class="text-xs text-amber-400 font-bold mb-2"><i class="fa-solid fa-bug ml-1"></i> لم يتمكن النظام من صب الـ JSON بالتنسيق القياسي، إليك الرد الخام المعبر عن الحقيقة:</p>
                    <pre class="bg-gray-950 p-4 rounded-xl border border-gray-800 text-xs text-left overflow-x-auto text-yellow-100 font-mono whitespace-pre-wrap">${result.rawText}</pre>
                </div>`;
        }

        function renderError(msg) {
            document.getElementById('outputArea').innerHTML = `
                <div class="bg-red-950/20 border border-red-500/30 rounded-xl p-4 text-center text-red-400 text-xs max-w-sm mx-auto">
                    <i class="fa-solid fa-exclamation-circle mb-1"></i> الاتصال تعذر، تأكد من تحديث الكود وبناء الخادم على ريندر بنجاح.
                </div>`;
        }
    </script>
</body>
</html>
