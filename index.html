<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎡 عجلة الحظ</title>
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js">
    </script>
    <style>
        /* ===== إعادة ضبط ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow-x: hidden;
            padding: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* خلفية ثابتة */
        .bg-image-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-image-fixed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: slowZoom 30s ease-in-out infinite alternate;
        }
        @keyframes slowZoom {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.05);
            }
        }

        /* ===== النص العلوي ===== */
        .banner-text {
            text-align: center;
            padding: 10px 12px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 520px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            font-size: 20px;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 0.5px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 1;
        }

        /* ===== حالة المستخدم (مخفية) ===== */
        .user-status {
            display: none;
        }

        /* ===== العجلة ===== */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            aspect-ratio: 1/1;
            display: none;
            z-index: 1;
        }
        .wheel-wrapper.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        /* ===== العجلة الرئيسية ===== */
        #wheelCanvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.03), inset 0 0 60px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.05);
            transition: filter 0.4s ease;
            display: block;
            position: relative;
            z-index: 3;
        }
        #wheelCanvas.spinning {
            filter: brightness(1.15) drop-shadow(0 0 50px rgba(255, 215, 0, 0.12));
        }

        /* ===== طبقة النيون ===== */
        .neon-layer {
            position: absolute;
            top: -10px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
            overflow: visible;
        }
        .neon-layer canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ===== طبقة الأمواج النيونية ===== */
        .wave-layer {
            position: absolute;
            top: -30px;
            left: -30px;
            width: calc(100% + 60px);
            height: calc(100% + 60px);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            overflow: visible;
        }
        .wave-layer canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 32px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.25));
            animation: pointerBounce 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pointerBounce {
            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-5px);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.94);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ===== لا توجد جوائز ===== */
        .no-prizes {
            display: none;
            text-align: center;
            padding: 30px 16px;
            color: #555;
            font-size: 15px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 16px;
            backdrop-filter: blur(6px);
            max-width: 420px;
            margin: 0 auto;
            z-index: 1;
        }

        /* ===== الأزرار ===== */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .btn {
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
        }
        .btn-spin {
            background: linear-gradient(135deg, #B8860B, #FFD700);
            color: #0a0a0a;
            box-shadow: 0 4px 30px rgba(255, 215, 0, 0.1);
            font-size: 19px;
        }
        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(255, 215, 0, 0.2);
        }
        .btn-spin:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .btn-spin .spinner-small {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(10, 10, 10, 0.15);
            border-top: 2px solid #0a0a0a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        .btn-spin.loading .spinner-small {
            display: inline-block;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== شرط الإيداع ===== */
        .deposit-notice {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .deposit-notice.show {
            display: block;
        }
        .deposit-notice .notice-text {
            color: #FF8C00;
            font-size: 14px;
        }
        .deposit-notice .notice-text .amount {
            color: #FFD700;
            font-weight: 700;
        }
        .deposit-notice .notice-status {
            font-size: 13px;
            margin-top: 4px;
            color: #666;
        }
        .deposit-notice .notice-status .met {
            color: #00FF88;
        }
        .deposit-notice .notice-status .not-met {
            color: #FF4444;
        }

        /* ===== النتيجة ===== */
        .result-box {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 18px;
            padding: 18px 14px;
            margin-top: 14px;
            text-align: center;
            display: none;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
        }
        .result-box.show {
            display: block;
            animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes resultPop {
            0% {
                transform: scale(0.85) rotate(-2deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        .result-box.winner {
            border-color: rgba(255, 215, 0, 0.25);
            background: rgba(255, 215, 0, 0.08);
            animation: winGlow 1.5s ease-in-out infinite alternate;
        }
        @keyframes winGlow {
            0% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.04);
            }
            100% {
                box-shadow: 0 0 80px rgba(255, 215, 0, 0.12);
            }
        }
        .result-box .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .result-box .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            opacity: 0;
            animation: confettiFall 2.2s ease-in forwards;
        }
        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-20px) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(220px) rotate(720deg) scale(0);
            }
        }

        .result-box .prize-icon {
            display: none;
        }
        .result-box .prize-name {
            display: none;
        }
        .result-box .prize-desc {
            color: #FFD700;
            font-size: 24px;
            font-weight: 700;
            margin-top: 4px;
            padding: 6px 0;
        }
        .result-box.winner .prize-desc {
            background: linear-gradient(135deg, #FFD700, #FF6B00, #FFD700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 1.5s ease-in-out infinite;
            font-size: 28px;
        }
        @keyframes goldShine {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* ===== رسائل الخطأ ===== */
        .error-msg {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 0, 0, 0.06);
            border-radius: 12px;
            padding: 10px;
            color: #FF6B6B;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .error-msg.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* ===== شاشة اللودينغ ===== */
        .loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #0a0a0a;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .loading-screen.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        .loading-screen .loading-image {
            width: 70vw;
            max-width: 280px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 215, 0, 0.08);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.04);
            animation: loadingPulse 2s ease-in-out infinite;
            margin-bottom: 28px;
        }
        @keyframes loadingPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.02);
                opacity: 0.85;
            }
        }
        .loading-screen .progress-container {
            width: 60%;
            max-width: 220px;
            position: relative;
        }
        .loading-screen .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            overflow: hidden;
        }
        .loading-screen .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .loading-screen .progress-text {
            color: #888;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* ===== إعدادات الصوت ===== */
        .sound-settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            padding: 6px 16px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .sound-settings label {
            color: #666;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .sound-settings input[type="checkbox"] {
            accent-color: #FFD700;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .sound-settings .sound-indicator {
            color: #FFD700;
            font-size: 14px;
        }

        /* ===== لوحة الإدارة ===== */
        .admin-panel {
            display: none;
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.07);
            border-radius: 20px;
            padding: 16px;
            margin-top: 14px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .admin-panel.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        .admin-panel .panel-title {
            color: #FFD700;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-panel .panel-title .badge {
            background: #FFD700;
            color: #0a0a0a;
            font-size: 9px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 700;
        }
        .admin-panel .prize-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .admin-panel .prize-item .prize-icon-small {
            font-size: 22px;
            width: 34px;
            text-align: center;
        }
        .admin-panel .prize-item .prize-info {
            flex: 1;
            min-width: 90px;
        }
        .admin-panel .prize-item .prize-info .name-input {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 6px;
            width: 100%;
            transition: border-color 0.3s;
        }
        .admin-panel .prize-item .prize-info .name-input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .admin-panel .prize-item .prize-info .desc-input {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            color: #666;
            font-size: 10px;
            padding: 2px 6px;
            width: 100%;
            margin-top: 2px;
        }
        .admin-panel .prize-item .prize-info .desc-input:focus {
            outline: none;
            border-color: rgba(255, 215, 0, 0.3);
        }
        .admin-panel .prize-item .prize-prob {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .admin-panel .prize-item .prize-prob .prob-input {
            width: 44px;
            padding: 3px 4px;
            border-radius: 4px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #FFD700;
            font-size: 11px;
            text-align: center;
        }
        .admin-panel .prize-item .prize-prob .prob-input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .admin-panel .prize-item .prize-prob .prob-label {
            color: #555;
            font-size: 9px;
        }
        .admin-panel .prize-item .prize-prob .btn-save-prob {
            padding: 2px 8px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 4px;
            color: #FFD700;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-panel .prize-item .prize-prob .btn-save-prob:hover {
            background: rgba(255, 215, 0, 0.2);
        }
        .admin-panel .prize-item .prize-colors {
            display: flex;
            gap: 3px;
        }
        .admin-panel .prize-item .prize-colors input[type="color"] {
            width: 26px;
            height: 26px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 2px;
            background: transparent;
            cursor: pointer;
        }
        .admin-panel .prize-item .prize-colors input[type="color"]:hover {
            border-color: #FFD700;
        }
        .admin-panel .prize-item .btn-delete {
            background: rgba(255, 0, 0, 0.08);
            border: none;
            color: #FF4444;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .admin-panel .prize-item .btn-delete:hover {
            background: rgba(255, 0, 0, 0.2);
            transform: scale(1.05);
        }
        .admin-panel .add-prize-form {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .admin-panel .add-prize-form input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 11px;
            min-width: 50px;
        }
        .admin-panel .add-prize-form input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .admin-panel .add-prize-form input::placeholder {
            color: #555;
        }
        .admin-panel .add-prize-form .btn-add {
            padding: 6px 16px;
            background: linear-gradient(135deg, #B8860B, #FFD700);
            border: none;
            border-radius: 6px;
            color: #0a0a0a;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-panel .add-prize-form .btn-add:hover {
            transform: scale(1.05);
        }
        .admin-panel .add-prize-form .btn-add:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .admin-panel .panel-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .admin-panel .panel-actions .btn-action {
            padding: 5px 14px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            color: #FFD700;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-panel .panel-actions .btn-action:hover {
            background: rgba(255, 215, 0, 0.05);
            border-color: #FFD700;
        }
        .admin-panel .panel-actions .btn-action.danger {
            color: #FF4444;
            border-color: rgba(255, 0, 0, 0.1);
        }
        .admin-panel .panel-actions .btn-action.danger:hover {
            background: rgba(255, 0, 0, 0.05);
            border-color: #FF4444;
        }
        .admin-panel .settings-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .admin-panel .settings-section .setting-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .admin-panel .settings-section .setting-row label {
            color: #888;
            font-size: 11px;
            min-width: 70px;
        }
        .admin-panel .settings-section .setting-row input,
        .admin-panel .settings-section .setting-row textarea {
            flex: 1;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 11px;
            min-width: 60px;
        }
        .admin-panel .settings-section .setting-row input:focus,
        .admin-panel .settings-section .setting-row textarea:focus {
            outline: none;
            border-color: #FFD700;
        }
        .admin-panel .settings-section .setting-row .btn-save {
            padding: 4px 14px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 4px;
            color: #FFD700;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .admin-panel .settings-section .setting-row .btn-save:hover {
            background: rgba(255, 215, 0, 0.2);
        }
        .admin-panel .settings-section .setting-row .btn-save.saved {
            background: rgba(0, 255, 100, 0.1);
            border-color: rgba(0, 255, 100, 0.2);
            color: #00FF88;
        }
        .admin-panel .settings-section .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .admin-panel .settings-section .toggle-row label {
            color: #888;
            font-size: 11px;
            min-width: 70px;
        }

    <script>
        // ================================================================
        //                      الإعدادات الأساسية
        // ================================================================
        const API_BASE = 'https://joj-d0kl.onrender.com';
        const ADMIN_ID = 7011476249;
        let USER_ID = null;
        let isSpinning = false;
        let prizesCache = [];
        let currentRotation = 0;
        let soundEnabled = true;
        let settingsCache = {};
        let spinDuration = 3500;

        // ================================================================
        //                      نظام الصوت (بدون موسيقى خلفية)
        // ================================================================
        class SoundManager {
            constructor() {
                this.initialized = false;
                this.audioContext = null;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.warn('Web Audio not supported');
                }
            }

            stopAll() {
                if (this.audioContext) {
                    try {
                        this.audioContext.close();
                        this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {}
                }
            }

            playWinSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    const melody = [
                        [523, 0.1],
                        [587, 0.1],
                        [659, 0.1],
                        [784, 0.15],
                        [659, 0.1],
                        [880, 0.1],
                        [988, 0.1],
                        [1175, 0.2],
                        [1047, 0.1],
                        [1175, 0.1],
                        [1319, 0.1],
                        [1568, 0.25],
                        [1319, 0.1],
                        [1175, 0.1],
                        [1047, 0.1],
                        [880, 0.3]
                    ];
                    melody.forEach(([freq, dur], i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, now + i * 0.08);
                        osc.type = i % 3 === 0 ? 'sine' : 'triangle';
                        gain.gain.setValueAtTime(0.1, now + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + dur);
                        osc.start(now + i * 0.08);
                        osc.stop(now + i * 0.08 + dur);
                    });
                    setTimeout(() => {
                        const chords = [523, 659, 784, 1047];
                        chords.forEach((freq, i) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.frequency.setValueAtTime(freq, now + 1.3 + i * 0.05);
                            osc.type = 'sine';
                            gain.gain.setValueAtTime(0.05, now + 1.3 + i * 0.05);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8 + i * 0.05);
                            osc.start(now + 1.3 + i * 0.05);
                            osc.stop(now + 1.8 + i * 0.05);
                        });
                    }, 800);
                } catch (e) {
                    console.warn('Sound error:', e);
                }
            }

            playLoseSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.5);
                    osc.type = 'sawtooth';
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    setTimeout(() => {
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.frequency.setValueAtTime(300, now + 0.3);
                        osc2.frequency.exponentialRampToValueAtTime(100, now + 0.6);
                        osc2.type = 'square';
                        gain2.gain.setValueAtTime(0.04, now + 0.3);
                        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                        osc2.start(now + 0.3);
                        osc2.stop(now + 0.6);
                    }, 200);
                } catch (e) {
                    console.warn('Sound error:', e);
                }
            }

            playSpinSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    for (let i = 0; i < 12; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(200 + i * 30, now + i * 0.06);
                        osc.type = 'square';
                        gain.gain.setValueAtTime(0.02, now + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.04);
                        osc.start(now + i * 0.06);
                        osc.stop(now + i * 0.06 + 0.04);
                    }
                    setTimeout(() => {
                        const oscEnd = ctx.createOscillator();
                        const gainEnd = ctx.createGain();
                        oscEnd.connect(gainEnd);
                        gainEnd.connect(ctx.destination);
                        oscEnd.frequency.setValueAtTime(800, now + 0.8);
                        oscEnd.frequency.exponentialRampToValueAtTime(400, now + 1.0);
                        oscEnd.type = 'sine';
                        gainEnd.gain.setValueAtTime(0.05, now + 0.8);
                        gainEnd.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
                        oscEnd.start(now + 0.8);
                        oscEnd.stop(now + 1.0);
                    }, 700);
                } catch (e) {
                    console.warn('Sound error:', e);
                }
            }
        }

        const soundManager = new SoundManager();

        // ================================================================
        //                      جلب USER_ID
        // ================================================================
        function getUserId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('user_id') || params.get('userId') || params.get('id');
            if (id && !isNaN(id)) {
                USER_ID = parseInt(id);
                localStorage.setItem('wheel_user_id', USER_ID);
                return USER_ID;
            }
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const user = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (user && user.id) {
                        USER_ID = user.id;
                        localStorage.setItem('wheel_user_id', USER_ID);
                        return USER_ID;
                    }
                }
            } catch (e) {}
            id = localStorage.getItem('wheel_user_id');
            if (id) {
                USER_ID = parseInt(id);
                return USER_ID;
            }
            return null;
        }

        // ================================================================
        //                      رسم شريط النيون والأمواج
        // ================================================================

        let neonAngle = 0;
        let waveAngle = 0;

        // ---- شريط النيون الدائري ----
        function drawNeon() {
            const canvas = document.getElementById('neonCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width,
                h = canvas.height;
            const cx = w / 2,
                cy = h / 2;
            const r = Math.min(w, h) / 2 - 4;

            ctx.clearRect(0, 0, w, h);

            neonAngle -= 0.002;

            // الشريط الرئيسي - خط نيون سميك
            const grad1 = ctx.createRadialGradient(cx - r * 0.1, cy - r * 0.1, 0, cx, cy, r + 8);
            grad1.addColorStop(0, 'rgba(255, 215, 0, 0.03)');
            grad1.addColorStop(0.3, 'rgba(255, 215, 0, 0.08)');
            grad1.addColorStop(0.7, 'rgba(255, 215, 0, 0.15)');
            grad1.addColorStop(0.85, 'rgba(255, 215, 0, 0.3)');
            grad1.addColorStop(0.92, 'rgba(255, 215, 0, 0.6)');
            grad1.addColorStop(0.97, 'rgba(255, 215, 0, 0.8)');
            grad1.addColorStop(1, 'rgba(255, 215, 0, 0)');

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.strokeStyle = grad1;
            ctx.lineWidth = 6;
            ctx.shadowColor = 'rgba(255, 215, 0, 0.3)';
            ctx.shadowBlur = 30;
            ctx.stroke();

            // الشريط الداخلي - أرق
            ctx.beginPath();
            ctx.arc(cx, cy, r - 2, 0, 2 * Math.PI);
            ctx.strokeStyle = `rgba(255, 255, 200, ${0.15 + Math.sin(neonAngle * 2) * 0.05})`;
            ctx.lineWidth = 1.5;
            ctx.shadowColor = 'rgba(255, 215, 0, 0.2)';
            ctx.shadowBlur = 15;
            ctx.stroke();

            // الشريط الخارجي - أرق مع توهج
            ctx.beginPath();
            ctx.arc(cx, cy, r + 3, 0, 2 * Math.PI);
            ctx.strokeStyle = `rgba(255, 215, 0, ${0.08 + Math.sin(neonAngle * 1.5 + 1) * 0.04})`;
            ctx.lineWidth = 1;
            ctx.shadowColor = 'rgba(255, 215, 0, 0.15)';
            ctx.shadowBlur = 25;
            ctx.stroke();

            // خطوط متقطعة نيونية على الشريط (تأثير نبض)
            const numDash = 12;
            for (let i = 0; i < numDash; i++) {
                const angle = (i / numDash) * 2 * Math.PI + neonAngle * 0.5;
                const len = 12 + Math.sin(angle * 3 + neonAngle * 2) * 5;
                const startR = r - 2;
                const endR = r + 2;

                const x1 = cx + Math.cos(angle) * startR;
                const y1 = cy + Math.sin(angle) * startR;
                const x2 = cx + Math.cos(angle) * endR;
                const y2 = cy + Math.sin(angle) * endR;

                const alpha = 0.15 + Math.sin(angle * 2 + neonAngle * 1.5) * 0.1 + 0.1;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = `rgba(255, 215, 0, ${alpha})`;
                ctx.lineWidth = 1.2;
                ctx.shadowColor = `rgba(255, 215, 0, ${alpha * 0.3})`;
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // نقاط ضوئية صغيرة على الشريط
            const numDots = 20;
            for (let i = 0; i < numDots; i++) {
                const angle = (i / numDots) * 2 * Math.PI + neonAngle * 0.8;
                const dotR = r + Math.sin(angle * 2 + neonAngle * 1.2) * 1.5;
                const x = cx + Math.cos(angle) * dotR;
                const y = cy + Math.sin(angle) * dotR;
                const size = 1.5 + Math.sin(angle * 3 + neonAngle * 2) * 0.8 + 0.8;
                const alpha = 0.2 + Math.sin(angle * 2 + neonAngle * 1.5) * 0.15 + 0.15;

                ctx.beginPath();
                ctx.arc(x, y, size, 0, 2 * Math.PI);
                ctx.fillStyle = `rgba(255, 255, 220, ${alpha})`;
                ctx.shadowColor = `rgba(255, 215, 0, ${alpha * 0.4})`;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // شريط توهج خارجي خفيف جداً
            ctx.beginPath();
            ctx.arc(cx, cy, r + 6, 0, 2 * Math.PI);
            ctx.strokeStyle = `rgba(255, 215, 0, ${0.03 + Math.sin(neonAngle * 0.8) * 0.015})`;
            ctx.lineWidth = 3;
            ctx.shadowColor = 'rgba(255, 215, 0, 0.1)';
            ctx.shadowBlur = 50;
            ctx.stroke();
            ctx.shadowBlur = 0;

            requestAnimationFrame(drawNeon);
        }

        // ---- الأمواج النيونية (خطوط رفيعة تخرج من الشريط) ----
        function drawWaves() {
            const canvas = document.getElementById('waveCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width,
                h = canvas.height;
            const cx = w / 2,
                cy = h / 2;
            const baseR = Math.min(w, h) / 2;

            ctx.clearRect(0, 0, w, h);

            waveAngle += 0.003;

            // 3 طبقات من الأمواج
            const layers = [
                { count: 40, speed: 1.2, amplitude: 10, width: 1.5, alpha: 0.15, offset: 0 },
                { count: 30, speed: 0.8, amplitude: 18, width: 1, alpha: 0.1, offset: 1.5 },
                { count: 20, speed: 0.5, amplitude: 28, width: 0.7, alpha: 0.06, offset: 3 }
            ];

            layers.forEach((layer) => {
                const numLines = layer.count;
                for (let i = 0; i < numLines; i++) {
                    const angle = (i / numLines) * 2 * Math.PI + waveAngle * layer.speed + layer.offset;
                    // تموج في الطول والاتجاه
                    const wavePulse = Math.sin(angle * 3 + waveAngle * layer.speed * 1.2 + layer.offset) * 0.5 + 0.5;
                    const length = layer.amplitude * (0.3 + wavePulse * 0.7);

                    const startR = baseR + 4 + Math.sin(angle * 2 + waveAngle * 0.5) * 2;
                    const endR = startR + length;

                    const x1 = cx + Math.cos(angle) * startR;
                    const y1 = cy + Math.sin(angle) * startR;
                    const x2 = cx + Math.cos(angle) * endR;
                    const y2 = cy + Math.sin(angle) * endR;

                    // شفافية متغيرة مع الزمن والزاوية
                    const alpha = layer.alpha * (0.3 + Math.sin(angle * 2 + waveAngle * layer.speed * 0.7) * 0.3 + 0.4);

                    // توهج نيوني
                    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
                    grad.addColorStop(0, `rgba(255, 215, 0, ${alpha * 0.8})`);
                    grad.addColorStop(0.3, `rgba(255, 215, 0, ${alpha})`);
                    grad.addColorStop(0.7, `rgba(255, 200, 50, ${alpha * 0.7})`);
                    grad.addColorStop(1, `rgba(255, 200, 50, 0)`);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = layer.width + Math.sin(angle * 2 + waveAngle * 1.5) * 0.3;
                    ctx.shadowColor = `rgba(255, 215, 0, ${alpha * 0.3})`;
                    ctx.shadowBlur = 8 + layer.width * 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            });

            // أمواج عشوائية إضافية (تأثير ارتداد)
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * 2 * Math.PI + waveAngle * 0.7 + Math.sin(waveAngle * 0.3) * 0.5;
                const pulse = Math.sin(waveAngle * 0.8 + i * 1.2) * 0.5 + 0.5;
                const length = 15 + pulse * 20;
                const startR = baseR + 2 + Math.sin(angle * 3 + waveAngle * 0.6) * 3;
                const endR = startR + length;

                const x1 = cx + Math.cos(angle) * startR;
                const y1 = cy + Math.sin(angle) * startR;
                const x2 = cx + Math.cos(angle) * endR;
                const y2 = cy + Math.sin(angle) * endR;

                const alpha = 0.04 + pulse * 0.06;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = `rgba(255, 215, 0, ${alpha})`;
                ctx.lineWidth = 0.5 + pulse * 1;
                ctx.shadowColor = `rgba(255, 215, 0, ${alpha * 0.2})`;
                ctx.shadowBlur = 12;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(drawWaves);
        }

        // ================================================================
        //                      رسم العجلة
        // ================================================================
        function drawWheel(prizes, highlightIndex = -1, rotation = 0) {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width,
                h = canvas.height;
            const cx = w / 2,
                cy = h / 2;
            const r = Math.min(w, h) / 2 - 14;
            const noPrizes = document.getElementById('noPrizes');
            const wrapper = document.getElementById('wheelWrapper');

            if (!prizes || prizes.length === 0) {
                noPrizes.style.display = 'block';
                wrapper.classList.remove('show');
                return;
            }

            noPrizes.style.display = 'none';
            wrapper.classList.add('show');
            ctx.clearRect(0, 0, w, h);

            const total = prizes.length;
            const step = (2 * Math.PI) / total;

            prizes.forEach((p, i) => {
                const start = i * step + rotation - Math.PI / 2;
                const end = start + step;
                const isHighlight = (i === highlightIndex);

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();

                const color1 = p.color || '#1a1a2e';
                const color2 = p.color2 || '#16213e';
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);

                if (isHighlight) {
                    grad.addColorStop(0, '#FFD700');
                    grad.addColorStop(0.5, '#FF8C00');
                    grad.addColorStop(1, '#B8860B');
                } else {
                    grad.addColorStop(0, color1);
                    grad.addColorStop(1, color2);
                }
                ctx.fillStyle = grad;
                ctx.fill();

                if (isHighlight) {
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 50;
                } else {
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                }

                ctx.strokeStyle = isHighlight ? '#FFD700' : 'rgba(255,215,0,0.05)';
                ctx.lineWidth = isHighlight ? 2.5 : 0.5;
                ctx.stroke();
                ctx.shadowBlur = 0;

                const mid = start + step / 2;
                const tr = r * 0.62;
                const x = cx + Math.cos(mid) * tr;
                const y = cy + Math.sin(mid) * tr;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(mid + (mid > Math.PI / 2 ? Math.PI : 0));

                ctx.fillStyle = isHighlight ? '#0a0a0a' : '#fff';
                ctx.font = isHighlight ? 'bold 19px sans-serif' : '17px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 8;
                ctx.fillText(p.icon || '🎁', 0, 0);
                ctx.shadowBlur = 0;
                ctx.restore();
            });

            const centerR = r * 0.16;
            const centerIcon = settingsCache.center_icon || '⭐';

            const grad = ctx.createRadialGradient(cx - 4, cy - 4, 0, cx, cy, centerR);
            grad.addColorStop(0, '#FFD700');
            grad.addColorStop(0.3, '#FFA500');
            grad.addColorStop(0.7, '#FF8C00');
            grad.addColorStop(1, '#B8860B');

            ctx.beginPath();
            ctx.arc(cx, cy, centerR, 0, 2 * Math.PI);
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
            ctx.shadowBlur = 40;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.beginPath();
            ctx.arc(cx, cy, centerR + 5, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#0a0a0a';
            ctx.font = '32px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillText(centerIcon, cx, cy + 1);
            ctx.shadowBlur = 0;
        }

        // ================================================================
        //                      دوران العجلة
        // ================================================================
        function animateSpin(targetRotation, duration, callback) {
            const canvas = document.getElementById('wheelCanvas');
            canvas.classList.add('spinning');

            const startRotation = currentRotation;
            const startTime = performance.now();

            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOutCubic = 1 - Math.pow(1 - progress, 3);
                const easedProgress = easeOutCubic;

                const currentAngle = startRotation + (targetRotation - startRotation) * easedProgress;
                currentRotation = currentAngle;

                drawWheel(prizesCache, -1, currentAngle);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentRotation = targetRotation;
                    canvas.classList.remove('spinning');
                    if (callback) callback();
                }
            }

            requestAnimationFrame(animate);
        }

        async function saveSetting(key, value) {
            try {
                let finalValue = value;
                if (typeof value === 'boolean') {
                    finalValue = value ? 'true' : 'false';
                }
                const response = await fetch(`${API_BASE}/api/admin/setting`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        admin_id: ADMIN_ID,
                        key: key,
                        value: String(finalValue)
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'فشل الحفظ');
                }
                return data.success === true;
            } catch (e) {
                console.error('Error saving setting:', e);
                showError('فشل حفظ الإعداد: ' + e.message);
                return false;
            }

                        } else {
                            depositStatus.innerHTML =
                                `الحالة: <span class="not-met">❌ غير مكتمل (${currentDeposits}/${minAmount} SYP)</span>`;
                        }
                    } else {
                        depositNotice.classList.remove('show');
                    }

                    const spinBtn = document.getElementById('spinBtn');
                    const canSpin = data.spin_status?.can_spin !== false &&
                        (!data.deposit_requirement?.required || data.deposit_requirement?.is_met);

                    if (canSpin && prizesCache.length > 0) {
                        spinBtn.disabled = false;
                        document.getElementById('spinBtnText').textContent = '🎰 تدوير العجلة';
                    } else if (!data.spin_status?.can_spin) {
                        spinBtn.disabled = true;
                        const h = data.spin_status?.remaining_hours || 0;
                        const m = data.spin_status?.remaining_minutes || 0;
                        document.getElementById('spinBtnText').textContent = `⏳ ${h}h ${m}m`;
                        soundManager.stopAll();
                    } else if (data.deposit_requirement?.required && !data.deposit_requirement?.is_met) {
                        spinBtn.disabled = true;
                        document.getElementById('spinBtnText').textContent = '💰 إيداع مطلوب';
                        soundManager.stopAll();
                    } else {
                        spinBtn.disabled = true;
                        document.getElementById('spinBtnText').textContent = '⏳ جاري التحميل...';
                    }
                }
            } catch (e) {
                console.error('Error loading user status:', e);
            }
        }

        // ================================================================
        //                      تحديث كل شيء
        // ================================================================
        async function refreshAll() {
            await loadSettings();
            const prizes = await loadPrizes();
            drawWheel(prizes, -1, currentRotation);
            await loadUserStatus();
            await renderAdminPanel();
        }

        // ================================================================
        //                      تأثيرات الاحتفال
        // ================================================================
        function createConfetti(count = 60) {
            const container = document.getElementById('confettiContainer');
            container.innerHTML = '';
            const colors = ['#FFD700', '#FF6B00', '#FF0000', '#00FF00', '#00BFFF', '#FF00FF', '#FF69B4', '#FF4500',
                '#7CFC00'
            ];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                const size = 6 + Math.random() * 14;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.top = Math.random() * 40 + '%';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
                el.style.animationDelay = Math.random() * 0.8 + 's';
                container.appendChild(el);
            }
            setTimeout(() => { container.innerHTML = ''; }, 3500);
        }

        function createWinEffects(prizeName) {
            const resultBox = document.getElementById('resultBox');
            resultBox.classList.add('winner');
            createConfetti(60);
            showNotification(`🎉 مبروك! لقد فزت بـ ${prizeName}!`);
        }

        function clearWinEffects() {
            const resultBox = document.getElementById('resultBox');
            resultBox.classList.remove('winner');
        }

        function showNotification(message) {
            const bar = document.getElementById('notificationBar');
            document.getElementById('notifPrizeName').textContent = message.replace('🎉 مبروك! لقد فزت بـ ', '').replace('!',
                '');
            bar.classList.add('show');
            setTimeout(() => { bar.classList.remove('show'); }, 4000);
        }

        // ================================================================
        //                      شاشة اللودينغ
        // ================================================================
        function updateLoading(progress) {
            const bar = document.getElementById('loaderProgressBar');
            const text = document.getElementById('loaderStatusText');
            bar.style.width = progress + '%';
            text.textContent = progress + '%';
        }

        function showLoading(show) {
            const screen = document.getElementById('loadingScreen');
            const wrapper = document.getElementById('wheelWrapper');
            if (show) {
                screen.classList.add('active');
                wrapper.classList.remove('show');
            } else {
                screen.classList.remove('active');
                wrapper.classList.add('show');
            }
        }

        // ================================================================
        //                      التحقق من الاتصال
        // ================================================================
        async function checkConnection() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                const response = await fetch(`${API_BASE}/api/status`, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return true;
            } catch (e) {
                console.error('Connection failed:', e);
                return false;
            }
        }

        // ================================================================
        //                      تدوير العجلة
        // ================================================================
        async function spinWheel() {
            if (isSpinning || !USER_ID) return;
            if (document.getElementById('spinBtn').disabled) return;
            if (prizesCache.length === 0) {
                showError('لا توجد جوائز متاحة');
                return;
            }

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.classList.add('loading');
            document.getElementById('spinBtnText').textContent = 'جاري التدوير...';

            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('errorMsg').classList.remove('show');
            clearWinEffects();

            soundManager.init();
            soundManager.playSpinSound();

            try {
                const response = await fetch(`${API_BASE}/api/wheel/spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: USER_ID })
                });

                const data = await response.json();
                spinBtn.classList.remove('loading');

                if (data.success) {
                    const prize = data.spin.prize;
                    const step = (2 * Math.PI) / prizesCache.length;

                    const prizeIndex = prizesCache.findIndex(p => p.id === prize.id);
                    const isWin = !prize.name.includes('حظ سعيد');

                    if (prizeIndex === -1) {
                        const randomIndex = Math.floor(Math.random() * prizesCache.length);
                        const targetAngle = (randomIndex / prizesCache.length) * 2 * Math.PI;
                        const totalRotation = currentRotation + (4 * 2 * Math.PI) + (2 * Math.PI - targetAngle - (step /
                            2));

                        animateSpin(totalRotation, spinDuration, () => {
                            drawWheel(prizesCache, randomIndex, totalRotation);
                            showResult(prizesCache[randomIndex], isWin);
                        });
                    } else {
                        const targetAngle = (prizeIndex / prizesCache.length) * 2 * Math.PI;
                        const totalRotation = currentRotation + (4 * 2 * Math.PI) + (2 * Math.PI - targetAngle - (step /
                            2));

                        animateSpin(totalRotation, spinDuration, () => {
                            drawWheel(prizesCache, prizeIndex, totalRotation);
                            showResult(prize, isWin);
                        });
                    }

                } else {
                    showError(data.error || 'حدث خطأ');
                    if (data.remaining_hours !== undefined) {
                        const btn = document.getElementById('spinBtn');
                        btn.disabled = true;
                        document.getElementById('spinBtnText').textContent = `⏳ ${data.remaining_hours}h ${data.remaining_minutes}m`;
                        soundManager.stopAll();
                    }
                    drawWheel(prizesCache, -1, currentRotation);
                }

            } catch (e) {
                spinBtn.classList.remove('loading');
                showError('خطأ في الاتصال: ' + e.message);
                drawWheel(prizesCache, -1, currentRotation);
                soundManager.stopAll();
            }

            isSpinning = false;
            if (!document.getElementById('spinBtn').disabled) {
                document.getElementById('spinBtnText').textContent = '🎰 تدوير العجلة';
            }
        }

        // ================================================================
        //                      عرض النتيجة
        // ================================================================
        function showResult(prize, isWin) {
            document.getElementById('prizeDesc').textContent = prize.description || prize.name || 'جائزة!';
            document.getElementById('resultBox').classList.add('show');

            soundManager.stopAll();

            if (isWin) {
                createWinEffects(prize.description || prize.name);
                soundManager.playWinSound();
            } else {
                soundManager.playLoseSound();
            }

            loadUserStatus();
        }

        // ================================================================
        //                      عرض الخطأ
        // ================================================================
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            document.getElementById('errorText').textContent = '❌ ' + msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        // ================================================================
        //                      أحداث الإدارة
        // ================================================================
        document.querySelectorAll('.btn-save').forEach(btn => {
            btn.addEventListener('click', async function() {
                const key = this.dataset.setting;
                const fieldId = this.dataset.field;
                const type = this.dataset.type || 'text';
                let value = '';
                if (type === 'checkbox') {
                    value = document.getElementById(fieldId).checked;
                } else {
                    value = document.getElementById(fieldId).value;
                }
                const originalText = this.textContent;
                this.textContent = '⏳ جاري...';
                this.disabled = true;
                const success = await saveSetting(key, value);
                if (success) {
                    this.textContent = '✅ تم الحفظ';
                    this.classList.add('saved');
                    await refreshAll();
                    setTimeout(() => {
                        this.textContent = originalText;
                        this.classList.remove('saved');
                        this.disabled = false;
                    }, 2000);
                } else {
                    this.textContent = '❌ فشل';
                    setTimeout(() => {
                        this.textContent = originalText;
                        this.disabled = false;
                    }, 2000);
                }
            });
        });

        document.getElementById('addPrizeBtn').addEventListener('click', async function() {
            const nameInput = document.getElementById('newPrizeName');
            const iconInput = document.getElementById('newPrizeIcon');
            const descInput = document.getElementById('newPrizeDesc');
            const probInput = document.getElementById('newPrizeProb');
            const colorInput = document.getElementById('newPrizeColor');
            const color2Input = document.getElementById('newPrizeColor2');

            const name = nameInput.value.trim();
            const icon = iconInput.value.trim() || '🎁';
            const description = descInput.value.trim() || '';
            const prob = parseFloat(probInput.value) || 10;
            const color = colorInput.value || '#1a1a2e';
            const color2 = color2Input.value || '#16213e';

            if (!name) {
                showError('⚠️ الرجاء إدخال اسم الجائزة');
                nameInput.focus();
                return;
            }
            if (prob < 0 || prob > 100) {
                showError('⚠️ النسبة يجب أن تكون بين 0 و 100');
                probInput.focus();
                return;
            }

            const btn = this;
            btn.disabled = true;
            btn.textContent = '⏳';

            const success = await addPrize(name, icon, description, prob, color, color2);
            if (success) {
                nameInput.value = '';
                iconInput.value = '';
                descInput.value = '';
                probInput.value = '';
                await refreshAll();
                showNotification(`✅ تم إضافة "${name}" بنجاح`);
            } else {
                showError('❌ فشل إضافة الجائزة');
            }
            btn.disabled = false;
            btn.textContent = '➕';
        });

        document.getElementById('refreshPrizesBtn').addEventListener('click', async function() {
            await refreshAll();
            showNotification('🔄 تم تحديث الكل');
        });

        document.getElementById('resetPrizesBtn').addEventListener('click', async function() {
            if (confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع الجوائز إلى الإعدادات الافتراضية؟')) {
                const success = await resetPrizes();
                if (success) {
                    await refreshAll();
                    showNotification('✅ تم إعادة تعيين الجوائز');
                } else {
                    showError('❌ فشل إعادة التعيين');
                }
            }
        });

        document.getElementById('soundToggle').addEventListener('change', function() {
            soundEnabled = this.checked;
            if (!soundEnabled) {
                soundManager.stopAll();
            }
        });

        // ================================================================
        //                      التهيئة
        // ================================================================
        async function init() {
            USER_ID = getUserId();

            if (!USER_ID) {
                document.getElementById('errorContainer').classList.add('show');
                document.getElementById('userStatus').style.display = 'none';
                return;
            }

            showLoading(true);
            updateLoading(0);

            try {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 12;
                    if (progress > 85) progress = 85;
                    updateLoading(Math.round(progress));
                }, 150);

                const isConnected = await checkConnection();
                if (!isConnected) {
                    clearInterval(interval);
                    updateLoading(100);
                    await new Promise(r => setTimeout(r, 400));
                    showLoading(false);
                    showError('⚠️ لا يمكن الاتصال بالخادم. تأكد من اتصالك بالإنترنت.');
                    return;
                }

                updateLoading(30);
                await new Promise(r => setTimeout(r, 300));

                await loadSettings();
                updateLoading(50);
                await new Promise(r => setTimeout(r, 300));

                const prizes = await loadPrizes();
                drawWheel(prizes, -1, 0);
                updateLoading(70);
                await new Promise(r => setTimeout(r, 300));

                await loadUserStatus();
                updateLoading(85);
                await new Promise(r => setTimeout(r, 300));

                await renderAdminPanel();
                updateLoading(95);
                await new Promise(r => setTimeout(r, 300));

                clearInterval(interval);
                updateLoading(100);
                await new Promise(r => setTimeout(r, 500));

                soundManager.init();

                // بدء تشغيل النيون والأمواج
                drawNeon();
                drawWaves();

            } catch (e) {
                console.error('Init error:', e);
                updateLoading(100);
                await new Promise(r => setTimeout(r, 600));
                showError('⚠️ فشل تحميل البيانات: ' + e.message);
            }

            showLoading(false);
            document.getElementById('spinBtn').onclick = spinWheel;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
