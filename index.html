<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 منصة ألعاب IChancy</title>
    <style>
        /* ========== Reset & Base ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }
        
        /* ========== Scrollbar ========== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: #00b894; border-radius: 4px; }
        
        /* ========== Animations ========== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        
        /* ========== Logo ========== */
        .logo {
            text-align: center;
            padding: 30px 0 20px;
        }
        
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #00b894, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo p {
            color: #8899aa;
            font-size: 14px;
            margin-top: 4px;
        }
        
        /* ========== Cards ========== */
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-title .badge {
            background: rgba(0, 184, 148, 0.2);
            color: #00b894;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 12px;
        }
        
        /* ========== Inputs ========== */
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #8899aa;
            margin-bottom: 6px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #00b894;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.1);
        }
        
        .form-group input::placeholder {
            color: #556677;
        }
        
        /* ========== Buttons ========== */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 184, 148, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-game {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            color: #fff;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .btn-game:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(-4px);
        }
        
        .btn-game .icon { font-size: 24px; }
        .btn-game .info { flex: 1; text-align: right; }
        .btn-game .info .name { font-size: 15px; font-weight: 500; }
        .btn-game .info .provider { font-size: 12px; color: #8899aa; }
        .btn-game .arrow { color: #00b894; font-size: 18px; }
        
        .btn-logout {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }
        
        .btn-logout:hover {
            background: rgba(255, 107, 107, 0.2);
        }
        
        /* ========== Loading ========== */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00b894;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        
        /* ========== User Badge ========== */
        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(0, 184, 148, 0.08);
            border: 1px solid rgba(0, 184, 148, 0.15);
            border-radius: 10px;
            margin-bottom: 16px;
        }
        
        .user-badge .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00b894, #00cec9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
        }
        
        .user-badge .details { flex: 1; }
        .user-badge .details .name { font-weight: 500; font-size: 15px; }
        .user-badge .details .id { font-size: 12px; color: #8899aa; }
        
        .user-badge .balance { text-align: left; }
        .user-badge .balance .amount { font-size: 18px; font-weight: 700; color: #00b894; }
        .user-badge .balance .label { font-size: 11px; color: #8899aa; }
        
        /* ========== Error ========== */
        .error-box {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.2);
            border-radius: 10px;
            padding: 12px 16px;
            color: #ff6b6b;
            font-size: 14px;
            display: none;
            margin-bottom: 16px;
        }
        
        .error-box.show { display: block; animation: fadeIn 0.3s ease-out; }
        
        /* ========== Stats ========== */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .stat-item {
            text-align: center;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }
        
        .stat-item .number { font-size: 20px; font-weight: 700; color: #fff; }
        .stat-item .label { font-size: 11px; color: #8899aa; margin-top: 2px; }
        
        /* ========== Responsive ========== */
        @media (max-width: 400px) {
            .container { padding: 0 4px; }
            .card { padding: 16px; }
            .stats { grid-template-columns: 1fr 1fr; }
            .user-badge { flex-wrap: wrap; }
            .user-badge .balance { width: 100%; text-align: center; }
        }
        
        /* ========== حفظ البيانات محلياً ========== */
        .save-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 13px;
            color: #8899aa;
        }
        
        .save-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00b894;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    
    <!-- ===== LOGO ===== -->
    <div class="logo fade-in">
        <h1>🎮 IChancy</h1>
        <p>منصة الألعاب المتكاملة</p>
    </div>

    <!-- ===== ERROR ===== -->
    <div class="error-box" id="errorBox"></div>

    <!-- ===== LOGIN FORM ===== -->
    <div id="loginForm" class="card fade-in">
        <div class="card-title">
            🔐 تسجيل الدخول
            <span class="badge">آمن</span>
        </div>
        
        <div class="form-group">
            <label>👤 اسم المستخدم</label>
            <input type="text" id="usernameInput" placeholder="أدخل اسم المستخدم" autocomplete="username">
        </div>
        
        <div class="form-group">
            <label>🔑 كلمة المرور</label>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" autocomplete="current-password">
        </div>
        
        <div class="form-group">
            <label>🆔 معرف اللاعب (Player ID)</label>
            <input type="text" id="playerIdInput" placeholder="أدخل معرف اللاعب" autocomplete="off">
        </div>
        
        <div class="save-toggle">
            <input type="checkbox" id="rememberMe" checked>
            <label for="rememberMe">تذكر بياناتي</label>
        </div>
        
        <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()" style="margin-top:12px;">
            🚀 تسجيل الدخول
        </button>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboard" style="display:none;">
        
        <!-- User Info -->
        <div class="user-badge fade-in" id="userBadge">
            <div class="avatar" id="userAvatar">👤</div>
            <div class="details">
                <div class="name" id="displayName">-</div>
                <div class="id" id="displayId">🆔 -</div>
            </div>
            <div class="balance">
                <div class="amount" id="displayBalance">0</div>
                <div class="label">NSP</div>
            </div>
        </div>
        
        <!-- Stats -->
        <div class="stats fade-in" id="statsContainer">
            <div class="stat-item">
                <div class="number" id="statGames">0</div>
                <div class="label">🎮 ألعاب</div>
            </div>
            <div class="stat-item">
                <div class="number" id="statProviders">0</div>
                <div class="label">🏢 مزودين</div>
            </div>
            <div class="stat-item">
                <div class="number" id="statActive">0</div>
                <div class="label">🟢 نشطة</div>
            </div>
        </div>
        
        <!-- Games List -->
        <div class="card fade-in">
            <div class="card-title">
                🎮 الألعاب المتاحة
                <span class="badge" id="gamesCount">0</span>
            </div>
            
            <div id="gamesList">
                <div style="text-align:center; padding:20px; color:#8899aa;">
                    <div class="spinner"></div>
                    <p style="margin-top:12px;">جاري تحميل الألعاب...</p>
                </div>
            </div>
        </div>
        
        <!-- Logout -->
        <button class="btn btn-logout" onclick="handleLogout()">
            🚪 تسجيل الخروج
        </button>
    </div>

</div>

<script>
    // ============================================================
    //  المتغيرات العامة
    // ============================================================
    let userData = null;
    let gamesList = [];
    let isLoggedIn = false;
    const API_BASE = 'https://corsproxy.io/?' + encodeURIComponent('https://agents.ichancy.com');
    const GAME_BASE = 'https://pg.ichancy200.com';

    // ============================================================
    //  تحميل البيانات المحفوظة
    // ============================================================
    function loadSavedData() {
        try {
            const saved = localStorage.getItem('ichancy_user_data');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.username && data.player_id) {
                    document.getElementById('usernameInput').value = data.username || '';
                    document.getElementById('playerIdInput').value = data.player_id || '';
                    document.getElementById('rememberMe').checked = true;
                    
                    // إذا كان هناك كلمة مرور محفوظة
                    if (data.password) {
                        document.getElementById('passwordInput').value = data.password;
                    }
                }
            }
        } catch(e) {}
    }
    
    loadSavedData();

    // ============================================================
    //  دوال مساعدة
    // ============================================================
    function showError(message) {
        const box = document.getElementById('errorBox');
        box.textContent = '❌ ' + message;
        box.classList.add('show');
        setTimeout(() => box.classList.remove('show'), 5000);
    }

    function hideError() {
        document.getElementById('errorBox').classList.remove('show');
    }

    function setLoading(loading) {
        const btn = document.getElementById('loginBtn');
        if (loading) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> جاري تسجيل الدخول...';
        } else {
            btn.disabled = false;
            btn.innerHTML = '🚀 تسجيل الدخول';
        }
    }

    // ============================================================
    //  تسجيل الدخول إلى IChancy
    // ============================================================
    async function loginToIChancy(username, password) {
        const url = `${API_BASE}/global/api/User/signIn`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                'Origin': 'https://agents.ichancy.com',
                'Referer': 'https://agents.ichancy.com/'
            },
            body: JSON.stringify({ username, password })
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        
        if (data.status !== true) {
            throw new Error(data.message || 'بيانات الدخول غير صحيحة');
        }
        
        return data;
    }

    // ============================================================
    //  جلب الألعاب
    // ============================================================
    async function getGames(session) {
        const url = `${API_BASE}/global/api/Game/getGames`;
        
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                'Cookie': session
            }
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        return data.result || [];
    }

    // ============================================================
    //  جلب الرصيد
    // ============================================================
    async function getBalance(session, playerId) {
        const url = `${API_BASE}/global/api/Player/getPlayerBalanceById`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                'Cookie': session
            },
            body: JSON.stringify({ playerId })
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        const result = data.result || [];
        if (result.length > 0) {
            return result[0].balance || 0;
        }
        return 0;
    }

    // ============================================================
    //  معالجة تسجيل الدخول
    // ============================================================
    async function handleLogin() {
        hideError();
        
        const username = document.getElementById('usernameInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const playerId = document.getElementById('playerIdInput').value.trim();
        const remember = document.getElementById('rememberMe').checked;
        
        // التحقق من الحقول
        if (!username) {
            showError('الرجاء إدخال اسم المستخدم');
            document.getElementById('usernameInput').focus();
            return;
        }
        
        if (!password) {
            showError('الرجاء إدخال كلمة المرور');
            document.getElementById('passwordInput').focus();
            return;
        }
        
        if (!playerId) {
            showError('الرجاء إدخال معرف اللاعب');
            document.getElementById('playerIdInput').focus();
            return;
        }
        
        if (!/^\d+$/.test(playerId)) {
            showError('معرف اللاعب يجب أن يكون أرقاماً فقط');
            return;
        }
        
        setLoading(true);
        
        try {
            // 1. تسجيل الدخول
            const loginResult = await loginToIChancy(username, password);
            
            // استخراج الجلسة من الكوكيز
            const cookies = loginResult._headers?.get('set-cookie') || '';
            const sessionCookie = cookies.split(';').find(c => c.includes('loginCredentials')) || '';
            
            // 2. جلب الرصيد
            const balance = await getBalance(sessionCookie, playerId);
            
            // 3. جلب الألعاب
            const games = await getGames(sessionCookie);
            
            // حفظ البيانات
            userData = {
                username,
                player_id: playerId,
                balance: balance,
                session: sessionCookie
            };
            
            gamesList = games;
            isLoggedIn = true;
            
            // حفظ في localStorage
            if (remember) {
                localStorage.setItem('ichancy_user_data', JSON.stringify({
                    username,
                    password,
                    player_id: playerId
                }));
            } else {
                localStorage.removeItem('ichancy_user_data');
            }
            
            setLoading(false);
            showDashboard();
            
        } catch (error) {
            setLoading(false);
            showError(error.message || 'حدث خطأ أثناء تسجيل الدخول');
            console.error('Login error:', error);
        }
    }

    // ============================================================
    //  عرض لوحة التحكم
    // ============================================================
    function showDashboard() {
        // إخفاء نموذج تسجيل الدخول
        document.getElementById('loginForm').style.display = 'none';
        
        // إظهار لوحة التحكم
        document.getElementById('dashboard').style.display = 'block';
        
        // عرض معلومات المستخدم
        document.getElementById('displayName').textContent = userData.username || 'مستخدم';
        document.getElementById('displayId').textContent = '🆔 ' + (userData.player_id || 'غير معروف');
        document.getElementById('displayBalance').textContent = (userData.balance || 0).toFixed(2);
        document.getElementById('userAvatar').textContent = (userData.username || 'U')[0].toUpperCase();
        
        // عرض الألعاب
        renderGames(gamesList);
    }

    // ============================================================
    //  عرض الألعاب
    // ============================================================
    function renderGames(games) {
        const container = document.getElementById('gamesList');
        
        // تحديث الإحصائيات
        document.getElementById('statGames').textContent = games.length;
        document.getElementById('gamesCount').textContent = games.length;
        
        // استخراج المزودين
        const providers = new Set();
        games.forEach(g => {
            if (g.providerName || g.provider) {
                providers.add(g.providerName || g.provider);
            }
        });
        document.getElementById('statProviders').textContent = providers.size;
        
        // عدد الألعاب النشطة
        const active = games.filter(g => g.isActive !== false).length;
        document.getElementById('statActive').textContent = active;
        
        if (!games || games.length === 0) {
            container.innerHTML = `
                <div style="text-align:center; padding:30px; color:#8899aa;">
                    <div style="font-size:48px; margin-bottom:12px;">📭</div>
                    <p>لا توجد ألعاب متاحة حالياً</p>
                    <button onclick="refreshGames()" style="margin-top:12px; padding:8px 24px; background:#00b894; color:#fff; border:none; border-radius:8px; cursor:pointer;">
                        🔄 تحديث
                    </button>
                </div>
            `;
            return;
        }
        
        // بناء قائمة الألعاب
        let html = '';
        
        games.forEach((game, index) => {
            const name = game.name || game.gameName || 'لعبة بدون اسم';
            const provider = game.providerName || game.provider || game.vendor || '';
            const gameId = game.id || game.gameId || index + 1;
            const isActive = game.isActive !== false;
            
            html += `
                <button class="btn-game" onclick="playGame('${gameId}')" ${!isActive ? 'disabled style="opacity:0.4;"' : ''}>
                    <span class="icon">${isActive ? '🎰' : '⏸️'}</span>
                    <div class="info">
                        <div class="name">${name}</div>
                        ${provider ? `<div class="provider">${provider}</div>` : ''}
                    </div>
                    <span class="arrow">▶</span>
                </button>
            `;
        });
        
        container.innerHTML = html;
    }

    // ============================================================
    //  تشغيل اللعبة
    // ============================================================
    function playGame(gameId) {
        if (!userData || !userData.player_id) {
            showError('الرجاء تسجيل الدخول أولاً');
            return;
        }
        
        // بناء رابط اللعبة
        const timestamp = Date.now();
        const tokenString = `${userData.player_id}_${gameId}_${timestamp}`;
        const gameToken = md5(tokenString);
        
        const url = `${GAME_BASE}/launcher/launch?launchToken=${gameToken}&returnPath=%2F%3FpartnerId%3D18755655%26currency%3DNSP%26lan%3Dar%26gameId%3D${gameId}%26mode%3Dreal&mode=real&currency=NSP`;
        
        // فتح اللعبة في نافذة جديدة
        window.open(url, '_blank');
    }

    // ============================================================
    //  دالة MD5 بسيطة (لتوليد التوكن)
    // ============================================================
    function md5(string) {
        function md5cycle(x, k) {
            let a = x[0], b = x[1], c = x[2], d = x[3];
            a = ff(a, b, c, d, k[0], 7, -680876936);
            d = ff(d, a, b, c, k[1], 12, -389564586);
            c = ff(c, d, a, b, k[2], 17, 606105819);
            b = ff(b, c, d, a, k[3], 22, -1044525330);
            a = ff(a, b, c, d, k[4], 7, -176418897);
            d = ff(d, a, b, c, k[5], 12, 1200080426);
            c = ff(c, d, a, b, k[6], 17, -1473231341);
            b = ff(b, c, d, a, k[7], 22, -45705983);
            a = ff(a, b, c, d, k[8], 7, 1770035416);
            d = ff(d, a, b, c, k[9], 12, -1958414417);
            c = ff(c, d, a, b, k[10], 17, -42063);
            b = ff(b, c, d, a, k[11], 22, -1990404162);
            a = ff(a, b, c, d, k[12], 7, 1804603682);
            d = ff(d, a, b, c, k[13], 12, -40341101);
            c = ff(c, d, a, b, k[14], 17, -1502002290);
            b = ff(b, c, d, a, k[15], 22, 1236535329);
            a = gg(a, b, c, d, k[1], 5, -165796510);
            d = gg(d, a, b, c, k[6], 9, -1069501632);
            c = gg(c, d, a, b, k[11], 14, 643717713);
