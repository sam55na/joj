<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 لعبة التصويت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 30px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #aaa;
            margin-top: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .label {
            color: #aaa;
            font-size: 0.9em;
        }

        .stat-item .value {
            font-size: 1.8em;
            font-weight: bold;
            color: #ffd700;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .game-area {
                grid-template-columns: 1fr;
            }
        }

        .players-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .players-panel h2 {
            color: #ffd700;
            margin-bottom: 20px;
            border-bottom: 2px solid #ffd70033;
            padding-bottom: 10px;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            transition: all 0.3s;
        }

        .player-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
        }

        .player-card .name {
            font-weight: bold;
        }

        .player-card .votes {
            color: #ffd700;
            font-size: 1.1em;
        }

        .player-card.eliminated {
            opacity: 0.4;
            text-decoration: line-through;
        }

        .player-card.winner {
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
        }

        .vote-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .vote-btn:hover {
            transform: scale(1.05);
            background: #45a049;
        }

        .vote-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .vote-btn.voted {
            background: #ff9800;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #ffd700;
            color: #1a1a2e;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(244, 67, 54, 0.3);
        }

        .btn-success {
            background: #4CAF50;
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #ffd700;
            margin-bottom: 20px;
        }

        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
        }

        .modal-content input:focus,
        .modal-content select:focus {
            outline: none;
            border-color: #ffd700;
        }

        .modal-content .btn {
            width: 100%;
            margin-top: 10px;
        }

        .notifications {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            max-width: 400px;
        }

        .notification {
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-right: 4px solid #ffd700;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.success {
            border-right-color: #4CAF50;
        }

        .notification.error {
            border-right-color: #f44336;
        }

        .notification.info {
            border-right-color: #2196F3;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #aaa;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timer {
            font-size: 2em;
            color: #ffd700;
            text-align: center;
            padding: 10px;
        }

        .timer.warning {
            color: #f44336;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="notifications" id="notifications"></div>

    <div class="container">
        <div class="header">
            <h1>🎮 لعبة التصويت</h1>
            <p>اختر لاعبك وصوّت لإقصاء الآخرين!</p>
        </div>

        <div id="gameContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري تحميل اللعبة...</p>
            </div>
        </div>
    </div>

    <!-- Modal إنشاء جولة -->
    <div class="modal" id="createRoundModal">
        <div class="modal-content">
            <h2>🎯 إنشاء جولة جديدة</h2>
            <form id="createRoundForm">
                <input type="number" id="entryFee" placeholder="رسوم الاشتراك (نقطة)" required min="0">
                <input type="number" id="prizeAmount" placeholder="قيمة الجائزة (نقطة)" required min="0">
                <input type="number" id="maxPlayers" placeholder="الحد الأقصى للاعبين" required min="2" value="10">
                <input type="number" id="durationMinutes" placeholder="مدة الجولة (دقائق)" required min="1" value="5">
                <select id="channelId">
                    <option value="">بدون قناة</option>
                </select>
                <button type="submit" class="btn btn-primary">🚀 إنشاء الجولة</button>
                <button type="button" class="btn btn-danger" onclick="closeModal()">❌ إلغاء</button>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // المتغيرات العامة
        // ==========================================

        const API_URL = window.location.origin;
        let ws = null;
        let currentRoundId = null;
        let currentUserId = null;
        let currentUsername = null;
        let hasVoted = false;
        let isAdmin = false;

        // ==========================================
        // تهيئة التطبيق
        // ==========================================

        document.addEventListener('DOMContentLoaded', () => {
            // الحصول على بيانات المستخدم من التلغرام
            const urlParams = new URLSearchParams(window.location.search);
            currentUserId = parseInt(urlParams.get('user_id')) || null;
            currentUsername = urlParams.get('username') || 'مستخدم';
            isAdmin = urlParams.get('admin') === 'true';

            if (currentUserId) {
                loadRounds();
            } else {
                showNotification('⚠️ يرجى الدخول عبر رابط البوت', 'error');
            }
        });

        // ==========================================
        // دوال الـ API
        // ==========================================

        async function apiCall(endpoint, method = 'GET', data = null) {
            try {
                const options = {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    }
                };

                if (data) {
                    options.body = JSON.stringify(data);
                }

                const response = await fetch(`${API_URL}${endpoint}`, options);
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || 'خطأ في الاتصال');
                }

                return result;
            } catch (error) {
                showNotification(`❌ ${error.message}`, 'error');
                throw error;
            }
        }

        // ==========================================
        // تحميل الجولات
        // ==========================================

        async function loadRounds() {
            try {
                const result = await apiCall('/api/rounds');
                const rounds = result.rounds;

                // البحث عن جولة نشطة
                const activeRound = rounds.find(r => r.status === 'active');
                const waitingRound = rounds.find(r => r.status === 'waiting');

                if (activeRound) {
                    currentRoundId = activeRound.id;
                    loadRound(currentRoundId);
                } else if (waitingRound) {
                    currentRoundId = waitingRound.id;
                    loadRound(currentRoundId);
                } else {
                    showWaitingScreen(rounds);
                }
            } catch (error) {
                console.error('❌ فشل تحميل الجولات:', error);
            }
        }

        // ==========================================
        // تحميل جولة محددة
        // ==========================================

        async function loadRound(roundId) {
            try {
                const result = await apiCall(`/api/rounds/${roundId}`);
                const { round, players, votes, stats } = result;

                currentRoundId = roundId;
                renderGame(round, players, votes, stats);
                connectWebSocket(roundId);

                if (round.status === 'active') {
                    startTimer(round.end_time);
                }

            } catch (error) {
                console.error('❌ فشل تحميل الجولة:', error);
            }
        }

        // ==========================================
        // عرض واجهة اللعبة
        // ==========================================

        function renderGame(round, players, votes, stats) {
            const container = document.getElementById('gameContent');
            
            // التحقق من أن المستخدم مشترك
            const isPlayer = players.some(p => p.user_id === currentUserId);
            const isEliminated = players.some(p => p.user_id === currentUserId && p.is_eliminated);
            const isWinner = players.some(p => p.user_id === currentUserId && p.is_winner);
            const hasVoted = votes.some(v => v.voter_id === currentUserId);

            let html = `
                <div class="status-bar">
                    <div class="stat-item">
                        <div class="label">🏆 الجولة</div>
                        <div class="value">#${round.round_number}</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">💰 الجائزة</div>
                        <div class="value">${round.prize_amount} نقطة</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">👥 اللاعبين</div>
                        <div class="value">${stats.activePlayers}/${stats.totalPlayers}</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">📊 الحالة</div>
                        <div class="value">${getStatusText(round.status)}</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">⏱️ المدة</div>
                        <div class="value timer" id="timer">${round.duration_minutes}:00</div>
                    </div>
                </div>

                <div class="game-area">
                    <div class="players-panel">
                        <h2>👥 اللاعبون ${isWinner ? '🏆' : ''}</h2>
                        <div id="playersList">
                            ${players.map(player => `
                                <div class="player-card ${player.is_eliminated ? 'eliminated' : ''} ${player.is_winner ? 'winner' : ''}">
                                    <span class="name">
                                        ${player.is_winner ? '🏆 ' : ''}
                                        ${player.is_eliminated ? '❌ ' : ''}
                                        ${player.display_name || player.username || 'مجهول'}
                                        ${player.user_id === currentUserId ? ' (أنت)' : ''}
                                    </span>
                                    <span class="votes">${player.votes_received} صوت</span>
                                    ${!player.is_eliminated && !player.is_winner && round.status === 'active' && isPlayer && !hasVoted && player.user_id !== currentUserId ? `
                                        <button class="vote-btn" onclick="castVote(${player.user_id})">
                                            🗳️ صوت
                                        </button>
                                    ` : ''}
                                    ${hasVoted && player.user_id === currentUserId ? `
                                        <span style="color: #4CAF50;">✅</span>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="players-panel">
                        <h2>🎮 التحكم</h2>
                        <div id="controls">
                            ${renderControls(round, isPlayer, isEliminated, isWinner)}
                        </div>
                        <div id="gameInfo">
                            ${renderGameInfo(round, isPlayer, isEliminated, isWinner)}
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function getStatusText(status) {
            const statuses = {
                'waiting': '⏳ في الانتظار',
                'active': '🟢 نشطة',
                'ended': '✅ منتهية',
                'cancelled': '❌ ملغية'
            };
            return statuses[status] || status;
        }

        function renderControls(round, isPlayer, isEliminated, isWinner) {
            if (isWinner) {
                return `<p style="color: #ffd700; font-size: 1.2em;">🏆 مبروك! أنت الفائز!</p>`;
            }

            if (isEliminated) {
                return `<p style="color: #f44336;">❌ تم إقصاؤك من اللعبة</p>`;
            }

            if (round.status === 'waiting') {
                if (!isPlayer) {
                    return `
                        <button class="btn btn-success" onclick="joinRound(${round.id})">
                            🎯 اشترك الآن (${round.entry_fee} نقطة)
                        </button>
                        <p style="color: #aaa; margin-top: 10px;">المشتركين: ${round.current_round_players?.length || 0}/${round.max_players}</p>
                    `;
                } else {
                    return `<p style="color: #4CAF50;">✅ أنت مشترك - في انتظار بدء الجولة</p>`;
                }
            }

            if (round.status === 'active') {
                if (isPlayer) {
                    const hasVoted = window.hasVoted || false;
                    return `
                        <p style="color: #4CAF50;">✅ أنت مشترك في هذه الجولة</p>
                        ${hasVoted ? '<p style="color: #ffd700;">✅ لقد صوّت بالفعل</p>' : '<p style="color: #ff9800;">🗳️ صوّت لإقصاء لاعب!</p>'}
                    `;
                } else {
                    return `<p style="color: #f44336;">❌ أنت غير مشترك في هذه الجولة</p>`;
                }
            }

            if (round.status === 'ended') {
                return `<p style="color: #ffd700;">🏁 انتهت الجولة</p>`;
            }

            return '';
        }

        function renderGameInfo(round, isPlayer, isEliminated, isWinner) {
            if (round.status === 'ended') {
                if (round.winner_ids && round.winner_ids.length > 0) {
                    const winners = round.winner_ids.map(id => {
                        const player = window.playersList?.find(p => p.user_id === id);
                        return player ? player.display_name : id;
                    }).join(', ');
                    return `
                        <div style="margin-top: 20px; padding: 15px; background: rgba(255, 215, 0, 0.1); border-radius: 10px;">
                            <p style="color: #ffd700; font-size: 1.1em;">🏆 الفائزون: ${winners}</p>
                            <p style="color: #aaa;">💰 الجائزة: ${round.prize_amount} نقطة</p>
                        </div>
                    `;
                }
            }

            if (round.status === 'waiting') {
                return `
                    <div style="margin-top: 20px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 10px;">
                        <p style="color: #aaa;">📋 تفاصيل الجولة:</p>
                        <p>💳 رسوم الاشتراك: ${round.entry_fee} نقطة</p>
                        <p>💰 الجائزة: ${round.prize_amount} نقطة</p>
                        <p>👥 الحد الأقصى: ${round.max_players} لاعب</p>
                        <p>⏱️ المدة: ${round.duration_minutes} دقيقة</p>
                    </div>
                `;
            }

            return '';
        }

        // ==========================================
        // شاشة الانتظار
        // ==========================================

        function showWaitingScreen(rounds) {
            const container = document.getElementById('gameContent');
            
            let html = `
                <div style="text-align: center; padding: 50px;">
                    <h2 style="color: #ffd700;">🎯 لا توجد جولة نشطة</h2>
                    <p style="color: #aaa; margin: 20px 0;">
                        ${isAdmin ? 'يمكنك إنشاء جولة جديدة' : 'انتظر إنشاء جولة جديدة'}
                    </p>
            `;

            if (isAdmin) {
                html += `
                    <button class="btn btn-primary" onclick="showCreateRoundModal()">
                        🚀 إنشاء جولة جديدة
                    </button>
                `;
            }

            // عرض الجولات السابقة
            if (rounds && rounds.length > 0) {
                html += `
                    <div style="margin-top: 30px;">
                        <h3 style="color: #aaa;">📊 الجولات السابقة</h3>
                        <div style="margin-top: 15px;">
                            ${rounds.slice(0, 5).map(round => `
                                <div style="display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); margin-bottom: 5px; border-radius: 8px;">
                                    <span>جولة #${round.round_number}</span>
                                    <span style="color: ${round.status === 'ended' ? '#4CAF50' : '#ff9800'}">${getStatusText(round.status)}</span>
                                    <span>💰 ${round.prize_amount}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // ==========================================
        // دوال التفاعل
        // ==========================================

        async function joinRound(roundId) {
            try {
                const result = await apiCall(`/api/rounds/${roundId}/join`, 'POST', {
                    userId: currentUserId,
                    username: currentUsername,
                    displayName: currentUsername
                });

                showNotification('✅ تم الاشتراك في الجولة بنجاح!', 'success');
                loadRound(roundId);
            } catch (error) {
                console.error('❌ فشل الاشتراك:', error);
            }
        }

        async function castVote(targetId) {
            if (window.hasVoted) {
                showNotification('⚠️ لقد صوّت مسبقاً', 'error');
                return;
            }

            try {
                const result = await apiCall(`/api/rounds/${currentRoundId}/vote`, 'POST', {
                    voterId: currentUserId,
                    targetId: targetId
                });

                window.hasVoted = true;
                showNotification('✅ تم تسجيل صوتك بنجاح!', 'success');
                loadRound(currentRoundId);
            } catch (error) {
                console.error('❌ فشل التصويت:', error);
            }
        }

        async function startRound(roundId) {
            try {
                const result = await apiCall(`/api/rounds/${roundId}/start`, 'POST');
                showNotification('✅ تم بدء الجولة!', 'success');
                loadRound(roundId);
            } catch (error) {
                console.error('❌ فشل بدء الجولة:', error);
            }
        }

        async function endRound(roundId) {
            try {
                const result = await apiCall(`/api/rounds/${roundId}/end`, 'POST');
                showNotification('✅ تم إنهاء الجولة!', 'success');
                loadRound(roundId);
            } catch (error) {
                console.error('❌ فشل إنهاء الجولة:', error);
            }
        }

        // ==========================================
        // إدارة الجولات (للمسؤول)
        // ==========================================

        function showCreateRoundModal() {
            document.getElementById('createRoundModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('createRoundModal').classList.remove('active');
        }

        document.getElementById('createRoundForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const entryFee = parseFloat(document.getElementById('entryFee').value);
            const prizeAmount = parseFloat(document.getElementById('prizeAmount').value);
            const maxPlayers = parseInt(document.getElementById('maxPlayers').value);
            const durationMinutes = parseInt(document.getElementById('durationMinutes').value);
            const channelId = document.getElementById('channelId').value || null;

            try {
                const result = await apiCall('/api/rounds/create', 'POST', {
                    createdBy: currentUserId,
                    entryFee: entryFee,
                    prizeAmount: prizeAmount,
                    maxPlayers: maxPlayers,
                    durationMinutes: durationMinutes,
                    channelId: channelId,
                    isAdmin: true
                });

                showNotification('✅ تم إنشاء الجولة!', 'success');
                closeModal();
                loadRound(result.round.id);
            } catch (error) {
                console.error('❌ فشل إنشاء الجولة:', error);
            }
        });

        // ==========================================
        // WebSocket للاتصال المباشر
        // ==========================================

        function connectWebSocket(roundId) {
            if (ws) {
                ws.close();
            }

            const wsUrl = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/?roundId=${roundId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('✅ متصل بالـ WebSocket');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };

            ws.onerror = (error) => {
                console.error('❌ خطأ في WebSocket:', error);
            };

            ws.onclose = () => {
                console.log('❌ تم قطع الاتصال بـ WebSocket');
                // إعادة المحاولة بعد 5 ثواني
                setTimeout(() => connectWebSocket(roundId), 5000);
            };
        }

        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'round_started':
                    showNotification('🎮 بدأت الجولة!', 'info');
                    loadRound(currentRoundId);
                    break;

                case 'player_joined':
                    showNotification(`👤 ${data.player.display_name} انضم للجولة`, 'info');
                    loadRound(currentRoundId);
                    break;

                case 'vote_cast':
                    showNotification('🗳️ تم تسجيل صوت جديد', 'info');
                    loadRound(currentRoundId);
                    break;

                case 'round_ended':
                    showNotification(`📊 انتهت الجولة! تم إقصاء ${data.eliminated.length} لاعب`, 'info');
                    loadRound(currentRoundId);
                    break;

                case 'game_ended':
                    showNotification(`🏆 انتهت اللعبة! الفائزون: ${data.winners.map(w => w.display_name).join(', ')}`, 'success');
                    loadRound(currentRoundId);
                    break;

                default:
                    console.log('📨 رسالة غير معروفة:', data);
            }
        }

        // ==========================================
        // المؤقت
        // ==========================================

        function startTimer(endTime) {
            const timerElement = document.getElementById('timer');
            if (!timerElement) return;

            const end = new Date(endTime);

            const updateTimer = () => {
                const now = new Date();
                const diff = end - now;

                if (diff <= 0) {
                    timerElement.textContent = '⏰ انتهى';
                    timerElement.classList.add('warning');
                    return;
                }

                const minutes = Math.floor(diff / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

                if (minutes < 1) {
                    timerElement.classList.add('warning');
                }
            };

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        // ==========================================
        // الإشعارات
        // ==========================================

        function showNotification(message, type = 'info') {
            const container = document.getElementById('notifications');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;

            container.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => notification.remove(), 300);
            }, 5000);
        }

        // ==========================================
        // تحديث تلقائي للجولة النشطة
        // ==========================================

        setInterval(() => {
            if (currentRoundId) {
                // تحديث البيانات كل 30 ثانية
                fetch(`${API_URL}/api/rounds/${currentRoundId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            // تحديث الواجهة فقط إذا تغيرت البيانات
                            const { round, players, votes, stats } = data;
                            const currentPlayers = document.querySelectorAll('.player-card').length;
                            if (currentPlayers !== players.length) {
                                loadRound(currentRoundId);
                            }
                        }
                    })
                    .catch(err => console.error('❌ فشل تحديث البيانات:', err));
            }
        }, 30000);
    </script>
</body>
</html>
