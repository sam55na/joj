<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FOOTBALL - منصة الإحصائيات الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 8s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

    <div id="initialSplashLoader" class="fixed inset-0 bg-gray-950 z-[9999] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative flex items-center justify-center mb-6">
            <div class="animate-spin rounded-full h-28 w-28 border-4 border-t-green-500 border-r-transparent border-b-gray-800 border-l-transparent"></div>
            <i class="fa-solid fa-futbol text-4xl text-green-400 absolute animate-bounce"></i>
        </div>
        <h2 class="text-3xl font-black text-white tracking-widest mb-2">AI FOOTBALL</h2>
        <p id="loaderStatusText" class="text-gray-400 text-sm animate-pulse px-6 text-center">جاري الاتصال بالخادم والتحقق من الاستجابة الحية...</p>
        
        <div id="coldStartWarning" class="hidden mt-8 max-w-sm bg-gray-900/60 border border-amber-500/20 rounded-2xl p-4 text-center mx-4">
            <p class="text-xs text-amber-400"><i class="fa-solid fa-triangle-exclamation ml-1"></i> ملحوظة: الخادم يستغرق حوالي 30 ثانية للاستيقاظ في أول زيارة على استضافة Render المجانية.</p>
        </div>
    </div>

    <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-green-500 tracking-wider">
                <i class="fa-solid fa-futbol text-xl ml-2 animate-spin-slow"></i>AI FOOTBALL
            </h1>
            <span class="text-sm bg-gray-800 px-3 py-1.5 rounded-full text-gray-400 border border-gray-700">
                الحالة: <span id="serverStatusBadge" class="text-amber-400 font-bold">جاري الفحص...</span>
            </span>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-6xl">
        
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
            <button onclick="fetchTodayMatches()" class="flex items-center justify-center gap-3 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-500 hover:to-green-600 p-5 rounded-2xl shadow-lg font-bold text-lg transition-all transform hover:-translate-y-1">
                <i class="fa-solid fa-calendar-day text-xl"></i> مباريات اليوم الذكية
            </button>
            
            <div class="flex bg-gray-900 p-3 rounded-2xl border border-gray-800 shadow-md">
                <input type="text" id="teamInput" placeholder="أدخل اسم أي فريق (مثال: ريال مدريد)..." class="bg-transparent text-white placeholder-gray-500 w-full px-4 focus:outline-none">
                <button onclick="fetchTeamStats()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-xl font-bold transition-colors whitespace-nowrap">
                    <i class="fa-solid fa-chart-simple ml-1"></i> إحصائيات الفريق
                </button>
            </div>

            <button onclick="fetchLiveUpdate()" class="flex items-center justify-center gap-3 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 p-5 rounded-2xl shadow-lg font-bold text-lg transition-all transform hover:-translate-y-1 relative overflow-hidden group">
                <i class="fa-solid fa-satellite-dish text-xl animate-bounce"></i> تحديث حي ولحظي (AI Live)
                <span id="liveBtnSpinner" class="hidden absolute right-4 animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
            </button>
        </section>

        <section id="outputArea">
            </section>

    </main>

    <script>
        // 🛠️ استبدل هذا الرابط برابط ريندر الخاص بك بعد رفع الخادم بنجاح
        // مثال: const BACKEND_BASE_URL = "https://joj-d0kl.onrender.com";
        const BACKEND_BASE_URL = "https://joj-d0kl.onrender.com"; 
        
        const API_URL = `${BACKEND_BASE_URL}/api/football`;
        const HEALTH_URL = `${BACKEND_BASE_URL}/api/health`;

        // 🧠 دالة الفحص الذكي والتحقق التام من الخادم
        async function verifyServerConnectivity() {
            const statusText = document.getElementById('loaderStatusText');
            const warningBox = document.getElementById('coldStartWarning');
            
            // إذا مرّت 4 ثوانٍ ولم يستجب الخادم، نقوم بإظهار تنبيه الـ Cold Start للمستخدم
            const coldStartTimer = setTimeout(() => {
                warningBox.classList.remove('hidden');
                statusText.innerText = "الخادم يقوم بتحميل ملفاته البرمجية الآن على Render، يرجى الصبر ثوانٍ إضافية...";
            }, 4000);

            try {
                const response = await fetch(HEALTH_URL);
                const data = await response.json();
                
                if(data.status === "healthy") {
                    clearTimeout(coldStartTimer);
                    
                    // إخفاء شاشة اللودينغ بتأثير تلاشي ناعم
                    const splash = document.getElementById('initialSplashLoader');
                    splash.classList.add('opacity-0');
                    setTimeout(() => { splash.style.display = 'none'; }, 500);
                    
                    // تحديث شارة الحالة في الهيدر
                    document.getElementById('serverStatusBadge').innerText = "مستقر ومتصل";
                    document.getElementById('serverStatusBadge').className = "text-green-400 font-bold";
                    
                    // جلب مباريات اليوم تلقائياً كتحية ترحيبية عند فتح الموقع لأول مرة
                    fetchTodayMatches();
                }
            } catch (err) {
                console.warn("تعذر الاتصال، الخادم يستيقظ حالياً... جاري إعادة المحاولة خلال 3 ثوانٍ.");
                statusText.innerText = "جاري إعادة فحص النبضات وإيقاظ الخادم...";
                // إعادة المحاولة بشكل دوري كل 3 ثوانٍ حتى ينجح الربط تماماً
                setTimeout(verifyServerConnectivity, 3000);
            }
        }

        // إطلاق الفحص فور جاهزية مستندات الـ DOM
        window.addEventListener('DOMContentLoaded', verifyServerConnectivity);

        // 1. جلب مباريات اليوم
        async function fetchTodayMatches() {
            showInnerLoading();
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'today_matches' })
                });
                const data = await response.json();
                
                let html = `<h2 class="text-xl font-bold mb-6 text-green-400"><i class="fa-solid fa-circle text-xs text-red-500 animate-pulse ml-2"></i>جدول مباريات اليوم المحلل ذكياً</h2>`;
                html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                
                data.matches.forEach(match => {
                    html += `
                        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 hover:border-gray-700 transition-all shadow-md">
                            <div class="flex justify-between text-xs text-gray-400 mb-3 bg-gray-950 p-2 rounded-lg">
                                <span><i class="fa-solid fa-trophy text-amber-500 ml-1"></i> ${match.tournament}</span>
                                <span class="text-green-500 font-semibold">${match.liveStatus}</span>
                            </div>
                            <div class="flex items-center justify-between text-center py-3">
                                <div class="w-2/5 font-bold text-base md:text-lg">${match.homeTeam}</div>
                                <div class="w-1/5 bg-gray-950 px-3 py-1.5 rounded-xl border border-gray-800 text-sm font-mono text-yellow-400">
                                    ${match.score.home} - ${match.score.away}
                                </div>
                                <div class="w-2/5 font-bold text-base md:text-lg">${match.awayTeam}</div>
                            </div>
                            <div class="text-center mt-3 text-xs text-gray-500 border-t border-gray-800/50 pt-3">
                                <i class="fa-regular fa-clock ml-1"></i> توقيت المباراة: ${match.time}
                            </div>
                        </div>`;
                });
                html += `</div>`;
                document.getElementById('outputArea').innerHTML = html;
            } catch (err) {
                showInnerError();
            }
        }

        // 2. جلب إحصائيات الفريق
        async function fetchTeamStats() {
            const teamName = document.getElementById('teamInput').value.trim();
            if (!teamName) {
                alert("من فضلك اكتب اسم الفريق أولاً!");
                return;
            }
            showInnerLoading();
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'team_stats', team: teamName })
                });
                const data = await response.json();
                
                let html = `
                    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 md:p-8 max-w-3xl mx-auto shadow-2xl">
                        <div class="flex items-center justify-between border-b border-gray-800 pb-4 mb-6">
                            <div>
                                <h2 class="text-2xl font-black text-blue-400">${data.teamName}</h2>
                                <p class="text-gray-400 text-sm mt-1">${data.league} • ترتيبه الحالي: <span class="text-yellow-400 font-bold">#${data.rank}</span></p>
                            </div>
                            <i class="fa-solid fa-shield-halved text-4xl text-gray-700"></i>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center mb-6">
                            <div class="bg-gray-950 p-4 rounded-xl border border-gray-800/80">
                                <span class="block text-xs text-gray-400 mb-1">المباريات</span>
                                <span class="text-xl font-bold font-mono">${data.matchesPlayed}</span>
                            </div>
                            <div class="bg-emerald-950/30 p-4 rounded-xl border border-emerald-900/50">
                                <span class="block text-xs text-emerald-400 mb-1">فوز</span>
                                <span class="text-xl font-bold font-mono text-emerald-400">${data.wins}</span>
                            </div>
                            <div class="bg-amber-950/30 p-4 rounded-xl border border-amber-900/50">
                                <span class="block text-xs text-amber-400 mb-1">تعادل</span>
                                <span class="text-xl font-bold font-mono text-amber-400">${data.draws}</span>
                            </div>
                            <div class="bg-rose-950/30 p-4 rounded-xl border border-rose-900/50">
                                <span class="block text-xs text-rose-400 mb-1">خسارة</span>
                                <span class="text-xl font-bold font-mono text-rose-400">${data.losses}</span>
                            </div>
                        </div>
                        <div class="space-y-3 bg-gray-950 p-4 rounded-2xl border border-gray-800">
                            <div class="flex justify-between text-sm"><span class="text-gray-400">هداف الفريق الحالي:</span> <span class="font-bold text-blue-400">${data.topScorer}</span></div>
                            <div class="flex justify-between text-sm"><span class="text-gray-400">الأهداف المسجلة:</span> <span class="font-bold text-green-400 font-mono">+${data.goalsScored}</span></div>
                            <div class="flex justify-between text-sm"><span class="text-gray-400">الأهداف المستقبلة:</span> <span class="font-bold text-red-400 font-mono">-${data.goalsConceded}</span></div>
                        </div>
                    </div>`;
                document.getElementById('outputArea').innerHTML = html;
            } catch (err) {
                showInnerError();
            }
        }

        // 3. التحديث الحي والمباشر
        async function fetchLiveUpdate() {
            document.getElementById('liveBtnSpinner').classList.remove('hidden');
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'live_update' })
                });
                const data = await response.json();
                
                let html = `
                    <div class="bg-gray-900 border border-red-900/40 rounded-3xl p-6 max-w-2xl mx-auto shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 left-0 h-1 bg-gradient-to-r from-red-600 to-amber-500 animate-pulse"></div>
                        <div class="flex justify-between items-center mb-6">
                            <span class="bg-red-600 text-white text-xs px-2.5 py-1 rounded-full font-bold animate-pulse"><i class="fa-solid fa-circle text-[8px] ml-1"></i> مباشر</span>
                            <span class="text-sm font-mono font-bold text-yellow-400 bg-gray-950 px-3 py-1 rounded-lg border border-gray-800">الدقيقة: ${data.minute}'</span>
                        </div>
                        <div class="flex items-center justify-between text-center mb-8">
                            <div class="w-2/5 font-black text-xl">${data.homeTeam}</div>
                            <div class="w-1/5 text-3xl font-mono font-black text-red-500 bg-gray-950 py-2 rounded-2xl border border-gray-800">${data.score.home} - ${data.score.away}</div>
                            <div class="w-2/5 font-black text-xl">${data.awayTeam}</div>
                        </div>
                        <div class="space-y-4 bg-gray-950 p-5 rounded-2xl border border-gray-800">
                            <h3 class="text-xs font-bold text-gray-500 text-center mb-2">إحصائيات فورية عبر الـ AI</h3>
                            <div>
                                <div class="flex justify-between text-xs mb-1 font-mono"><span>%${data.possession.home}</span> <span class="text-gray-400 font-sans">الاستحواذ</span> <span>%${data.possession.away}</span></div>
                                <div class="w-full bg-gray-800 h-2 rounded-full flex overflow-hidden">
                                    <div class="bg-red-500 h-full" style="width: ${data.possession.home}%"></div>
                                    <div class="bg-gray-600 h-full" style="width: ${data.possession.away}%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-xs mb-1 font-mono"><span>${data.shotsOnTarget.home}</span> <span class="text-gray-400 font-sans">التسديدات على المرمى</span> <span>${data.shotsOnTarget.away}</span></div>
                                <div class="w-full bg-gray-800 h-2 rounded-full flex overflow-hidden">
                                    <div class="bg-amber-500 h-full" style="width: ${(data.shotsOnTarget.home/(data.shotsOnTarget.home+data.shotsOnTarget.away || 1))*100}%"></div>
                                    <div class="bg-gray-600 h-full" style="width: ${(data.shotsOnTarget.away/(data.shotsOnTarget.home+data.shotsOnTarget.away || 1))*100}%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 bg-gray-950/60 p-3 rounded-xl border border-gray-800/80 text-sm text-center text-gray-300">
                            <span class="text-red-400 font-bold">آخر حدث:</span> ${data.lastEvent}
                        </div>
                        <div class="mt-6 text-center">
                            <button onclick="fetchLiveUpdate()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-4 py-2 rounded-xl transition-colors border border-gray-700">
                                <i class="fa-solid fa-rotate ml-1"></i> تحديث البيانات الحية الآن
                            </button>
                        </div>
                    </div>`;
                document.getElementById('outputArea').innerHTML = html;
            } catch (err) {
                showInnerError();
            } finally {
                document.getElementById('liveBtnSpinner').classList.add('hidden');
            }
        }

        function showInnerLoading() {
            document.getElementById('outputArea').innerHTML = `
                <div class="flex flex-col items-center justify-center py-20">
                    <div class="animate-spin rounded-full h-12 w-12 border-4 border-green-500 border-t-transparent mb-4"></div>
                    <p class="text-gray-400 text-sm animate-pulse">جاري معالجة طلبك عبر الذكاء الاصطناعي...</p>
                </div>`;
        }

        function showInnerError() {
            document.getElementById('outputArea').innerHTML = `
                <div class="text-center py-16 text-rose-500">
                    <i class="fa-solid fa-circle-exclamation text-5xl mb-3"></i>
                    <p class="text-lg font-bold">فشل جلب البيانات!</p>
                    <p class="text-xs text-gray-500 mt-1">تأكد من استقرار الخادم أو تفقّد سجلات الأخطاء (Logs) في Render.</p>
                </div>`;
        }
    </script>
</body>
</html>
