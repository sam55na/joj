<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎡 عجلة الحظ</title>
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== إعادة ضبط ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow-x: hidden;
            padding: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* خلفية ثابتة */
        .bg-image-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-image-fixed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: slowZoom 30s ease-in-out infinite alternate;
        }
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* ===== النص العلوي ===== */
        .banner-text {
            text-align: center;
            padding: 10px 12px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 520px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            font-size: 20px;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 0.5px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 1;
        }

        /* ===== حالة المستخدم (مخفية) ===== */
        .user-status {
            display: none;
        }

        /* ===== تأثير النيون والموجات المغناطيسية ===== */
        .neon-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            z-index: 1;
        }

        /* إطار النيون الدوار */
        .neon-frame {
            position: absolute;
            width: 95%;
            height: 95%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #FFD700;
            border-bottom-color: #FFD700;
            box-shadow: 0 0 15px #FFD700, inset 0 0 15px #FFD700;
            animation: neonRotate 8s linear infinite;
            pointer-events: none;
            z-index: 2;
        }

        .neon-frame::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-left-color: #FF8C00;
            border-right-color: #FF8C00;
            filter: blur(2px);
            animation: neonRotate 12s linear infinite reverse;
        }

        @keyframes neonRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* الموجات المغناطيسية */
        .magnetic-waves {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .wave {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80%;
            height: 80%;
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(1);
            opacity: 0;
            animation: magneticWaveEffect 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        }

        .wave:nth-child(2) { animation-delay: 1s; }
        .wave:nth-child(3) { animation-delay: 2s; }
        .wave:nth-child(4) { animation-delay: 3s; }

        @keyframes magneticWaveEffect {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
                border-width: 2px;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.4);
                opacity: 0;
                border-width: 0.5px;
                filter: blur(4px);
            }
        }

        /* ===== العجلة ===== */
        .wheel-wrapper {
            position: relative;
            width: 88%;
            aspect-ratio: 1/1;
            display: none;
            z-index: 3;
        }
        .wheel-wrapper.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        .wheel-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.03), inset 0 0 60px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.1);
            transition: filter 0.4s ease;
            display: block;
        }
        .wheel-wrapper canvas.spinning {
            filter: brightness(1.1) drop-shadow(0 0 30px rgba(255, 215, 0, 0.2));
        }

        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 32px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.25));
            animation: pointerBounce 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pointerBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== لا توجد جوائز ===== */
        .no-prizes {
            display: none;
            text-align: center;
            padding: 30px 16px;
            color: #555;
            font-size: 15px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 16px;
            backdrop-filter: blur(6px);
            max-width: 420px;
            margin: 0 auto;
            z-index: 1;
        }

        /* ===== الأزرار ===== */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .btn {
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
        }
        .btn-spin {
            background: linear-gradient(135deg, #B8860B, #FFD700);
            color: #0a0a0a;
            box-shadow: 0 4px 30px rgba(255, 215, 0, 0.1);
            font-size: 19px;
        }
        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(255, 215, 0, 0.2);
        }
        .btn-spin:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .btn-spin .spinner-small {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(10, 10, 10, 0.15);
            border-top: 2px solid #0a0a0a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        .btn-spin.loading .spinner-small {
            display: inline-block;
        }

        /* ===== زر البدء ===== */
        .btn-start {
            background: linear-gradient(135deg, #00FF88, #00CC6A);
            color: #0a0a0a;
            box-shadow: 0 4px 30px rgba(0, 255, 136, 0.2);
            font-size: 18px;
            animation: startPulse 2s ease-in-out infinite;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(0, 255, 136, 0.3);
        }
        @keyframes startPulse {
            0%, 100% { box-shadow: 0 4px 30px rgba(0, 255, 136, 0.2); }
            50% { box-shadow: 0 4px 40px rgba(0, 255, 136, 0.4); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== شرط الإيداع ===== */
        .deposit-notice {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .deposit-notice.show { display: block; }
        .deposit-notice .notice-text { color: #FF8C00; font-size: 14px; }
        .deposit-notice .notice-text .amount { color: #FFD700; font-weight: 700; }
        .deposit-notice .notice-status { font-size: 13px; margin-top: 4px; color: #666; }
        .deposit-notice .notice-status .met { color: #00FF88; }
        .deposit-notice .notice-status .not-met { color: #FF4444; }

        /* ===== النتيجة ===== */
        .result-box {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 18px;
            padding: 18px 14px;
            margin-top: 14px;
            text-align: center;
            display: none;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
        }
        .result-box.show {
            display: block;
            animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes resultPop {
            0% { transform: scale(0.85) rotate(-2deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .result-box.winner {
            border-color: rgba(255, 215, 0, 0.25);
            background: rgba(255, 215, 0, 0.08);
            animation: winGlow 1.5s ease-in-out infinite alternate;
        }
        @keyframes winGlow {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.04); }
            100% { box-shadow: 0 0 80px rgba(255, 215, 0, 0.12); }
        }
        .result-box .confetti-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden;
        }
        .result-box .confetti {
            position: absolute;
            width: 12px; height: 12px; opacity: 0;
            animation: confettiFall 2.2s ease-in forwards;
        }
        @keyframes confettiFall {
            0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(1); }
            100% { opacity: 0; transform: translateY(220px) rotate(720deg) scale(0); }
        }

        .result-box .prize-icon, .result-box .prize-name { display: none; }
        .result-box .prize-desc {
            color: #FFD700;
            font-size: 24px;
            font-weight: 700;
            margin-top: 4px;
            padding: 6px 0;
        }
        .result-box.winner .prize-desc {
            background: linear-gradient(135deg, #FFD700, #FF6B00, #FFD700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 1.5s ease-in-out infinite;
            font-size: 28px;
        }
        @keyframes goldShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== رسائل الخطأ ===== */
        .error-msg {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 0, 0, 0.06);
            border-radius: 12px;
            padding: 10px;
            color: #FF6B6B;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .error-msg.show { display: block; animation: fadeIn 0.3s ease; }

        /* ===== شاشة اللودينغ ===== */
        .loading-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            background: #0a0a0a;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .loading-screen.active { display: flex; animation: fadeIn 0.3s ease; }
        .loading-screen .loading-image {
            width: 70vw; max-width: 280px; aspect-ratio: 1/1;
            border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255, 215, 0, 0.08);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.04);
            animation: loadingPulse 2s ease-in-out infinite;
            margin-bottom: 28px;
        }
        @keyframes loadingPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.85; }
        }
        .loading-screen .progress-container { width: 60%; max-width: 220px; position: relative; }
        .loading-screen .progress-bar-bg { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.04); border-radius: 4px; overflow: hidden; }
        .loading-screen .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #FFD700, #FF8C00); border-radius: 4px; transition: width 0.3s ease; }
        .loading-screen .progress-text { color: #888; font-size: 14px; margin-top: 12px; text-align: center; font-weight: 600; letter-spacing: 1px; }

        /* ===== إعدادات الصوت ===== */
        .sound-settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            padding: 6px 16px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .sound-settings label { color: #666; font-size: 12px; display: flex; align-items: center; cursor: pointer; }
        .sound-settings input[type="checkbox"] { accent-color: #FFD700; width: 16px; height: 16px; cursor: pointer; }
        .sound-settings .sound-indicator { color: #FFD700; font-size: 14px; margin-left: 5px; }

        /* ===== لوحة الإدارة ===== */
        .admin-panel {
            display: none;
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.07);
            border-radius: 20px;
            padding: 16px;
            margin-top: 14px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(6px);
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .admin-panel.show { display: block; animation: fadeIn 0.4s ease; }
        .admin-panel .panel-title { color: #FFD700; font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .admin-panel .panel-title .badge { background: #FFD700; color: #0a0a0a; font-size: 9px; padding: 2px 12px; border-radius: 20px; font-weight: 700; }
        .admin-panel .prize-item { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .admin-panel .prize-item .prize-icon-small { font-size: 22px; width: 34px; text-align: center; }
        .admin-panel .prize-item .prize-info { flex: 1; min-width: 90px; }
        .admin-panel .prize-item .prize-info .name-input { background: transparent; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 4px; color: #fff; font-size: 12px; font-weight: 600; padding: 2px 6px; width: 100%; transition: border-color 0.3s; }
        .admin-panel .prize-item .prize-info .name-input:focus { outline: none; border-color: #FFD700; }
        .admin-panel .prize-item .prize-info .desc-input { background: transparent; border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 4px; color: #666; font-size: 10px; padding: 2px 6px; width: 100%; margin-top: 2px; }
        .admin-panel .prize-item .prize-info .desc-input:focus { outline: none; border-color: rgba(255, 215, 0, 0.3); }
        .admin-panel .prize-item .prize-prob { display: flex; align-items: center; gap: 3px; }
        .admin-panel .prize-item .prize-prob .prob-input { width: 44px; padding: 3px 4px; border-radius: 4px; border: 1px solid rgba(255, 215, 0, 0.1); background: rgba(0, 0, 0, 0.3); color: #FFD700; font-size: 11px; text-align: center; }
        .admin-panel .prize-item .prize-prob .prob-input:focus { outline: none; border-color: #FFD700; }
        .admin-panel .prize-item .prize-prob .prob-label { color: #555; font-size: 9px; }
        .admin-panel .prize-item .prize-prob .btn-save-prob { padding: 2px 8px; background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.1); border-radius: 4px; color: #FFD700; font-size: 9px; cursor: pointer; transition: all 0.3s; }
        .admin-panel .prize-item .prize-prob .btn-save-prob:hover { background: rgba(255, 215, 0, 0.2); }
        .admin-panel .prize-item .prize-colors { display: flex; gap: 3px; }
        .admin-panel .prize-item .prize-colors input[type="color"] { width: 26px; height: 26px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; padding: 2px; background: transparent; cursor: pointer; }
        .admin-panel .prize-item .prize-colors input[type="color"]:hover { border-color: #FFD700; }
        .admin-panel .prize-item .btn-delete { background: rgba(255, 0, 0, 0.08); border: none; color: #FF4444; padding: 2px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.3s; }
        .admin-panel .prize-item .btn-delete:hover { background: rgba(255, 0, 0, 0.2); transform: scale(1.05); }
        .admin-panel .add-prize-form { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
        .admin-panel .add-prize-form input { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255, 215, 0, 0.1); background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 11px; min-width: 50px; }
        .admin-panel .add-prize-form input:focus { outline: none; border-color: #FFD700; }
        .admin-panel .add-prize-form input::placeholder { color: #555; }
        .admin-panel .add-prize-form .btn-add { padding: 6px 16px; background: linear-gradient(135deg, #B8860B, #FFD700); border: none; border-radius: 6px; color: #0a0a0a; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.3s; }
        .admin-panel .add-prize-form .btn-add:hover { transform: scale(1.05); }
        .admin-panel .add-prize-form .btn-add:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .admin-panel .panel-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .admin-panel .panel-actions .btn-action { padding: 5px 14px; border: 1px solid rgba(255, 215, 0, 0.1); border-radius: 6px; background: rgba(255, 255, 255, 0.02); color: #FFD700; font-size: 10px; cursor: pointer; transition: all 0.3s; }
        .admin-panel .panel-actions .btn-action:hover { background: rgba(255, 215, 0, 0.05); border-color: #FFD700; }
        .admin-panel .panel-actions .btn-action.danger { color: #FF4444; border-color: rgba(255, 0, 0, 0.1); }
        .admin-panel .panel-actions .btn-action.danger:hover { background: rgba(255, 0, 0, 0.05); border-color: #FF4444; }
        .admin-panel .settings-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.04); }
        .admin-panel .settings-section .setting-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .admin-panel .settings-section .setting-row label { color: #888; font-size: 11px; min-width: 70px; }
        .admin-panel .settings-section .setting-row input, .admin-panel .settings-section .setting-row textarea { flex: 1; padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255, 215, 0, 0.1); background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 11px; min-width: 60px; }
        .admin-panel .settings-section .setting-row input:focus, .admin-panel .settings-section .setting-row textarea:focus { outline: none; border-color: #FFD700; }
        .admin-panel .settings-section .setting-row .btn-save { padding: 4px 14px; background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 4px; color: #FFD700; font-size: 10px; cursor: pointer; transition: all 0.3s; white-space: nowrap; }
        .admin-panel .settings-section .setting-row .btn-save:hover { background: rgba(255, 215, 0, 0.2); }
        .admin-panel .settings-section .setting-row .btn-save.saved { background: rgba(0, 255, 100, 0.1); border-color: rgba(0, 255, 100, 0.2); color: #00FF88; }
        .admin-panel .settings-section .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .admin-panel .settings-section .toggle-row label { color: #888; font-size: 11px; min-width: 70px; }
        .admin-panel .settings-section .toggle-row input[type="checkbox"] { accent-color: #FFD700; width: 16px; height: 16px; cursor: pointer; }
        .admin-panel .settings-section .toggle-row .btn-save { padding: 4px 14px; background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 4px; color: #FFD700; font-size: 10px; cursor: pointer; transition: all 0.3s; }
        .admin-panel .settings-section .toggle-row .btn-save:hover { background: rgba(255, 215, 0, 0.2); }
        .admin-panel .settings-section .toggle-row .btn-save.saved { background: rgba(0, 255, 100, 0.1); border-color: rgba(0, 255, 100, 0.2); color: #00FF88; }

        /* ===== خطأ أولي ===== */
        .error-container {
            display: none;
            text-align: center;
            padding: 30px 16px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 20px;
            backdrop-filter: blur(6px);
            max-width: 420px;
            margin: 0 auto;
            z-index: 1;
            position: relative;
        }
        .error-container.show { display: block; animation: fadeIn 0.5s ease; }
        .error-container .error-icon { font-size: 44px; margin-bottom: 10px; }

    <script>
        const API_BASE = 'https://joj-d0kl.onrender.com';
        const ADMIN_ID = 7011476249;
        let USER_ID = null;
        let isSpinning = false;
        let prizesCache = [];
        let currentRotation = 0;
        let soundEnabled = true;
        let settingsCache = {};
        let spinDuration = 3500;
        let startAudioUrl = ''; // رابط الصوت الترحيبي

        // ================================================================
        //                      نظام الصوت المحسّن
        // ================================================================
        class EnhancedSoundManager {
            constructor() {
                this.initialized = false;
                this.audioContext = null;
                this.isPlaying = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.warn('Web Audio not supported');
                }
            }

            stopAll() {
                if (this.audioContext) {
                    try {
                        this.audioContext.close();
                        this.audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {}
                }
                this.isPlaying = false;
            }

            // صوت الدوران - تأثير ديناميكي جميل
            playSpinSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    
                    // تأثير صعود سريع للتردد
                    for (let i = 0; i < 8; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        
                        const startFreq = 200 + i * 80;
                        const endFreq = 600 + i * 150;
                        
                        osc.frequency.setValueAtTime(startFreq, now + i * 0.05);
                        osc.frequency.exponentialRampToValueAtTime(endFreq, now + i * 0.05 + 0.15);
                        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                        
                        gain.gain.setValueAtTime(0.08, now + i * 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.15);
                        
                        osc.start(now + i * 0.05);
                        osc.stop(now + i * 0.05 + 0.15);
                    }
                } catch (e) {
                    console.warn('Spin sound error:', e);
                }
            }

            // صوت الربح - نغمات عالية وفرحة
            playWinSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    
                    // نغمات الربح - تصعيد تدريجي
                    const winMelody = [
                        { freq: 523, dur: 0.15 },   // C5
                        { freq: 659, dur: 0.15 },   // E5
                        { freq: 784, dur: 0.15 },   // G5
                        { freq: 1047, dur: 0.3 },   // C6 - نغمة عالية
                        { freq: 1319, dur: 0.3 },   // E6 - أعلى
                        { freq: 1568, dur: 0.5 }    // G6 - الأعلى
                    ];
                    
                    let totalTime = 0;
                    winMelody.forEach(({ freq, dur }, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        
                        osc.frequency.setValueAtTime(freq, now + totalTime);
                        osc.type = 'sine';
                        
                        gain.gain.setValueAtTime(0.15, now + totalTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + totalTime + dur);
                        
                        osc.start(now + totalTime);
                        osc.stop(now + totalTime + dur);
                        
                        totalTime += dur + 0.05;
                    });
                    
                    // تأثير إضافي - جرس عالي
                    setTimeout(() => {
                        if (!this.initialized) return;
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        
                        osc.frequency.setValueAtTime(2093, now + totalTime);
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.1, now + totalTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + totalTime + 0.3);
                        
                        osc.start(now + totalTime);
                        osc.stop(now + totalTime + 0.3);
                    }, 100);
                } catch (e) {
                    console.warn('Win sound error:', e);
                }
            }

            // صوت الخسارة - نغمات منخفضة حزينة
            playLoseSound() {
                if (!soundEnabled || !this.initialized) return;
                try {
                    const ctx = this.audioContext;
                    const now = ctx.currentTime;
                    
                    // نغمات الخسارة - تنزيل تدريجي
                    const loseMelody = [
                        { freq: 349, dur: 0.2 },    // F4
                        { freq: 330, dur: 0.2 },    // E4
                        { freq: 294, dur: 0.2 },    // D4
                        { freq: 262, dur: 0.4 }     // C4 - نغمة منخفضة
                    ];
                    
                    let totalTime = 0;
                    loseMelody.forEach(({ freq, dur }, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        
                        osc.frequency.setValueAtTime(freq, now + totalTime);
                        osc.type = 'sine';
                        
                        gain.gain.setValueAtTime(0.12, now + totalTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + totalTime + dur);
                        
                        osc.start(now + totalTime);
                        osc.stop(now + totalTime + dur);
                        
                        totalTime += dur + 0.05;
                    });
                } catch (e) {
                    console.warn('Lose sound error:', e);
                }
            }

            // تشغيل المقطع الصوتي الترحيبي من رابط خارجي
            playStartAudio(audioUrl) {
                if (!soundEnabled || !audioUrl) return;
                try {
                    const audio = new Audio(audioUrl);
                    audio.volume = 0.7;
                    audio.play().catch(e => console.warn('Start audio error:', e));
                } catch (e) {
                    console.warn('Audio playback error:', e);
                }
            }
        }

        const soundManager = new EnhancedSoundManager();

        function getUserId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('user_id') || params.get('userId') || params.get('id');
            if (id && !isNaN(id)) { USER_ID = parseInt(id); localStorage.setItem('wheel_user_id', USER_ID); return USER_ID; }
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const user = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (user && user.id) { USER_ID = user.id; localStorage.setItem('wheel_user_id', USER_ID); return USER_ID; }
                }
            } catch (e) {}
            id = localStorage.getItem('wheel_user_id');
            if (id) { USER_ID = parseInt(id); return USER_ID; }
            return null;
        }

        function drawWheel(prizes, highlightIndex = -1, rotation = 0) {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const cx = w / 2, cy = h / 2;
            const r = Math.min(w, h) / 2 - 12;
            const noPrizes = document.getElementById('noPrizes');
            const wrapper = document.getElementById('wheelWrapper');
            const neonWrapper = document.getElementById('neonWrapper');

            if (!prizes || prizes.length === 0) {
                noPrizes.style.display = 'block';
                wrapper.classList.remove('show');
                neonWrapper.style.display = 'none';
                return;
            }

            noPrizes.style.display = 'none';
            neonWrapper.style.display = 'flex';
            wrapper.classList.add('show');
            ctx.clearRect(0, 0, w, h);

            const total = prizes.length;
            const step = (2 * Math.PI) / total;

            prizes.forEach((p, i) => {
                const start = i * step + rotation - Math.PI / 2;
                const end = start + step;
                const isHighlight = (i === highlightIndex);

                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, end); ctx.closePath();

                const color1 = p.color || '#1a1a2e'; const color2 = p.color2 || '#16213e';
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                if (isHighlight) { grad.addColorStop(0, '#FFD700'); grad.addColorStop(0.5, '#FF8C00'); grad.addColorStop(1, '#B8860B'); }
                else { grad.addColorStop(0, color1); grad.addColorStop(1, color2); }
                ctx.fillStyle = grad; ctx.fill();

                if (isHighlight) { ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 50; }
                else { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; }
                ctx.strokeStyle = isHighlight ? '#FFD700' : 'rgba(255,215,0,0.1)';
                ctx.lineWidth = isHighlight ? 2.5 : 0.5; ctx.stroke(); ctx.shadowBlur = 0;

                const mid = start + step / 2; const tr = r * 0.62;
                const x = cx + Math.cos(mid) * tr; const y = cy + Math.sin(mid) * tr;

                ctx.save(); ctx.translate(x, y); ctx.rotate(mid + (mid > Math.PI / 2 ? Math.PI : 0));
                ctx.fillStyle = isHighlight ? '#0a0a0a' : '#fff';
                ctx.font = isHighlight ? 'bold 19px sans-serif' : '17px sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8;
                ctx.fillText(p.icon || '🎁', 0, 0); ctx.shadowBlur = 0; ctx.restore();
            });

            const centerR = r * 0.16; const centerIcon = settingsCache.center_icon || '⭐';
            const gradC = ctx.createRadialGradient(cx - 4, cy - 4, 0, cx, cy, centerR);
            gradC.addColorStop(0, '#FFD700'); gradC.addColorStop(0.3, '#FFA500'); gradC.addColorStop(0.7, '#FF8C00'); gradC.addColorStop(1, '#B8860B');
            ctx.beginPath(); ctx.arc(cx, cy, centerR, 0, 2 * Math.PI); ctx.fillStyle = gradC; ctx.shadowColor = 'rgba(255, 215, 0, 0.5)'; ctx.shadowBlur = 40; ctx.fill(); ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.arc(cx, cy, centerR + 5, 0, 2 * Math.PI); ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#0a0a0a'; ctx.font = '32px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(centerIcon, cx, cy + 1);
        }

        function animateSpin(targetRotation, duration, callback) {
            const canvas = document.getElementById('wheelCanvas');
            canvas.classList.add('spinning');
            const startRotation = currentRotation; const startTime = performance.now();
            function animate(time) {
                const elapsed = time - startTime; const progress = Math.min(elapsed / duration, 1);
                const easeOutCubic = 1 - Math.pow(1 - progress, 3);
                const currentAngle = startRotation + (targetRotation - startRotation) * easeOutCubic;
                currentRotation = currentAngle;
                drawWheel(prizesCache, -1, currentAngle);
                if (progress < 1) requestAnimationFrame(animate);
                else { currentRotation = targetRotation; canvas.classList.remove('spinning'); if (callback) callback(); }
            }
            requestAnimationFrame(animate);
        }

        async function loadSettings() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/settings?admin_id=${ADMIN_ID}`);
                const data = await res.json();
                if (data.success) {
                    settingsCache = data.settings;
                    if (settingsCache.banner_text) document.getElementById('bannerText').textContent = settingsCache.banner_text;
                    if (settingsCache.bg_image_url) document.getElementById('bgImage').src = settingsCache.bg_image_url;
                    if (settingsCache.loading_image_url) document.getElementById('loadingImage').src = settingsCache.loading_image_url;
                    spinDuration = parseInt(settingsCache.spin_duration) || 3500;
                    startAudioUrl = settingsCache.start_audio_url || '';
                    document.getElementById('editBannerText').value = settingsCache.banner_text || '';
                    document.getElementById('editBgImage').value = settingsCache.bg_image_url || '';
                    document.getElementById('editLoadingImage').value = settingsCache.loading_image_url || '';
                    document.getElementById('editCenterIcon').value = settingsCache.center_icon || '⭐';
                    document.getElementById('editSpinDuration').value = settingsCache.spin_duration || 3500;
                    document.getElementById('editIntervalHours').value = settingsCache.spin_interval_hours || 24;
                    document.getElementById('editIsActive').checked = settingsCache.is_active === 'true';
                    document.getElementById('editDepositRequired').checked = settingsCache.deposit_required === 'true';
                    document.getElementById('editDepositMin').value = settingsCache.deposit_min_amount || 1000;
                    document.getElementById('editDepositHours').value = settingsCache.deposit_check_hours || 24;
                    document.getElementById('editStartAudioUrl').value = settingsCache.start_audio_url || '';
                    return data.settings;
                }
            } catch (e) {}
            return {};
        }

        async function saveSetting(key, value) {
            try {
                const response = await fetch(`${API_BASE}/api/admin/setting`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID, key: key, value: String(value) })
                });
                return response.ok;
            } catch (e) { return false; }
        }

        async function loadPrizes() {
            try {
                const response = await fetch(`${API_BASE}/api/wheel/prizes`);
                const data = await response.json();
                if (data.success) { prizesCache = data.prizes; return data.prizes; }
            } catch (e) {}
            return [];
        }

        async function loadUserStatus() {
            if (!USER_ID) return;
            try {
                const response = await fetch(`${API_BASE}/api/wheel/status?user_id=${USER_ID}`);
                const data = await response.json();
                const spinBtn = document.getElementById('spinBtn');
                const spinBtnText = document.getElementById('spinBtnText');
                const depositNotice = document.getElementById('depositNotice');

                if (data.success) {
                    if (data.can_spin) {
                        spinBtn.disabled = false; spinBtnText.textContent = '🎰 تدوير العجلة';
                    } else {
                        spinBtn.disabled = true; spinBtnText.textContent = `⏳ ${data.remaining_hours}h ${data.remaining_minutes}m`;
                    }
                    if (data.deposit_required) {
                        depositNotice.classList.add('show');
                        document.getElementById('depositMinAmount').textContent = data.deposit_min_amount;
                        document.getElementById('depositCheckHours').textContent = data.deposit_check_hours;
                        const statusEl = document.getElementById('depositStatus');
                        if (data.deposit_met) {
                            statusEl.innerHTML = 'الحالة: <span class="met">✅ مكتمل</span>';
                        } else {
                            statusEl.innerHTML = 'الحالة: <span class="not-met">❌ غير مكتمل</span>';
                            spinBtn.disabled = true;
                        }
                    } else { depositNotice.classList.remove('show'); }
                }
            } catch (e) {}
        }

        async function addPrize(name, icon, description, probability, color, color2) {
            try {
                const response = await fetch(`${API_BASE}/api/admin/prize`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID, name, icon, description, probability, color, color2 })
                });
                return response.ok;
            } catch (e) { return false; }
        }

        async function resetPrizes() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/prizes/reset`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID })
                });
                return response.ok;
            } catch (e) { return false; }
        }

        async function refreshAll() {
            await loadSettings();
            const prizes = await loadPrizes();
            drawWheel(prizes, -1, currentRotation);
            await loadUserStatus();
            if (USER_ID === ADMIN_ID) renderAdminPanel();
        }

        function renderAdminPanel() {
            if (USER_ID !== ADMIN_ID) return;
            const panel = document.getElementById('adminPanel');
            panel.classList.add('show');
            const list = document.getElementById('prizesList');
            list.innerHTML = '';
            prizesCache.forEach(p => {
                const item = document.createElement('div');
                item.className = 'prize-item';
                item.innerHTML = `
                    <div class="prize-icon-small">${p.icon}</div>
                    <div class="prize-info">
                        <input type="text" class="name-input" value="${p.name}" onchange="updatePrizeField(${p.id}, 'name', this.value)">
                        <input type="text" class="desc-input" value="${p.description || ''}" onchange="updatePrizeField(${p.id}, 'description', this.value)">
                    </div>
                    <div class="prize-prob">
                        <input type="number" class="prob-input" value="${p.probability}" onchange="updatePrizeField(${p.id}, 'probability', this.value)">
                        <span class="prob-label">%</span>
                    </div>
                    <button class="btn-delete" onclick="deletePrize(${p.id})">🗑️</button>
                `;
                list.appendChild(item);
            });
        }

        async function updatePrizeField(id, field, value) {
            try {
                await fetch(`${API_BASE}/api/admin/prize`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: ADMIN_ID, prize_id: id, [field]: value })
                });
                await refreshAll();
            } catch (e) {}
        }

        async function deletePrize(id) {
            if (!confirm('حذف الجائزة؟')) return;
            try {
                await fetch(`${API_BASE}/api/admin/prize?admin_id=${ADMIN_ID}&prize_id=${id}`, { method: 'DELETE' });
                await refreshAll();
            } catch (e) {}
        }

        function createWinEffects(text) {
            const container = document.getElementById('confettiContainer');
            container.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + '%';
                c.style.backgroundColor = ['#FFD700', '#FF8C00', '#FFFFFF', '#FFD700'][Math.floor(Math.random() * 4)];
                c.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(c);
            }
            showNotification(`🎉 مبروك! لقد فزت بـ ${text}!`);
        }

        function clearWinEffects() {
            document.getElementById('confettiContainer').innerHTML = '';
            document.getElementById('resultBox').classList.remove('winner');
        }

        function showNotification(message) {
            const bar = document.getElementById('notificationBar');
            document.getElementById('notifPrizeName').textContent = message.replace('🎉 مبروك! لقد فزت بـ ', '').replace('!', '');
            bar.classList.add('show');
            setTimeout(() => bar.classList.remove('show'), 4000);
        }

        function updateLoading(progress) {
            document.getElementById('loaderProgressBar').style.width = progress + '%';
            document.getElementById('loaderStatusText').textContent = progress + '%';
        }

        function showLoading(show) {
            const screen = document.getElementById('loadingScreen');
            const neonWrapper = document.getElementById('neonWrapper');
            if (show) { screen.classList.add('active'); neonWrapper.style.display = 'none'; }
            else { screen.classList.remove('active'); neonWrapper.style.display = 'flex'; }
        }

        async function checkConnection() {
            try {
                const res = await fetch(`${API_BASE}/api/status`);
                return res.ok;
            } catch (e) { return false; }
        }

        async function spinWheel() {
            if (isSpinning || !USER_ID || document.getElementById('spinBtn').disabled) return;
            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true; spinBtn.classList.add('loading');
            document.getElementById('spinBtnText').textContent = 'جاري التدوير...';
            document.getElementById('resultBox').classList.remove('show');
            clearWinEffects();
            
            soundManager.init();
            soundManager.playSpinSound(); // تشغيل صوت الدوران

            try {
                const response = await fetch(`${API_BASE}/api/wheel/spin`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: USER_ID })
                });
                const data = await response.json();
                spinBtn.classList.remove('loading');
                if (data.success) {
                    const prize = data.spin.prize;
                    const prizeIndex = prizesCache.findIndex(p => p.id === prize.id);
                    const isWin = !prize.name.includes('حظ سعيد');
                    const targetIdx = prizeIndex === -1 ? Math.floor(Math.random() * prizesCache.length) : prizeIndex;
                    const step = (2 * Math.PI) / prizesCache.length;
                    const targetAngle = (targetIdx / prizesCache.length) * 2 * Math.PI;
                    const totalRotation = currentRotation + (4 * 2 * Math.PI) + (2 * Math.PI - targetAngle - (step / 2));
                    animateSpin(totalRotation, spinDuration, () => {
                        drawWheel(prizesCache, targetIdx, totalRotation);
                        showResult(prizeIndex === -1 ? prizesCache[targetIdx] : prize, isWin);
                    });
                } else {
                    showError(data.error || 'حدث خطأ');
                    if (data.remaining_hours !== undefined) {
                        spinBtn.disabled = true;
                        document.getElementById('spinBtnText').textContent = `⏳ ${data.remaining_hours}h ${data.remaining_minutes}m`;
                        soundManager.stopAll();
                    }
                    drawWheel(prizesCache, -1, currentRotation);
                }
            } catch (e) {
                spinBtn.classList.remove('loading'); showError('خطأ في الاتصال: ' + e.message);
                drawWheel(prizesCache, -1, currentRotation); soundManager.stopAll();
            }
            isSpinning = false;
        }

        function showResult(prize, isWin) {
            document.getElementById('prizeDesc').textContent = prize.description || prize.name || 'جائزة!';
            document.getElementById('resultBox').classList.add('show');
            if (isWin) {
                document.getElementById('resultBox').classList.add('winner');
                createWinEffects(prize.description || prize.name);
                soundManager.playWinSound(); // صوت الربح
            } else {
                soundManager.playLoseSound(); // صوت الخسارة
            }
            loadUserStatus();
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            document.getElementById('errorText').textContent = '❌ ' + msg;
            el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 5000);
        }

        // تشغيل الصوت الترحيبي عند الضغط على زر البدء
        function setupStartButton() {
            const startBtn = document.getElementById('startBtn');
            startBtn.onclick = () => {
                soundManager.init();
                soundManager.playStartAudio(startAudioUrl);
                startBtn.style.display = 'none';
                showLoading(false);
            };
        }

        async function init() {
            USER_ID = getUserId();
            if (!USER_ID) { document.getElementById('errorContainer').classList.add('show'); return; }
            showLoading(true); updateLoading(0);
            const isConnected = await checkConnection();
            if (!isConnected) { showLoading(false); showError('⚠️ فشل الاتصال بالخادم'); return; }
            updateLoading(30); await loadSettings();
            updateLoading(50); const prizes = await loadPrizes();
            updateLoading(70); drawWheel(prizes, -1, 0);
            updateLoading(85); await loadUserStatus();
            updateLoading(100);
            
            // عرض زر البدء بعد اكتمال التحميل
            setTimeout(() => {
                const startBtn = document.getElementById('startBtn');
                if (startAudioUrl) {
                    startBtn.style.display = 'block';
                } else {
                    showLoading(false);
                    if (USER_ID === ADMIN_ID) renderAdminPanel();
                }
            }, 500);
        }

        document.getElementById('spinBtn').onclick = spinWheel;
        document.getElementById('soundToggle').onchange = (e) => { soundEnabled = e.target.checked; };
        document.querySelectorAll('.btn-save').forEach(btn => {
            btn.onclick = async function() {
                const key = this.dataset.setting; const fieldId = this.dataset.field;
                const val = this.dataset.type === 'checkbox' ? document.getElementById(fieldId).checked : document.getElementById(fieldId).value;
                const oldText = this.textContent; this.textContent = '⏳';
                if (await saveSetting(key, val)) { this.textContent = '✅'; await refreshAll(); setTimeout(() => this.textContent = oldText, 2000); }
                else { this.textContent = '❌'; setTimeout(() => this.textContent = oldText, 2000); }
            };
        });
        document.getElementById('addPrizeBtn').onclick = async function() {
            const name = document.getElementById('newPrizeName').value;
            if (!name) return;
            if (await addPrize(name, document.getElementById('newPrizeIcon').value, document.getElementById('newPrizeDesc').value, document.getElementById('newPrizeProb').value, document.getElementById('newPrizeColor').value, document.getElementById('newPrizeColor2').value)) {
                await refreshAll(); showNotification('✅ تم الإضافة');
            }
        };
        document.getElementById('refreshPrizesBtn').onclick = () => refreshAll();
        document.getElementById('resetPrizesBtn').onclick = async () => { if (confirm('إعادة تعيين؟')) { await resetPrizes(); await refreshAll(); } };

        setupStartButton();
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
