<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>🎡 عجلة الحظ</title>
    
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* ============================================================
                   جميع الأنماط كما هي (نفس الكود السابق)
                   ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #0a0a0a;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(139,0,0,0.15), transparent 60%),
                        radial-gradient(ellipse at 70% 50%, rgba(255,215,0,0.08), transparent 60%);
            animation: bgFloat 20s ease-in-out infinite alternate;
            z-index: 0;
        }
        @keyframes bgFloat {
            0% { transform: translate(0,0) rotate(0deg); }
            100% { transform: translate(2%,3%) rotate(3deg); }
        }
        .container {
            position: relative;
            z-index: 1;
            background: linear-gradient(145deg, rgba(18,18,18,0.95), rgba(10,10,10,0.98));
            border-radius: 32px;
            padding: 28px 24px 24px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255,215,0,0.08);
            box-shadow: 0 20px 80px rgba(0,0,0,0.8), 0 0 60px rgba(255,215,0,0.03);
            backdrop-filter: blur(10px);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FF8C00, #FFD700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 3s ease-in-out infinite;
            letter-spacing: 1px;
        }
        @keyframes goldShine {
            0%,100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .header .subtitle { color: #555; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; }
        .header .subtitle span { color: #FFD700; }
        
        .user-status {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 10px 16px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .user-status .user-id { color: #666; font-size: 12px; }
        .user-status .user-id span { color: #FFD700; font-weight: 600; background: rgba(255,215,0,0.06); padding: 2px 12px; border-radius: 6px; border: 1px solid rgba(255,215,0,0.06); }
        .user-status .spin-info { color: #555; font-size: 12px; display: flex; gap: 14px; }
        .user-status .spin-info .count { color: #FFD700; }
        .user-status .spin-info .wins { color: #FF8C00; }
        
        .error-container { display: none; text-align: center; padding: 40px 20px; }
        .error-container.show { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .error-container .error-icon { font-size: 52px; margin-bottom: 12px; }
        .error-container .error-title { color: #FFD700; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .error-container .error-text { color: #777; font-size: 14px; line-height: 1.7; }
        .error-container .error-text .highlight { color: #FFD700; }
        .error-container .btn-open-bot {
            margin-top: 18px;
            padding: 14px 36px;
            background: linear-gradient(135deg, #B8860B, #FFD700);
            border: none;
            border-radius: 14px;
            color: #0a0a0a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .error-container .btn-open-bot:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(255,215,0,0.2); }
        
        .loading-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 20px;
            min-height: 350px;
        }
        .loading-screen.active { display: flex; animation: fadeIn 0.5s ease; }
        .loading-screen .loader-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255,215,0,0.05);
            border-top: 3px solid #FFD700;
            border-bottom: 3px solid #FF8C00;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 40px rgba(255,215,0,0.1);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-screen .loader-icon { margin-top: -55px; font-size: 28px; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .loading-screen .loader-title { color: #FFD700; font-size: 18px; font-weight: 700; margin-top: 20px; }
        .loading-screen .loader-sub { color: #666; font-size: 13px; margin-top: 6px; }
        .loading-screen .loader-progress { width: 100%; max-width: 250px; height: 3px; background: rgba(255,255,255,0.04); border-radius: 4px; margin-top: 16px; overflow: hidden; }
        .loading-screen .loader-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #FFD700, #FF8C00); border-radius: 4px; transition: width 0.3s ease; }
        .loading-screen .loader-status-text { color: #555; font-size: 12px; margin-top: 10px; }
        
        .wheel-container {
            display: none;
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            aspect-ratio: 1/1;
        }
        .wheel-container.show { display: block; animation: fadeIn 0.6s ease; }
        .wheel-wrapper { position: relative; width: 100%; height: 100%; }
        .wheel-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255,215,0,0.04), inset 0 0 60px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,215,0,0.06);
            transition: filter 0.3s ease;
        }
        .wheel-wrapper canvas.spinning {
            filter: brightness(1.2) drop-shadow(0 0 50px rgba(255,215,0,0.15));
        }
        
        .pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 34px;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.3));
            animation: pointerBounce 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pointerBounce {
            0%,100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-4px); }
        }
        
        .no-prizes { display: none; text-align: center; padding: 40px 20px; }
        .no-prizes .icon { font-size: 40px; margin-bottom: 10px; }
        .no-prizes .text { color: #555; font-size: 14px; }
        
        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .btn {
            padding: 15px 24px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .btn-spin {
            background: linear-gradient(135deg, #B8860B, #FFD700);
            color: #0a0a0a;
            box-shadow: 0 4px 30px rgba(255,215,0,0.1);
            font-size: 17px;
            letter-spacing: 0.5px;
        }
        .btn-spin:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 40px rgba(255,215,0,0.2); }
        .btn-spin:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .btn-spin .spinner-small {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(10,10,10,0.1);
            border-top: 2px solid #0a0a0a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        .btn-spin.loading .spinner-small { display: inline-block; }
        
        .result-box {
            background: rgba(255,215,0,0.02);
            border: 1px solid rgba(255,215,0,0.06);
            border-radius: 14px;
            padding: 16px;
            margin-top: 14px;
            text-align: center;
            display: none;
        }
        .result-box.show { display: block; animation: resultPop 0.5s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes resultPop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .result-box .prize-icon { font-size: 38px; animation: pulse 1.5s ease-in-out infinite; }
        .result-box .prize-name { font-size: 20px; font-weight: 700; color: #FFD700; margin-top: 4px; }
        .result-box .prize-desc { color: #777; font-size: 13px; margin-top: 2px; }
        
        .deposit-notice {
            background: rgba(255,215,0,0.03);
            border: 1px solid rgba(255,215,0,0.06);
            border-radius: 10px;
            padding: 10px 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .deposit-notice.show { display: block; }
        .deposit-notice .notice-text { color: #FF8C00; font-size: 13px; }
        .deposit-notice .notice-text .amount { color: #FFD700; font-weight: 700; }
        
        .error-msg {
            background: rgba(255,0,0,0.04);
            border: 1px solid rgba(255,0,0,0.06);
            border-radius: 10px;
            padding: 12px;
            color: #FF6B6B;
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .error-msg.show { display: block; animation: fadeIn 0.3s ease; }
        
        @media (max-width: 420px) {
            .container { padding: 16px; }
            .header h1 { font-size: 22px; }
            .btn { font-size: 14px; padding: 13px 18px; }
            .user-status { flex-direction: column; text-align: center; }
            .user-status .spin-info { justify-content: center; }
            .pointer { font-size: 28px; top: -12px; }
        }
    </style>
</head>
<body>

<div class="container" id="app">

    <div class="header">
        <h1>🎡 عجلة الحظ</h1>
        <div class="subtitle"><span>IChancy</span> · دور واربح</div>
    </div>

    <div class="user-status" id="userStatus">
        <div class="user-id">👤 <span id="userIdDisplay">---</span></div>
        <div class="spin-info">
            <span>🎡 <span class="count" id="totalSpins">0</span></span>
            <span>🏆 <span class="wins" id="totalWins">0</span></span>
            <span id="depositStatus"></span>
        </div>
    </div>

    <div class="error-container" id="errorContainer">
        <div class="error-icon">⚠️</div>
        <div class="error-title">يجب الدخول من البوت</div>
        <div class="error-text">
            لا يمكن الوصول إلى معرف المستخدم.<br>
            يرجى فتح العجلة من خلال <span class="highlight">بوت IChancy</span>.
        </div>
        <button class="btn-open-bot" onclick="window.open('https://t.me/IChancyBot', '_blank')">🚀 فتح البوت</button>
    </div>

    <div class="loading-screen" id="loadingScreen">
        <div class="loader-ring"></div>
        <div class="loader-icon">🎯</div>
        <div class="loader-title">جاري الاتصال بالخادم</div>
        <div class="loader-sub" id="loaderSub">التحقق من الخادم...</div>
        <div class="loader-progress">
            <div class="loader-progress-bar" id="loaderProgressBar"></div>
        </div>
        <div class="loader-status-text" id="loaderStatusText">0%</div>
    </div>

    <div class="wheel-container" id="wheelContainer">
        <div class="wheel-wrapper">
            <div class="pointer" id="pointer">🔽</div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
        </div>
    </div>

    <div class="no-prizes" id="noPrizes">
        <div class="icon">⚠️</div>
        <div class="text">لا توجد جوائز متاحة</div>
    </div>

    <div class="actions">
        <button class="btn btn-spin" id="spinBtn" disabled>
            <span class="spinner-small"></span>
            <span id="spinBtnText">🎰 تدوير العجلة</span>
        </button>
    </div>

    <div class="deposit-notice" id="depositNotice">
        <div class="notice-text">
            💰 مطلوب إيداع <span class="amount" id="depositMinAmount">0</span> SYP
            خلال <span id="depositCheckHours">24</span> ساعة
        </div>
    </div>

    <div class="error-msg" id="errorMsg">
        <span id="errorText"></span>
    </div>

    <div class="result-box" id="resultBox">
        <div class="prize-icon" id="prizeIcon">🎁</div>
        <div class="prize-name" id="prizeName">جائزة!</div>
        <div class="prize-desc" id="prizeDesc"></div>
    </div>

</div>

<script>
// ================================================================
//                      الإعدادات الأساسية
// ================================================================
const API_BASE = 'https://joj-d0kl.onrender.com';
const ADMIN_ID = 7011476249;
let USER_ID = null;
let isSpinning = false;
let prizesCache = [];
let currentRotation = 0;

// ================================================================
//                      جلب USER_ID
// ================================================================
function getUserId() {
    const params = new URLSearchParams(window.location.search);
    let id = params.get('user_id') || params.get('userId') || params.get('id');
    if (id && !isNaN(id)) {
        USER_ID = parseInt(id);
        localStorage.setItem('wheel_user_id', USER_ID);
        document.getElementById('userIdDisplay').textContent = USER_ID;
        return USER_ID;
    }
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            const user = window.Telegram.WebApp.initDataUnsafe?.user;
            if (user && user.id) {
                USER_ID = user.id;
                localStorage.setItem('wheel_user_id', USER_ID);
                document.getElementById('userIdDisplay').textContent = USER_ID;
                return USER_ID;
            }
        }
    } catch(e) {}
    id = localStorage.getItem('wheel_user_id');
    if (id) {
        USER_ID = parseInt(id);
        document.getElementById('userIdDisplay').textContent = USER_ID;
        return USER_ID;
    }
    return null;
}

// ================================================================
//                      رسم العجلة مع إمكانية الدوران
// ================================================================
function drawWheel(prizes, highlightIndex = -1, rotation = 0) {
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const cx = w/2, cy = h/2;
    const r = Math.min(w, h)/2 - 10;
    const noPrizes = document.getElementById('noPrizes');
    const container = document.getElementById('wheelContainer');
    
    if (!prizes || prizes.length === 0) {
        noPrizes.style.display = 'block';
        container.classList.remove('show');
        return;
    }
    
    noPrizes.style.display = 'none';
    container.classList.add('show');
    ctx.clearRect(0, 0, w, h);
    
    const total = prizes.length;
    const step = (2 * Math.PI) / total;
    
    const colors = [
        '#1a1a2e', '#16213e', '#0f3460', '#1a1a2e', 
        '#2d1b3d', '#1a0a0a', '#0a1a2e', '#2a1a2a',
        '#1a2a1a', '#2a1a3a'
    ];
    
    prizes.forEach((p, i) => {
        const start = i * step + rotation;
        const end = start + step;
        const isHighlight = (i === highlightIndex);
        
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, end);
        ctx.closePath();
        
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        const color1 = isHighlight ? '#FFD700' : colors[i % colors.length];
        const color2 = isHighlight ? '#FF8C00' : colors[(i + 3) % colors.length];
        grad.addColorStop(0, color1);
        grad.addColorStop(1, color2);
        ctx.fillStyle = grad;
        ctx.fill();
        
        // خطوط ذهبية متوهجة
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = isHighlight ? 25 : 8;
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = isHighlight ? 3 : 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, start);
        ctx.lineTo(cx + r * Math.cos(start), cy + r * Math.sin(start));
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        // النص
        const mid = start + step/2;
        const tr = r * 0.65;
        const x = cx + Math.cos(mid) * tr;
        const y = cy + Math.sin(mid) * tr;
        
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(mid + (mid > Math.PI/2 ? Math.PI : 0));
        
        ctx.fillStyle = isHighlight ? '#0a0a0a' : '#ffffff';
        ctx.font = isHighlight ? 'bold 16px sans-serif' : 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 6;
        
        let displayName = p.name.replace(/^[\u{1F000}-\u{1FFFF}]|^[\u2600}-\u{27BF}]|^[\u{1F300}-\u{1F5FF}]|^[\u{1F600}-\u{1F64F}]|^[\u{1F680}-\u{1F6FF}]|^[\u{1F700}-\u{1F77F}]|^[\u{1F780}-\u{1F7FF}]|^[\u{1F800}-\u{1F8FF}]|^[\u{1F900}-\u{1F9FF}]|^[\u{1FA00}-\u{1FA6F}]|^[\u{1FA70}-\u{1FAFF}]|^[\u{1FB00}-\u{1FBFF}]|^[\u{1FC00}-\u{1FCFF}]|^[\u{1FD00}-\u{1FDFF}]|^[\u{1FE00}-\u{1FEFF}]|^[\u{1FF00}-\u{1FFFF}]|^\p{Emoji}/u, '').trim();
        
        if (displayName.length > 12) {
            const midIdx = Math.floor(displayName.length / 2);
            ctx.fillText(displayName.substring(0, midIdx), 0, -10);
            ctx.fillText(displayName.substring(midIdx), 0, 14);
        } else {
            ctx.fillText(displayName, 0, 0);
        }
        
        ctx.shadowBlur = 0;
        ctx.restore();
    });
    
    // الدائرة المركزية
    const centerR = r * 0.13;
    const grad = ctx.createRadialGradient(cx-4, cy-4, 0, cx, cy, centerR);
    grad.addColorStop(0, '#FFD700');
    grad.addColorStop(0.5, '#FF8C00');
    grad.addColorStop(1, '#B8860B');
    
    ctx.beginPath();
    ctx.arc(cx, cy, centerR, 0, 2 * Math.PI);
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(255, 215, 0, 0.3)';
    ctx.shadowBlur = 25;
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = '#0a0a0a';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText('⭐', cx, cy + 1);
    ctx.shadowBlur = 0;
    
    ctx.beginPath();
    ctx.arc(cx, cy, centerR + 4, 0, 2 * Math.PI);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.12)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    ctx.beginPath();
    ctx.arc(cx, cy, r - 2, 0, 2 * Math.PI);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
}

// ================================================================
//                      تحميل الجوائز
// ================================================================
async function loadPrizes() {
    try {
        const res = await fetch(`${API_BASE}/api/admin/prizes?admin_id=${ADMIN_ID}`);
        const data = await res.json();
        if (data.success && data.prizes && data.prizes.length > 0) {
            prizesCache = data.prizes;
            return data.prizes;
        }
        return [];
    } catch(e) {
        console.error('Error loading prizes:', e);
        return [];
    }
}

// ================================================================
//                      تحميل حالة المستخدم
// ================================================================
async function loadUserStatus() {
    if (!USER_ID) return;
    try {
        const res = await fetch(`${API_BASE}/api/wheel/history/${USER_ID}`);
        const data = await res.json();
        if (data.success) {
            document.getElementById('totalSpins').textContent = data.stats?.total_spins || 0;
            document.getElementById('totalWins').textContent = data.stats?.wins || 0;
            
            const depositNotice = document.getElementById('depositNotice');
            const depositStatus = document.getElementById('depositStatus');
            
            if (data.deposit_requirement?.required) {
                document.getElementById('depositMinAmount').textContent = data.deposit_requirement.min_amount || 0;
                document.getElementById('depositCheckHours').textContent = data.deposit_requirement.check_hours || 24;
                if (data.deposit_requirement.is_met) {
                    depositNotice.classList.remove('show');
                    depositStatus.innerHTML = '💰 ✔';
                } else {
                    depositNotice.classList.add('show');
                    depositStatus.innerHTML = '💰 ⚠️';
                }
            } else {
                depositNotice.classList.remove('show');
                depositStatus.innerHTML = '';
            }
            
            const spinBtn = document.getElementById('spinBtn');
            const canSpin = data.spin_status?.can_spin !== false && 
                           (!data.deposit_requirement?.required || data.deposit_requirement?.is_met);
            
            if (canSpin && prizesCache.length > 0) {
                spinBtn.disabled = false;
                document.getElementById('spinBtnText').textContent = '🎰 تدوير العجلة';
            } else if (!data.spin_status?.can_spin) {
                spinBtn.disabled = true;
                const h = data.spin_status?.remaining_hours || 0;
                const m = data.spin_status?.remaining_minutes || 0;
                document.getElementById('spinBtnText').textContent = `⏳ ${h}h ${m}m`;
            } else if (data.deposit_requirement?.required && !data.deposit_requirement?.is_met) {
                spinBtn.disabled = true;
                document.getElementById('spinBtnText').textContent = '💰 إيداع مطلوب';
            } else {
                spinBtn.disabled = true;
                document.getElementById('spinBtnText').textContent = '⏳ جاري التحميل...';
            }
        }
    } catch(e) {
        console.error('Error loading user status:', e);
    }
}

// ================================================================
//                      شاشة اللودينغ
// ================================================================
function updateLoading(progress, status) {
    const bar = document.getElementById('loaderProgressBar');
    const text = document.getElementById('loaderStatusText');
    const sub = document.getElementById('loaderSub');
    bar.style.width = progress + '%';
    text.textContent = progress + '%';
    if (status) sub.textContent = status;
}

function showLoading(show) {
    const screen = document.getElementById('loadingScreen');
    const container = document.getElementById('wheelContainer');
    if (show) {
        screen.classList.add('active');
        container.classList.remove('show');
    } else {
        screen.classList.remove('active');
        container.classList.add('show');
    }
}

// ================================================================
//                      تدوير العجلة - مع دوران فعلي
// ================================================================
async function spinWheel() {
    if (isSpinning || !USER_ID) return;
    if (document.getElementById('spinBtn').disabled) return;
    if (prizesCache.length === 0) {
        showError('لا توجد جوائز متاحة');
        return;
    }
    
    isSpinning = true;
    const spinBtn = document.getElementById('spinBtn');
    spinBtn.disabled = true;
    spinBtn.classList.add('loading');
    document.getElementById('spinBtnText').textContent = 'جاري التدوير...';
    
    document.getElementById('resultBox').classList.remove('show');
    document.getElementById('errorMsg').classList.remove('show');
    
    try {
        const response = await fetch(`${API_BASE}/api/wheel/spin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: USER_ID })
        });
        
        const data = await response.json();
        spinBtn.classList.remove('loading');
        
        if (data.success) {
            const prize = data.spin.prize;
            const prizeIndex = prizesCache.findIndex(p => p.id === prize.id);
            
            // ===== حساب زاوية التوقف =====
            const step = (2 * Math.PI) / prizesCache.length;
            // زاوية منتصف القسم الفائز (بالنسبة للمؤشر العلوي)
            const targetAngle = prizeIndex * step + step / 2;
            // دوران عشوائي (5-8 دورات كاملة) + زاوية الهدف
            const extraSpins = 5 + Math.random() * 3;
            const targetRotation = extraSpins * 2 * Math.PI + (2 * Math.PI - targetAngle);
            
            const canvas = document.getElementById('wheelCanvas');
            canvas.classList.add('spinning');
            
            // ===== دوران تدريجي =====
            const startRotation = currentRotation;
            const endRotation = startRotation + targetRotation;
            const duration = 3000 + Math.random() * 1000; // 3-4 ثواني
            const startTime = Date.now();
            
            function animateRotation() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // دالة تسارع (ease-out)
                const eased = 1 - Math.pow(1 - progress, 3);
                const currentAngle = startRotation + targetRotation * eased;
                
                drawWheel(prizesCache, -1, currentAngle);
                
                if (progress < 1) {
                    requestAnimationFrame(animateRotation);
                } else {
                    currentRotation = endRotation;
                    canvas.classList.remove('spinning');
                    
                    // ===== عرض النتيجة =====
                    document.getElementById('prizeIcon').textContent = prize.icon || '🎁';
                    document.getElementById('prizeName').textContent = prize.name;
                    document.getElementById('prizeDesc').textContent = prize.description || 'مبروك!';
                    document.getElementById('resultBox').classList.add('show');
                    
                    // إبراز الجائزة
                    drawWheel(prizesCache, prizeIndex, endRotation);
                    await loadUserStatus();
                }
            }
            
            animateRotation();
            
        } else {
            showError(data.error || 'حدث خطأ');
            if (data.remaining_hours !== undefined) {
                const btn = document.getElementById('spinBtn');
                btn.disabled = true;
                document.getElementById('spinBtnText').textContent = `⏳ ${data.remaining_hours}h ${data.remaining_minutes}m`;
            }
        }
        
    } catch(e) {
        spinBtn.classList.remove('loading');
        showError('خطأ في الاتصال: ' + e.message);
    }
    
    isSpinning = false;
    if (!document.getElementById('spinBtn').disabled) {
        document.getElementById('spinBtnText').textContent = '🎰 تدوير العجلة';
    }
}

// ================================================================
//                      عرض الخطأ
// ================================================================
function showError(msg) {
    const el = document.getElementById('errorMsg');
    document.getElementById('errorText').textContent = '❌ ' + msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 5000);
}

// ================================================================
//                      التهيئة
// ================================================================
async function init() {
    USER_ID = getUserId();
    
    if (!USER_ID) {
        document.getElementById('errorContainer').classList.add('show');
        document.getElementById('userStatus').style.display = 'none';
        return;
    }
    
    document.getElementById('userIdDisplay').textContent = USER_ID;
    
    showLoading(true);
    updateLoading(10, 'جاري التحقق من الخادم...');
    
    try {
        await new Promise(r => setTimeout(r, 500));
        updateLoading(30, 'جاري الاتصال بقاعدة البيانات...');
        
        const statusRes = await fetch(`${API_BASE}/api/status`);
        const statusData = await statusRes.json();
        
        if (!statusData.database?.ready) {
            updateLoading(60, 'قاعدة البيانات غير جاهزة، جاري التهيئة...');
            await new Promise(r => setTimeout(r, 800));
        }
        
        updateLoading(70, 'جاري تحميل الجوائز...');
        const prizes = await loadPrizes();
        drawWheel(prizes);
        
        updateLoading(85, 'جاري تحميل بيانات المستخدم...');
        await loadUserStatus();
        
        updateLoading(100, '✅ جاهز!');
        await new Promise(r => setTimeout(r, 400));
        
    } catch(e) {
        console.error('Init error:', e);
        updateLoading(100, '⚠️ فشل الاتصال');
        await new Promise(r => setTimeout(r, 600));
        showError('فشل الاتصال بالخادم');
    }
    
    showLoading(false);
    document.getElementById('spinBtn').onclick = spinWheel;
}

document.addEventListener('DOMContentLoaded', init);
</script>
